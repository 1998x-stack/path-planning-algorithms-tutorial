<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="to-t to-d"><title id="to-t">同一组目标点的两种访问顺序</title><desc id="to-d">左右两图使用相同的起点与六个目标点。左图沿最近邻顺序连接，折线出现交叉与折返；右图沿 2-opt 改进后的顺序连接，折返减少、总长度更短。</desc><rect width="980" height="400" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="230" y="30" font-size="16" fill="#203035" text-anchor="middle">A · 最近邻顺序（总长约 24.0）</text><text x="730" y="30" font-size="16" fill="#203035" text-anchor="middle">B · 2-opt 改进顺序（总长约 19.1）</text><g transform="translate(20,40)"><rect width="430" height="330" rx="10" fill="#eef4f0"/><polyline points="40,300 116,222 192,144 306,170 344,196 382,248 78,92" fill="none" stroke="#d06d4d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="300" r="7" fill="#203035"/><circle cx="116" cy="222" r="6" fill="#7461ba"/><circle cx="306" cy="170" r="6" fill="#7461ba"/><circle cx="78" cy="92" r="6" fill="#7461ba"/><circle cx="382" cy="248" r="6" fill="#7461ba"/><circle cx="192" cy="144" r="6" fill="#7461ba"/><circle cx="344" cy="196" r="6" fill="#7461ba"/><text x="30" y="322" font-size="13" fill="#203035">起点</text></g><g transform="translate(530,40)"><rect width="430" height="330" rx="10" fill="#eef4f0"/><polyline points="40,300 116,222 78,92 192,144 306,170 344,196 382,248" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="300" r="7" fill="#203035"/><circle cx="116" cy="222" r="6" fill="#7461ba"/><circle cx="306" cy="170" r="6" fill="#7461ba"/><circle cx="78" cy="92" r="6" fill="#7461ba"/><circle cx="382" cy="248" r="6" fill="#7461ba"/><circle cx="192" cy="144" r="6" fill="#7461ba"/><circle cx="344" cy="196" r="6" fill="#7461ba"/><text x="30" y="322" font-size="13" fill="#203035">起点</text></g><text x="490" y="392" font-size="14" fill="#53676d" text-anchor="middle">紫色圆点为六个固定目标点；两图点集相同，仅访问顺序不同。</text></g></svg>
