<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">可纳与一致性的三节点检验</title><desc id="d">S到A边权2，A到G边权3，S直达G边权7；启发式分别为5、3、0，满足逐边一致性。</desc><rect width="960" height="470" rx="16" fill="#fffdf9"/><g font-family="Arial, PingFang SC, sans-serif"><text x="39" y="49" font-size="19" fill="#53676d">真实最短 S → A → G = 2 + 3 = 5，而 S → G 的直达代价为 7</text><path d="M 130 293 L 440 132 L 793 293" fill="none" stroke="#147f80" stroke-width="6" stroke-linecap="round"/><path d="M 130 293 Q 454 414 793 293" fill="none" stroke="#d06d4d" stroke-width="4" stroke-dasharray="10 7"/><g fill="#fff" stroke="#203035" stroke-width="3"><circle cx="130" cy="293" r="35"/><circle cx="440" cy="132" r="35"/><circle cx="793" cy="293" r="35"/></g><g font-size="22" fill="#203035" font-weight="700" text-anchor="middle"><text x="130" y="301">S</text><text x="440" y="140">A</text><text x="793" y="301">G</text></g><g font-size="20" fill="#147f80"><text x="290" y="183">c=2</text><text x="624" y="183">c=3</text></g><text x="443" y="389" font-size="20" fill="#d06d4d">直达 c=7</text><g font-size="16" fill="#53676d"><text x="74" y="355">h(S)=5</text><text x="408" y="76">h(A)=3</text><text x="764" y="354">h(G)=0</text></g><rect x="75" y="415" width="818" height="40" rx="9" fill="#e9f3ed"/><text x="97" y="443" font-size="16" fill="#203035">一致性检验：5 ≤ 2 + 3；3 ≤ 3 + 0；5 ≤ 7 + 0</text></g></svg>
