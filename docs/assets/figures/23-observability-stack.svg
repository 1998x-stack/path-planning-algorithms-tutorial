<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">地图搜索路径控制的四层可观测性</title><desc id="d">四层数据从地图和位姿输入到OPEN CLOSED，再到路径结果与执行偏差，并携带版本和时间戳。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="36" y="48" font-size="22" font-weight="700" fill="#203035">Plan → Observe → Diagnose</text><rect x="20" y="126" width="218" height="232" rx="13" fill="#f0f7f1" stroke="#cbdacf"/><circle cx="50" cy="159" r="18" fill="#147f80"/><text x="50" y="166" text-anchor="middle" fill="white" font-size="19">1</text><text x="36" y="224" font-size="22" fill="#203035" font-weight="700">地图 / 位姿</text><text x="36" y="276" font-size="16" fill="#53676d">frame、resolution</text><text x="36" y="323" font-size="16" fill="#7461ba">map_hash</text><rect x="256" y="126" width="218" height="232" rx="13" fill="#f6f2fa" stroke="#d7cbea"/><circle cx="286" cy="159" r="18" fill="#147f80"/><text x="286" y="166" text-anchor="middle" fill="white" font-size="19">2</text><text x="272" y="224" font-size="22" fill="#203035" font-weight="700">搜索状态</text><text x="272" y="276" font-size="16" fill="#53676d">OPEN、CLOSED</text><text x="272" y="323" font-size="16" fill="#7461ba">g、h、f</text><rect x="492" y="126" width="218" height="232" rx="13" fill="#f0f7f1" stroke="#cbdacf"/><circle cx="522" cy="159" r="18" fill="#147f80"/><text x="522" y="166" text-anchor="middle" fill="white" font-size="19">3</text><text x="508" y="224" font-size="22" fill="#203035" font-weight="700">输出路径</text><text x="508" y="276" font-size="16" fill="#53676d">边、曲率、净空</text><text x="508" y="323" font-size="16" fill="#7461ba">footprint</text><rect x="728" y="126" width="218" height="232" rx="13" fill="#f6f2fa" stroke="#d7cbea"/><circle cx="758" cy="159" r="18" fill="#d06d4d"/><text x="758" y="166" text-anchor="middle" fill="white" font-size="19">4</text><text x="744" y="224" font-size="22" fill="#203035" font-weight="700">控制执行</text><text x="744" y="276" font-size="16" fill="#53676d">cmd、odom、error</text><text x="744" y="323" font-size="16" fill="#7461ba">stamp</text><text x="36" y="426" font-size="15" fill="#53676d">任一层的输入版本或时间基准变了，必须能回溯并重现后续决策。</text></g></svg>
