<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="inc-t inc-d"><title id="inc-t">增量搜索：边代价变化后只重展开局部区域</title><desc id="inc-d">左图是代价变化前的搜索范围，几乎覆盖整张网格，青绿折线为找到的路径。右图是代价变化后的修复：只重展开红框内的少量单元，其余单元的 g/rhs 被复用，最终路径随之改变。</desc><rect width="900" height="420" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="70" y="90" width="308" height="220" rx="8" fill="#eef4f0" stroke="#cbd9d2"/><rect x="500" y="90" width="308" height="220" rx="8" fill="#eef4f0" stroke="#cbd9d2"/><rect x="544" y="178" width="88" height="88" fill="#f0d3c9" stroke="#d06d4d" stroke-width="2" stroke-dasharray="6 4"/><text x="588" y="230" font-size="13" fill="#a5482c" text-anchor="middle">重新展开</text><polyline points="92,288 92,244 136,244 136,200 180,200 180,156 224,156 224,112 356,112" fill="none" stroke="#147f80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="522,288 522,244 566,244 566,200 610,200 610,156 654,156 654,112 786,112" fill="none" stroke="#147f80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="92" cy="288" r="7" fill="#203035"/><circle cx="356" cy="112" r="7" fill="#7461ba"/><circle cx="522" cy="288" r="7" fill="#203035"/><circle cx="786" cy="112" r="7" fill="#7461ba"/><text x="224" y="70" font-size="15" fill="#203035" text-anchor="middle">A · 变化前：搜索范围大</text><text x="654" y="70" font-size="15" fill="#203035" text-anchor="middle">B · 变化后：只修复局部</text><text x="92" y="312" font-size="13" fill="#203035" text-anchor="middle">起点</text><text x="356" y="102" font-size="13" fill="#7461ba" text-anchor="middle">目标</text><text x="522" y="312" font-size="13" fill="#203035" text-anchor="middle">起点</text><text x="786" y="102" font-size="13" fill="#7461ba" text-anchor="middle">目标</text><rect x="70" y="366" width="18" height="18" fill="#eef4f0" stroke="#cbd9d2"/><text x="96" y="381" font-size="14" fill="#53676d">复用的旧结果</text><rect x="260" y="366" width="18" height="18" fill="#f0d3c9" stroke="#d06d4d"/><text x="286" y="381" font-size="14" fill="#53676d">代价变化后重算的单元</text><line x1="560" y1="375" x2="600" y2="375" stroke="#147f80" stroke-width="5"/><text x="610" y="381" font-size="14" fill="#53676d">当前路径（示意）</text></g></svg>
