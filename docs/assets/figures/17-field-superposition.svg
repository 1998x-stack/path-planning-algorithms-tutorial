<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">吸引势与斥力势叠加形成总势场</title><desc id="desc">目标产生低势能谷，障碍产生高势能丘，机器人沿总势场负梯度方向移动。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="45" y="83" width="870" height="300" rx="15" fill="#f2f7f3" stroke="#d7e3da"/><g fill="none" stroke-width="3"><ellipse cx="765" cy="230" rx="115" ry="55" stroke="#147f80"/><ellipse cx="765" cy="230" rx="77" ry="37" stroke="#147f80"/><ellipse cx="765" cy="230" rx="39" ry="19" stroke="#147f80"/><circle cx="300" cy="220" r="105" stroke="#d06d4d"/><circle cx="300" cy="220" r="76" stroke="#d06d4d"/><circle cx="300" cy="220" r="48" stroke="#d06d4d"/></g><circle cx="300" cy="220" r="16" fill="#536767"/><circle cx="765" cy="230" r="13" fill="#147f80"/><path d="M120 300 Q 190 340 260 295 T 430 250 T 620 232" stroke="#7461ba" stroke-width="5" fill="none"/><path d="M430 250 l-18 -5 l9 18" stroke="#7461ba" stroke-width="4" fill="none"/><text x="245" y="360" font-size="18" fill="#d06d4d">障碍斥力势</text><text x="710" y="330" font-size="18" fill="#147f80">目标吸引势</text><text x="43" y="435" font-size="15" fill="#53676d">等势线与路径为概念图；真正的方向由总势能梯度决定。</text></g></svg>
