<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Informed RRT星的椭圆采样必要条件</title><desc id="d">两个焦点起点S与目标G，路径长度上界c_best形成一个椭圆，任何可能更短的欧氏路线中间点必须在其内。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="51" y="81" width="857" height="313" rx="14" fill="#f1f6f1" stroke="#dce9de"/><ellipse cx="480" cy="232" rx="299" ry="114" fill="#daf0e7" stroke="#147f80" stroke-width="4"/><path d="M 289 232 L 480 145 L 671 232" stroke="#7461ba" stroke-width="3" stroke-dasharray="7 6" fill="none"/><path d="M 289 232 H 671" stroke="#147f80" stroke-width="3" stroke-dasharray="6 6"/><circle cx="289" cy="232" r="13" fill="#147f80"/><circle cx="671" cy="232" r="13" fill="#7461ba"/><text x="273" y="264" font-size="18" fill="#203035">S</text><text x="665" y="264" font-size="18" fill="#203035">G</text><text x="414" y="139" font-size="17" fill="#203035">内点 q</text><text x="48" y="435" font-size="15" fill="#53676d">焦点距离 ≤ c_best；椭圆内仍可能包含障碍，筛选改进潜力不代替碰撞检查。</text></g></svg>
