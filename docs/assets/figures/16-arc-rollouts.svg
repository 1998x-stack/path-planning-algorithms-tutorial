<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">DWA采样速度后积分为短时圆弧轨迹</title><desc id="desc">从同一初始位姿出发，直行与左右转弯候选轨迹经过障碍检查和制动筛选。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="36" y="80" width="888" height="310" rx="15" fill="#f2f7f3" stroke="#d7e3da"/><rect x="480" y="174" width="95" height="86" rx="7" fill="#536767"/><text x="491" y="222" font-size="18" fill="#fff">障碍</text><circle cx="138" cy="280" r="13" fill="#147f80"/><path d="M138 280 H460" stroke="#d06d4d" stroke-width="5" stroke-dasharray="10 7"/><path d="M138 280 Q 285 280 414 155 T 735 137" stroke="#147f80" stroke-width="5" fill="none"/><path d="M138 280 Q 275 330 414 328 T 738 348" stroke="#7461ba" stroke-width="5" fill="none"/><path d="M138 280 Q 285 235 410 230 T 740 225" stroke="#d06d4d" stroke-width="4" fill="none" stroke-dasharray="9 6"/><g font-size="17" fill="#203035"><text x="90" y="314">当前位姿</text><text x="744" y="132" fill="#147f80">候选 A</text><text x="744" y="353" fill="#7461ba">候选 B</text><text x="744" y="215" fill="#d06d4d">候选 C</text></g><text x="35" y="435" font-size="15" fill="#53676d">弧线是模型预测，不是实际测量轨迹；碰撞检查沿整条轨迹执行。</text></g></svg>
