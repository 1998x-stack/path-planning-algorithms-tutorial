<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="bm-t bm-d"><title id="bm-t">自行车模型几何与瞬时旋转中心</title><desc id="bm-d">车身用前后两个轮表示，轴距为 L；前轮相对车身偏转 δ。后轮与前轮的垂线交于瞬时旋转中心 ICR，后轴到 ICR 的距离是转弯半径 R。</desc><rect width="960" height="420" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="60" y="40" width="840" height="340" rx="12" fill="#eef4f0"/><line x1="662" y1="320" x2="420" y2="320" stroke="#147f80" stroke-width="2" stroke-dasharray="7 6"/><line x1="662" y1="320" x2="420" y2="180" stroke="#147f80" stroke-width="2" stroke-dasharray="7 6"/><rect x="402" y="176" width="36" height="148" rx="8" fill="#dfe9e3" stroke="#53676d" stroke-width="2"/><line x1="396" y1="320" x2="444" y2="320" stroke="#203035" stroke-width="7" stroke-linecap="round"/><line x1="400" y1="215" x2="440" y2="145" stroke="#203035" stroke-width="7" stroke-linecap="round"/><circle cx="420" cy="320" r="5" fill="#203035"/><circle cx="420" cy="180" r="5" fill="#203035"/><circle cx="662" cy="320" r="9" fill="#7461ba"/><text x="678" y="326" font-size="15" fill="#7461ba">ICR（瞬时旋转中心）</text><line x1="420" y1="180" x2="420" y2="110" stroke="#53676d" stroke-width="2" stroke-dasharray="4 4"/><text x="430" y="110" font-size="14" fill="#53676d">车身朝向</text><path d="M420 142 A 38 38 0 0 1 446 152" fill="none" stroke="#d06d4d" stroke-width="2.5"/><text x="452" y="146" font-size="15" fill="#d06d4d">δ</text><text x="300" y="252" font-size="15" fill="#203035">轴距 L</text><line x1="386" y1="180" x2="386" y2="320" stroke="#203035" stroke-width="2"/><text x="470" y="344" font-size="15" fill="#147f80">转弯半径 R</text><text x="196" y="396" font-size="14" fill="#53676d">示意图：δ 越大则 R=L/tanδ 越小；车辆只能沿半径 R≥R_min 的圆弧或直线运动。</text></g></svg>
