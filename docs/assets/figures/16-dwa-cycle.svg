<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="cy-t cy-d"><title id="cy-t">DWA 单个控制周期的预测-评分-执行循环</title><desc id="cy-d">四步横向排列：构建动态窗口、采样候选速度、预测轨迹并评分、执行最高分速度；底部一条回路箭头表示进入下一控制周期后重新开始。</desc><rect width="960" height="320" rx="18" fill="#fffdf9"/><defs><marker id="cy-ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><g font-family="Arial,PingFang SC,sans-serif" font-size="16"><rect x="20" y="70" width="200" height="84" rx="10" fill="#eef4f0" stroke="#147f80" stroke-width="2"/><text x="120" y="105" text-anchor="middle" fill="#203035">① 构建</text><text x="120" y="130" text-anchor="middle" fill="#203035">动态窗口</text><rect x="250" y="70" width="200" height="84" rx="10" fill="#eef4f0" stroke="#147f80" stroke-width="2"/><text x="350" y="105" text-anchor="middle" fill="#203035">② 采样候选</text><text x="350" y="130" text-anchor="middle" fill="#203035">(v, ω)</text><rect x="480" y="70" width="200" height="84" rx="10" fill="#eef4f0" stroke="#147f80" stroke-width="2"/><text x="580" y="105" text-anchor="middle" fill="#203035">③ 预测轨迹</text><text x="580" y="130" text-anchor="middle" fill="#203035">并评分</text><rect x="710" y="70" width="200" height="84" rx="10" fill="#fbe9e1" stroke="#d06d4d" stroke-width="2"/><text x="810" y="105" text-anchor="middle" fill="#203035">④ 执行</text><text x="810" y="130" text-anchor="middle" fill="#203035">最高分 (v, ω)</text><line x1="222" y1="112" x2="246" y2="112" stroke="#147f80" stroke-width="2.5" marker-end="url(#cy-ah)"/><line x1="452" y1="112" x2="476" y2="112" stroke="#147f80" stroke-width="2.5" marker-end="url(#cy-ah)"/><line x1="682" y1="112" x2="706" y2="112" stroke="#147f80" stroke-width="2.5" marker-end="url(#cy-ah)"/><path d="M810 154 L810 236 L120 236 L120 158" fill="none" stroke="#7461ba" stroke-width="2.5" marker-end="url(#cy-ah)"/><text x="465" y="266" text-anchor="middle" fill="#7461ba" font-size="15">下一控制周期：以新状态重新开始</text><text x="480" y="298" text-anchor="middle" fill="#53676d" font-size="14">控制周期通常为 100 ms 量级；图中时间尺度为教学示意。</text></g></svg>
