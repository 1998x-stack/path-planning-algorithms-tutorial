<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" role="img" aria-labelledby="ow-t ow-d"><title id="ow-t">权重改变路径形状</title><desc id="ow-d">三个面板使用相同的起点、终点与障碍物，仅改变目标函数中长度、平滑度、避障三项的权重比例，得到的路径分别偏直、偏平滑、偏远离障碍。</desc><rect width="980" height="340" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><g transform="translate(20,40)"><rect width="300" height="250" rx="10" fill="#eef4f0"/><text x="150" y="26" font-size="15" fill="#203035" text-anchor="middle">A · 重量长度</text><rect x="130" y="90" width="45" height="130" fill="#f0d3c9"/><path d="M40 210 Q160 120 260 210" fill="none" stroke="#147f80" stroke-width="4"/><circle cx="40" cy="210" r="7" fill="#203035"/><circle cx="260" cy="210" r="7" fill="#7461ba"/><text x="150" y="238" font-size="12" fill="#a5482c" text-anchor="middle">可能贴近障碍</text></g><g transform="translate(340,40)"><rect width="300" height="250" rx="10" fill="#eef4f0"/><text x="150" y="26" font-size="15" fill="#203035" text-anchor="middle">B · 重平滑</text><rect x="130" y="90" width="45" height="130" fill="#f0d3c9"/><path d="M40 210 C90 150 210 150 260 210" fill="none" stroke="#147f80" stroke-width="4"/><circle cx="40" cy="210" r="7" fill="#203035"/><circle cx="260" cy="210" r="7" fill="#7461ba"/><text x="150" y="238" font-size="12" fill="#53676d" text-anchor="middle">曲率更小，不一定最短</text></g><g transform="translate(660,40)"><rect width="300" height="250" rx="10" fill="#eef4f0"/><text x="150" y="26" font-size="15" fill="#203035" text-anchor="middle">C · 重避障</text><rect x="130" y="90" width="45" height="130" fill="#f0d3c9"/><path d="M40 210 Q150 60 260 210" fill="none" stroke="#147f80" stroke-width="4"/><circle cx="40" cy="210" r="7" fill="#203035"/><circle cx="260" cy="210" r="7" fill="#7461ba"/><text x="150" y="238" font-size="12" fill="#53676d" text-anchor="middle">远离障碍，路径更长</text></g><text x="490" y="322" font-size="14" fill="#53676d" text-anchor="middle">图为教学示意：同一场景仅改变权重，展示三者取舍，非求解释例。</text></g></svg>
