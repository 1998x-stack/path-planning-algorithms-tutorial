<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">行为克隆分布偏移与DAgger数据聚合</title><desc id="svg-desc">专家访问分布集中在参考轨迹附近，策略误差把状态推离训练数据，DAgger采集策略实际访问的状态并请求专家标注。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,'PingFang SC',sans-serif"><text x="34" y="48" font-size="22" fill="#203035" font-weight="700">Imitation is a sequential prediction problem</text><rect x="42" y="104" width="260" height="224" rx="12" fill="#eef6f1" stroke="#cbdacf"/><text x="172" y="139" font-size="18" text-anchor="middle" fill="#203035" font-weight="700">Expert dataset</text><path d="M83 274 Q152 179 261 206" stroke="#147f80" stroke-width="6" fill="none"/><g fill="#147f80"><circle cx="83" cy="274" r="6"/><circle cx="126" cy="237" r="6"/><circle cx="171" cy="216" r="6"/><circle cx="216" cy="205" r="6"/></g><text x="172" y="307" text-anchor="middle" font-size="15" fill="#53676d">narrow state distribution</text><path d="M302 215 H345" stroke="#147f80" stroke-width="4"/><rect x="345" y="104" width="260" height="224" rx="12" fill="#f9f0e9" stroke="#e4d2c7"/><text x="475" y="139" font-size="18" text-anchor="middle" fill="#203035" font-weight="700">Policy rollout</text><path d="M383 274 Q449 184 514 213 Q556 232 573 167" stroke="#d06d4d" stroke-width="6" fill="none"/><g fill="#d06d4d"><circle cx="383" cy="274" r="6"/><circle cx="449" cy="209" r="6"/><circle cx="514" cy="213" r="6"/><circle cx="573" cy="167" r="6"/></g><text x="475" y="307" text-anchor="middle" font-size="15" fill="#53676d">visits shifted states</text><path d="M605 215 H651 V356 H173 V328" stroke="#7461ba" stroke-width="4" fill="none" stroke-dasharray="9 6"/><text x="463" y="386" font-size="17" fill="#7461ba">DAgger: query expert on learner states</text></g></svg>
