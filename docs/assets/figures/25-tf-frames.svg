<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">典型REP105移动机器人变换树</title><desc id="d">map是odom父节点，odom是base_link父节点，base_link是laser父节点；每条变换标注典型来源。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="32" y="46" font-size="22" font-weight="700" fill="#203035">REP-105 / TF2</text><rect x="30" y="159" width="202" height="130" rx="12" fill="#eef7f1" stroke="#147f80" stroke-width="2"/><text x="131" y="205" text-anchor="middle" font-size="25" fill="#203035" font-weight="700">map</text><text x="131" y="244" text-anchor="middle" font-size="16" fill="#53676d">全局定位参考</text><rect x="266" y="159" width="202" height="130" rx="12" fill="#eef7f1" stroke="#147f80" stroke-width="2"/><text x="367" y="205" text-anchor="middle" font-size="25" fill="#203035" font-weight="700">odom</text><text x="367" y="244" text-anchor="middle" font-size="16" fill="#53676d">连续局部参考</text><rect x="502" y="159" width="202" height="130" rx="12" fill="#eef7f1" stroke="#147f80" stroke-width="2"/><text x="603" y="205" text-anchor="middle" font-size="25" fill="#203035" font-weight="700">base_link</text><text x="603" y="244" text-anchor="middle" font-size="16" fill="#53676d">车体位姿</text><rect x="738" y="159" width="202" height="130" rx="12" fill="#f7f1f7" stroke="#7461ba" stroke-width="2"/><text x="839" y="205" text-anchor="middle" font-size="25" fill="#203035" font-weight="700">laser</text><text x="839" y="244" text-anchor="middle" font-size="16" fill="#53676d">传感器外参</text><g stroke="#147f80" stroke-width="4"><path d="M232 224 H266 M468 224 H502 M704 224 H738"/></g><g font-size="16" fill="#53676d"><text x="215" y="333">Localization</text><text x="459" y="333">Odometry</text><text x="690" y="333">Static TF</text></g><text x="34" y="433" font-size="15" fill="#53676d">典型生产者与父子方向须一致；实际 frame 命名可能随机器人基座和雷达模型变化。</text></g></svg>
