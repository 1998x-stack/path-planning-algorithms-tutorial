<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">不同前沿方法有不同研究任务与证据边界</title><desc id="svg-desc">可微分搜索、真实导航扩散策略、VLA语义动作、机械臂GPU规划和最新综述分别对应不同任务，不能把结果直接互换。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,'PingFang SC',sans-serif"><rect x="28" y="88" width="904" height="300" rx="12" fill="#f5f8f5" stroke="#d7e2da"/><g font-size="18" fill="#203035"><text x="56" y="128" font-weight="700">Research line</text><text x="344" y="128" font-weight="700">Demonstrated focus</text><text x="692" y="128" font-weight="700">Boundary</text></g><path d="M45 182 H915" stroke="#dbe4de"/><text x="56" y="170" font-size="16" fill="#147f80">Neural A* / VIN</text><text x="344" y="170" font-size="16" fill="#53676d">learned search representation</text><text x="692" y="170" font-size="16" fill="#d06d4d">search assumptions</text><path d="M45 223 H915" stroke="#dbe4de"/><text x="56" y="211" font-size="16" fill="#147f80">NoMaD</text><text x="344" y="211" font-size="16" fill="#53676d">mobile navigation + exploration</text><text x="692" y="211" font-size="16" fill="#d06d4d">candidate safety</text><path d="M45 264 H915" stroke="#dbe4de"/><text x="56" y="252" font-size="16" fill="#147f80">RT-2 / π0.5</text><text x="344" y="252" font-size="16" fill="#53676d">semantic robot actions</text><text x="692" y="252" font-size="16" fill="#d06d4d">not a metric planner</text><path d="M45 305 H915" stroke="#dbe4de"/><text x="56" y="293" font-size="16" fill="#147f80">cuRobo</text><text x="344" y="293" font-size="16" fill="#53676d">GPU manipulator motion</text><text x="692" y="293" font-size="16" fill="#d06d4d">not mobile navigation</text><path d="M45 346 H915" stroke="#dbe4de"/><text x="56" y="334" font-size="16" fill="#147f80">2026 VLA survey</text><text x="344" y="334" font-size="16" fill="#53676d">broad literature map</text><text x="692" y="334" font-size="16" fill="#d06d4d">preprint, not ranking</text><text x="32" y="433" font-size="15" fill="#53676d">Task definitions and evaluation settings must match before methods can be compared.</text></g></svg>
