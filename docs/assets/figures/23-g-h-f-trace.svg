<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">A星每次弹出记录g h f、父状态与队列大小</title><desc id="d">一个扩展节点有g实际成本、h启发式估计和f排序评分，弹出后需要合法邻域松弛。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="38" y="50" font-size="22" font-weight="700" fill="#203035">有效弹出时记录一次原子事件</text><rect x="75" y="128" width="247" height="232" rx="13" fill="#f0f7f1" stroke="#147f80" stroke-width="3"/><text x="103" y="170" font-size="21" font-weight="700" fill="#203035">CURRENT NODE</text><g font-size="24" fill="#203035"><text x="104" y="220">g = 5</text><text x="104" y="263">h = 7</text><text x="104" y="307">f = g + h = 12</text></g><path d="M320 242 H468" stroke="#147f80" stroke-width="5"/><rect x="467" y="153" width="418" height="191" rx="13" fill="#f6f2fa" stroke="#ddd3e9"/><text x="492" y="198" font-size="20" fill="#203035" font-weight="700">日志事件字段</text><g font-size="18" fill="#53676d"><text x="493" y="238">step、state、parent</text><text x="493" y="272">g / h / f、frontier</text><text x="493" y="306">map_hash、config、stamp</text></g><text x="35" y="432" font-size="15" fill="#53676d">g、h、f 是解释字段，不是真实单次运行中所有节点一定取到的数字。</text></g></svg>
