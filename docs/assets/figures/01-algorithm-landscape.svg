<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">三类规划方法的知识地图</title><desc id="d">图搜索、采样和连续优化分别面对离散图、高维配置空间和连续约束。</desc><rect width="960" height="470" rx="16" fill="#fffdf9"/><g font-family="Arial, PingFang SC, sans-serif"><text x="36" y="49" font-size="17" fill="#53676d">同一个规划问题，可以采用不同的状态表示与搜索机制</text><rect x="26" y="91" width="286" height="300" rx="16" fill="#e4f3ef" stroke="#147f80" stroke-width="2"/><circle cx="62" cy="131" r="20" fill="#147f80"/><text x="62" y="137" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">01</text><text x="46" y="200" font-size="27" font-weight="700" fill="#203035">图搜索</text><text x="46" y="243" font-size="17" fill="#53676d">Grid / Graph</text><path d="M 46 265 H 290" stroke="#147f80" opacity=".5"/><text x="46" y="302" font-size="17" fill="#203035">BFS · Dijkstra · A*</text><text x="46" y="352" font-size="15" fill="#53676d">离散边模型</text><rect x="339" y="91" width="286" height="300" rx="16" fill="#edeafb" stroke="#7461ba" stroke-width="2"/><circle cx="375" cy="131" r="20" fill="#7461ba"/><text x="375" y="137" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">02</text><text x="359" y="200" font-size="27" font-weight="700" fill="#203035">采样规划</text><text x="359" y="243" font-size="17" fill="#53676d">Continuous C-Space</text><path d="M 359 265 H 603" stroke="#7461ba" opacity=".5"/><text x="359" y="302" font-size="17" fill="#203035">PRM · RRT · RRT*</text><text x="359" y="352" font-size="15" fill="#53676d">碰撞查询 / 局部连接</text><rect x="652" y="91" width="286" height="300" rx="16" fill="#fff0e7" stroke="#d06d4d" stroke-width="2"/><circle cx="688" cy="131" r="20" fill="#d06d4d"/><text x="688" y="137" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">03</text><text x="672" y="200" font-size="27" font-weight="700" fill="#203035">轨迹优化</text><text x="672" y="243" font-size="17" fill="#53676d">State + Controls</text><path d="M 672 265 H 916" stroke="#d06d4d" opacity=".5"/><text x="672" y="302" font-size="17" fill="#203035">MPC · TrajOpt</text><text x="672" y="352" font-size="15" fill="#53676d">动力学与代价约束</text><text x="28" y="433" font-size="15" fill="#53676d">方法之间可组合：例如先搜索拓扑路线，再做平滑或轨迹优化。</text></g></svg>
