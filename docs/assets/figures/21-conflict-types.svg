<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="ct-t ct-d"><title id="ct-t">四种多机器人冲突类型</title><desc id="ct-d">四个面板分别展示正面冲突（同一通道相向而行）、交叉冲突（两路径在路口相交）、汇合冲突（支路汇入主路）与跟驰冲突（同向跟随，前车减速向后传播）。</desc><rect width="980" height="560" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><g><rect x="20" y="40" width="460" height="230" rx="12" fill="#eef4f0"/><text x="250" y="72" font-size="17" fill="#203035" text-anchor="middle">A · 正面冲突（head-on）</text><line x1="90" y1="180" x2="410" y2="180" stroke="#cbd9d2" stroke-width="34"/><line x1="110" y1="180" x2="230" y2="180" stroke="#147f80" stroke-width="11" stroke-linecap="round"/><line x1="390" y1="180" x2="270" y2="180" stroke="#7461ba" stroke-width="11" stroke-linecap="round"/><circle cx="120" cy="180" r="10" fill="#203035"/><circle cx="380" cy="180" r="10" fill="#203035"/><text x="250" y="238" font-size="14" fill="#53676d" text-anchor="middle">同一通道反向重叠</text></g><g><rect x="500" y="40" width="460" height="230" rx="12" fill="#eef4f0"/><text x="730" y="72" font-size="17" fill="#203035" text-anchor="middle">B · 交叉冲突（crossing）</text><line x1="540" y1="200" x2="920" y2="200" stroke="#147f80" stroke-width="11" stroke-linecap="round"/><line x1="730" y1="110" x2="730" y2="230" stroke="#7461ba" stroke-width="11" stroke-linecap="round"/><circle cx="730" cy="200" r="15" fill="#d06d4d"/><text x="730" y="258" font-size="14" fill="#a5482c" text-anchor="middle">交点为共享资源</text></g><g><rect x="20" y="300" width="460" height="230" rx="12" fill="#eef4f0"/><text x="250" y="332" font-size="17" fill="#203035" text-anchor="middle">C · 汇合冲突（merging）</text><line x1="90" y1="440" x2="410" y2="440" stroke="#7461ba" stroke-width="11" stroke-linecap="round"/><line x1="90" y1="380" x2="290" y2="440" stroke="#147f80" stroke-width="11" stroke-linecap="round"/><circle cx="290" cy="440" r="15" fill="#d06d4d"/><text x="250" y="498" font-size="14" fill="#a5482c" text-anchor="middle">支路汇入主路</text></g><g><rect x="500" y="300" width="460" height="230" rx="12" fill="#eef4f0"/><text x="730" y="332" font-size="17" fill="#203035" text-anchor="middle">D · 跟驰冲突（following）</text><line x1="540" y1="440" x2="920" y2="440" stroke="#cbd9d2" stroke-width="34"/><line x1="540" y1="440" x2="920" y2="440" stroke="#147f80" stroke-width="6" stroke-dasharray="12 8"/><circle cx="620" cy="440" r="15" fill="#7461ba"/><circle cx="800" cy="440" r="15" fill="#203035"/><text x="620" y="410" font-size="14" fill="#7461ba" text-anchor="middle">前车</text><text x="800" y="478" font-size="14" fill="#203035" text-anchor="middle">后车</text><text x="730" y="512" font-size="14" fill="#53676d" text-anchor="middle">无交点，速度耦合沿队列传播</text></g></g></svg>
