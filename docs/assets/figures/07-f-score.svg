<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">A星优先级 f 由 g 和 h 构成</title><desc id="d">两张卡片示例 P: g4 h4 f8，Q: g6 h1 f7，A星优先展开 Q。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="42" y="44" font-size="18" fill="#53676d">优先队列中的两个候选节点</text><rect x="76" y="79" width="380" height="303" rx="15" fill="#fafcf9" stroke="#d06d4d" stroke-width="3"/><circle cx="125" cy="129" r="28" fill="#d06d4d"/><text x="125" y="138" text-anchor="middle" fill="white" font-size="26" font-weight="700">P</text><text x="104" y="195" font-size="20" fill="#203035">已付代价 g = 4</text><text x="104" y="240" font-size="20" fill="#203035">剩余估计 h = 4</text><rect x="103" y="274" width="322" height="69" rx="10" fill="#d06d4d" opacity=".1"/><text x="121" y="319" font-size="28" fill="#d06d4d" font-weight="700">f = 8</text></rect><rect x="510" y="79" width="380" height="303" rx="15" fill="#fafcf9" stroke="#147f80" stroke-width="3"/><circle cx="559" cy="129" r="28" fill="#147f80"/><text x="559" y="138" text-anchor="middle" fill="white" font-size="26" font-weight="700">Q</text><text x="538" y="195" font-size="20" fill="#203035">已付代价 g = 6</text><text x="538" y="240" font-size="20" fill="#203035">剩余估计 h = 1</text><rect x="537" y="274" width="322" height="69" rx="10" fill="#147f80" opacity=".1"/><text x="555" y="319" font-size="28" fill="#147f80" font-weight="700">f = 7</text></rect><text x="265" y="424" font-size="19" fill="#147f80">Q 的 f 更低，下一次弹出 Q</text></g></svg>
