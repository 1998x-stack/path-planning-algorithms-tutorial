<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">直线行进产生强制邻居的几何条件</title><desc id="d">父节点P左侧，当前节点x居中，P上方是障碍X，x上方自由F，因而F从x可达但从P不能先向上。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="40" y="51" font-size="20" fill="#203035">向右移动时：上方障碍结束，迫使搜索考虑向上转弯</text><rect x="180" y="111" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="252" y="111" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="324" y="111" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="396" y="111" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="468" y="111" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="540" y="111" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="612" y="111" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="180" y="183" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="252" y="183" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="324" y="183" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="396" y="183" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="468" y="183" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="540" y="183" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="612" y="183" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="180" y="255" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="252" y="255" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="324" y="255" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="396" y="255" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="468" y="255" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="540" y="255" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="612" y="255" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="180" y="327" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="252" y="327" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="324" y="327" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="396" y="327" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="468" y="327" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="540" y="327" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="612" y="327" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="180" y="399" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="252" y="399" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="324" y="399" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="396" y="399" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="468" y="399" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="540" y="399" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="612" y="399" width="69" height="69" rx="3" fill="#eaf2ec"/><rect x="324" y="183" width="69" height="69" rx="3" fill="#526260"/><text x="359" y="228" text-anchor="middle" font-size="20" fill="white">墙</text><path d="M 284 329 H 431 m-13 -8 l13 8 -13 8" stroke="#147f80" stroke-width="7" fill="none"/><path d="M 431 327 V 251 m-8 10 l8 -10 8 10" fill="none" stroke="#d06d4d" stroke-width="6"/><g font-size="20" font-weight="700"><text x="270" y="337" fill="#203035">P</text><text x="417" y="337" fill="#203035">x</text><text x="421" y="252" fill="#d06d4d">F</text></g><text x="722" y="172" font-size="17" fill="#203035">P 上方：墙</text><text x="722" y="212" font-size="17" fill="#203035">x 上方：可走</text><text x="722" y="275" font-size="17" fill="#d06d4d">因此 F 是被强制保留的候选</text><text x="722" y="316" font-size="15" fill="#53676d">图以本地水平扫描为背景；</text><text x="722" y="344" font-size="15" fill="#53676d">完整剪枝还依赖斜向规则。</text></g></svg>
