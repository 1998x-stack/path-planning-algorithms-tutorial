e" fill="#fff">x</text><circle cx="335" cy="183" r="19" fill="#d06d4d" stroke="#fff" stroke-width="2"/><text x="335" y="190" font-size="20" text-anchor="middle" fill="#fff">F</text><g font-size="17" fill="#203035"><text x="627" y="134">P = (2,2)，x = (2,3)</text><text x="627" y="183">被阻断的格子：(1,2)</text><text x="627" y="232">强制邻居 F = (1,3)</text><text x="627" y="290" fill="#147f80">P → x 是合法右移</text><text x="627" y="332" fill="#d06d4d">x → F 是新出现的转向</text></g><text x="34" y="437" font-size="15" fill="#53676d">这里只演示一次水平移动的局部规则；完整八邻域 JPS 还需对角递归扫描与一致的角点通行规则。</text></g></svg>
