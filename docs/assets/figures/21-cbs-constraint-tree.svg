<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">CBS冲突树从一处冲突分成约束A和约束B的两个孩子</title><desc id="d">根节点记录冲突，将一名机器人的冲突顶点占据禁止，两条分支分别重新求那名机器人的路径。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="312" y="60" width="340" height="122" rx="13" fill="#f6e9e3" stroke="#d06d4d" stroke-width="3"/><text x="481" y="94" text-anchor="middle" font-size="22" font-weight="700" fill="#203035">CBS 根节点</text><text x="481" y="127" text-anchor="middle" font-size="18" fill="#d06d4d">A 与 B 在 (1,0), t=1 冲突</text><text x="481" y="157" text-anchor="middle" font-size="16" fill="#53676d">SOC = 4（但不合法）</text><path d="M382 181 L227 264 M582 181 L730 264" stroke="#53676d" stroke-width="4" fill="none"/><rect x="42" y="264" width="370" height="140" rx="13" fill="#eff8f1" stroke="#147f80" stroke-width="3"/><rect x="550" y="264" width="370" height="140" rx="13" fill="#f5f1fc" stroke="#7461ba" stroke-width="3"/><g font-size="19" fill="#203035"><text x="65" y="306">禁止 A 在 t=1 占中点</text><text x="572" y="306">禁止 B 在 t=1 占中点</text><text x="65" y="346" fill="#147f80">低层仅重算 A</text><text x="572" y="346" fill="#7461ba">低层仅重算 B</text><text x="65" y="380" font-size="16">随后继续检查所有冲突</text><text x="572" y="380" font-size="16">随后继续检查所有冲突</text></g><text x="36" y="438" font-size="15" fill="#53676d">两个孩子各排除冲突中的一种参与方式，不能只选代价较小的孩子就直接宣告解。</text></g></svg>
