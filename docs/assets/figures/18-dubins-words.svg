<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="dw-t dw-d"><title id="dw-t">Dubins 曲线的六种路径词</title><desc id="dw-d">六个面板分别画出 LSL、LSR、RSL、RSR 四种弧-直线-弧结构与 LRL、RLR 两种三圆弧结构；青色表示弧-直线-弧（CSC），紫色表示三圆弧（CCC）。</desc><rect width="960" height="380" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="20" y="22" font-size="16" fill="#203035" font-weight="700">CSC：弧–直线–弧（青绿）</text><text x="620" y="22" font-size="16" fill="#203035" font-weight="700">CCC：三圆弧（紫色）</text><g transform="translate(20,32)"><rect width="260" height="150" rx="10" fill="#f7faf7" stroke="#dce6df"/><text x="14" y="26" font-size="16" fill="#147f80" font-weight="700">LSL</text><path d="M35 125 A32 32 0 0 1 95 95 L140 95 A32 32 0 0 1 200 60" fill="none" stroke="#147f80" stroke-width="4"/><circle cx="35" cy="125" r="6" fill="#203035"/><circle cx="200" cy="60" r="6" fill="#7461ba"/></g><g transform="translate(320,32)"><rect width="260" height="150" rx="10" fill="#f7faf7" stroke="#dce6df"/><text x="14" y="26" font-size="16" fill="#147f80" font-weight="700">LSR</text><path d="M35 125 A32 32 0 0 1 95 95 L140 95 A32 32 0 0 0 200 60" fill="none" stroke="#147f80" stroke-width="4"/><circle cx="35" cy="125" r="6" fill="#203035"/><circle cx="200" cy="60" r="6" fill="#7461ba"/></g><g transform="translate(620,32)"><rect width="260" height="150" rx="10" fill="#f7faf7" stroke="#dce6df"/><text x="14" y="26" font-size="16" fill="#7461ba" font-weight="700">LRL</text><path d="M35 125 A30 30 0 0 1 90 100 A30 30 0 0 0 150 100 A30 30 0 0 1 200 60" fill="none" stroke="#7461ba" stroke-width="4"/><circle cx="35" cy="125" r="6" fill="#203035"/><circle cx="200" cy="60" r="6" fill="#7461ba"/></g><g transform="translate(20,202)"><rect width="260" height="150" rx="10" fill="#f7faf7" stroke="#dce6df"/><text x="14" y="26" font-size="16" fill="#147f80" font-weight="700">RSL</text><path d="M35 125 A32 32 0 0 0 95 95 L140 95 A32 32 0 0 1 200 60" fill="none" stroke="#147f80" stroke-width="4"/><circle cx="35" cy="125" r="6" fill="#203035"/><circle cx="200" cy="60" r="6" fill="#7461ba"/></g><g transform="translate(320,202)"><rect width="260" height="150" rx="10" fill="#f7faf7" stroke="#dce6df"/><text x="14" y="26" font-size="16" fill="#147f80" font-weight="700">RSR</text><path d="M35 125 A32 32 0 0 0 95 95 L140 95 A32 32 0 0 0 200 60" fill="none" stroke="#147f80" stroke-width="4"/><circle cx="35" cy="125" r="6" fill="#203035"/><circle cx="200" cy="60" r="6" fill="#7461ba"/></g><g transform="translate(620,202)"><rect width="260" height="150" rx="10" fill="#f7faf7" stroke="#dce6df"/><text x="14" y="26" font-size="16" fill="#7461ba" font-weight="700">RLR</text><path d="M35 125 A30 30 0 0 0 90 100 A30 30 0 0 1 150 100 A30 30 0 0 0 200 60" fill="none" stroke="#7461ba" stroke-width="4"/><circle cx="35" cy="125" r="6" fill="#203035"/><circle cx="200" cy="60" r="6" fill="#7461ba"/></g></g></svg>
