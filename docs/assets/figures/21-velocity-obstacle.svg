<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="vo-t vo-d"><title id="vo-t">速度障碍与 ORCA 半平面约束</title><desc id="vo-d">左图横纵轴为速度分量，从原点出发的一个锥形区域是会导致碰撞的相对速度集合，首选速度向量落在锥内，修正后的速度取在锥外并尽量靠近首选速度。右图用两个半平面表示两台机器人各自允许的速度，交集内选点即为互不碰撞的解。</desc><rect width="900" height="420" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="230" y="36" font-size="16" fill="#203035" text-anchor="middle">速度空间：碰撞锥</text><g transform="translate(60,60)"><rect width="340" height="300" rx="10" fill="#eef4f0"/><line x1="170" y1="270" x2="170" y2="30" stroke="#cbd9d2" stroke-width="1.5"/><line x1="30" y1="160" x2="320" y2="160" stroke="#cbd9d2" stroke-width="1.5"/><text x="316" y="178" font-size="13" fill="#53676d">vx</text><text x="182" y="34" font-size="13" fill="#53676d">vy</text><path d="M170 160 L300 70 L300 250 Z" fill="#f0d3c9" opacity="0.75" stroke="#d06d4d" stroke-width="1.5"/><text x="255" y="168" font-size="13" fill="#a5482c">VO</text><line x1="170" y1="160" x2="262" y2="120" stroke="#7461ba" stroke-width="4" stroke-linecap="round"/><circle cx="262" cy="120" r="6" fill="#7461ba"/><text x="212" y="112" font-size="13" fill="#7461ba">首选速度</text><line x1="170" y1="160" x2="250" y2="205" stroke="#147f80" stroke-width="4" stroke-linecap="round"/><circle cx="250" cy="205" r="6" fill="#147f80"/><text x="196" y="230" font-size="13" fill="#147f80">修正后速度</text></g><text x="660" y="36" font-size="16" fill="#203035" text-anchor="middle">ORCA：半平面约束</text><g transform="translate(490,60)"><rect width="340" height="300" rx="10" fill="#eef4f0"/><line x1="170" y1="270" x2="170" y2="30" stroke="#cbd9d2" stroke-width="1.5"/><line x1="30" y1="160" x2="320" y2="160" stroke="#cbd9d2" stroke-width="1.5"/><line x1="60" y1="240" x2="300" y2="80" stroke="#7461ba" stroke-width="2.5"/><line x1="80" y1="60" x2="300" y2="220" stroke="#147f80" stroke-width="2.5"/><path d="M120 190 L230 130 L280 200 L150 240 Z" fill="#dfeee9" stroke="#53676d" stroke-width="1.5"/><text x="205" y="185" font-size="13" fill="#203035">可行交集</text><circle cx="205" cy="185" r="6" fill="#203035"/><text x="52" y="240" font-size="12" fill="#7461ba">A 的约束</text><text x="250" y="70" font-size="12" fill="#147f80">B 的约束</text></g><text x="450" y="400" font-size="14" fill="#53676d" text-anchor="middle">两图中“修正后速度”均为可行区域内距首选速度最近者（教学示意，坐标未按比例）。</text></g></svg>
