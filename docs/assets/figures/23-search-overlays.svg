<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">一张地图叠加不同搜索状态与最终路径</title><desc id="d">图像里深灰障碍、淡蓝探索过区域、青绿最终路径分开展示，不能将路径误认为全部扩展状态。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="25" y="76" width="910" height="314" rx="14" fill="#f3f7f3" stroke="#d6e2d9"/><rect x="143" y="102" width="49" height="49" rx="3" fill="#fff" stroke="#d1dcd5"/><rect x="195" y="102" width="49" height="49" rx="3" fill="#fff" stroke="#d1dcd5"/><rect x="247" y="102" width="49" height="49" rx="3" fill="#d8e7f8" stroke="#d1dcd5"/><rect x="299" y="102" width="49" height="49" rx="3" fill="#536767" stroke="#d1dcd5"/><rect x="351" y="102" width="49" height="49" rx="3" fill="#fff" stroke="#d1dcd5"/><rect x="403" y="102" width="49" height="49" rx="3" fill="#fff" stroke="#d1dcd5"/><rect x="455" y="102" width="49" height="49" rx="3" fill="#fff" stroke="#d1dcd5"/><rect x="143" y="154" width="49" height="49" rx="3" fill="#fff" stroke="#d1dcd5"/><rect x="195" y="154" width="49" height="49" rx="3" fill="#147f80" stroke="#d1dcd5"/><rect x="247" y="154" width="49" height="49" rx="3" fill="#147f80" stroke="#d1dcd5"/><rect x="299" y="154" width="49" height="49" rx="3" fill="#536767" stroke="#d1dcd5"/><rect x="351" y="154" width="49" height="49" rx="3" fill="#fff" stroke="#d1dcd5"/><rect x="403" y="154" width="49" height="49" rx="3" fill="#147f80" stroke="#d1dcd5"/><rect x="455" y="154" width="49" height="49" rx="3" fill="#fff" stroke="#d1dcd5"/><rect x="143" y="206" width="49" height="49" rx="3" fill="#d8e7f8" stroke="#d1dcd5"/><rect x="195" y="206" width="49" height="49" rx="3" fill="#d8e7f8" stroke="#d1dcd5"/><rect x="247" y="206" width="49" height="49" rx="3" fill="#147f80" stroke="#d1dcd5"/><rect x="299" y="206" width="49" height="49" rx="3" fill="#536767" stroke="#d1dcd5"/><rect x="351" y="206" width="49" height="49" rx="3" fill="#fff" stroke="#d1dcd5"/><rect x="403" y="206" width="