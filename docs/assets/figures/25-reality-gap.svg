<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="rg-t rg-d"><title id="rg-t">同一个规划器在仿真与实车上的表现差异来自四类来源</title><desc id="rg-d">左：仿真中规划器看到精确地图，路径沿理想曲线到达目标。右：实车中传感器带噪声、动力学存在未建模侧滑，同样的路径偏离并擦到障碍。底部四个方框列出鸿沟来源：动力学失配、传感器真实性、环境多样性、时序与系统集成。全程不给出具体成功率，仅表示差异方向。</desc>
<rect width="900" height="380" rx="18" fill="#fffdf9"/>
<g font-family="Arial,PingFang SC,sans-serif">
<rect x="40" y="46" width="380" height="196" rx="10" fill="#eef4f0" stroke="#dce6df"/>
<text x="60" y="78" font-size="15" font-weight="bold" fill="#147f80">仿真：模型即真相</text>
<rect x="300" y="96" width="24" height="120" fill="#4e6060"/>
<circle cx="96" cy="220" r="7" fill="#203035"/>
<text x="82" y="246" font-size="13" fill="#53676d">起点</text>
<circle cx="360" cy="112" r="7" fill="#7461ba"/>
<text x="330" y="100" font-size="13" fill="#7461ba">目标</text>
<path d="M96 220 C 180 214 240 150 360 112" fill="none" stroke="#147f80" stroke-width="3"/>
<text x="150" y="150" font-size="13" fill="#147f80">精确跟踪的路径</text>
<rect x="480" y="46" width="380" height="196" rx="10" fill="#fff6f1" stroke="#f0d3c9"/>
<text x="500" y="78" font-size="15" font-weight="bold" fill="#a5482c">实车：模型只是近似</text>
<rect x="740" y="96" width="24" height="120" fill="#4e6060"/>
<circle cx="536" cy="220" r="7" fill="#203035"/>
<text x="522" y="246" font-size="13" fill="#53676d">起点</text>
<circle cx="800" cy="112" r="7" fill="#7461ba"/>
<g fill="#53676d"><circle cx="620" cy="196" r="2.5"/><circle cx="648" cy="176" r="2.5"/><circle cx="672" cy="206" r="2.5"/><circle cx="700" cy="150" r="2.5"/><circle cx="726" cy="186" r="2.5"/><circle cx="660" cy="132" r="2.5"/><circle cx="632" cy="150" r="2.5"/></g>
<text x="610" y="118" font-size="13" fill="#53676d">带噪声的观测</text>
<path d="M536 220 C 620 214 690 156 800 112" fill="none" stroke="#147f80" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M536 220 C 620 230 700 172 762 132" fill="none" stroke="#d06d4d" stroke-width="3"/>
<text x="600" y="256" font-size="13" fill="#a5482c">同一条名义路径发生侧滑偏移</text>
<g>
<rect x="40" y="272" width="196" height="76" rx="8" fill="#f7faf7" stroke="#dce6df"/>
<text x="58" y="302" font-size="14" fill="#203035">动力学失配</text>
<text x="58" y="326" font-size="12" fill="#53676d">摩擦、惯性、延迟</text>
</g>
<g>
<rect x="248" y="272" width="196" height="76" rx="8" fill="#f7faf7" stroke="#dce6df"/>
<text x="266" y="302" font-size="14" fill="#203035">传感器真实性</text>
<text x="266" y="326" font-size="12" fill="#53676d">混合像素、反射、畸变</text>
</g>
<g>
<rect x="456" y="272" width="196" height="76" rx="8" fill="#f7faf7" stroke="#dce6df"/>
<text x="474" y="302" font-size="14" fill="#203035">环境多样性</text>
<text x="474" y="326" font-size="12" fill="#53676d">光照、水渍、地面起伏</text>
</g>
<g>
<rect x="664" y="272" width="196" height="76" rx="8" fill="#f7faf7" stroke="#dce6df"/>
<text x="682" y="302" font-size="14" fill="#203035">时序与集成</text>
<text x="682" y="326" font-size="12" fill="#53676d">重规划周期、模块耦合</text>
</g>
</g></svg>
