<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">MPC只执行当前控制，测量偏差后重新规划剩余时域</title><desc id="d">初次规划有四步预测输入，实际执行首项后出现扰动，下次用新测量状态重新求四步控制。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="37" y="56" font-size="22" font-weight="700" fill="#203035">每次只执行第一个控制</text><g><rect x="195" y="106" width="145" height="61" rx="9" fill="#147f80" stroke="#147f80"/><text x="267" y="144" text-anchor="middle" font-size="20" fill="white">a0=1</text><rect x="361" y="106" width="145" height="61" rx="9" fill="#bfded1" stroke="#90b5a5"/><text x="433" y="144" text-anchor="middle" font-size="20" fill="#203035">a1=1</text><rect x="527" y="106" width="145" height="61" rx="9" fill="#bfded1" stroke="#90b5a5"/><text x="599" y="144" text-anchor="middle" font-size="20" fill="#203035">a2=0</text><rect x="693" y="106" width="145" height="61" rx="9" fill="#bfded1" stroke="#90b5a5"/><text x="765" y="144" text-anchor="middle" font-size="20" fill="#203035">a3=-1</text></g><path d="M263 167 V218" stroke="#147f80" stroke-width="4"/><path d="M253 208 l10 11 10 -11" fill="none" stroke="#147f80" stroke-width="3"/><rect x="62" y="222" width="425" height="73" rx="10" fill="#f4eae4" stroke="#d06d4d"/><text x="78" y="250" font-size="18" fill="#203035">实测 v 比预测低 0.2 m/s</text><text x="78" y="279" font-size="17" fill="#d06d4d">用实测状态重新求解，不重放旧序列</text><path d="M486 261 H538 V339" stroke="#53676d" stroke-width="3" fill="none"/><g><rect x="220" y="338" width="145" height="58" rx="9" fill="#7461ba"/><text x="292" y="374" text-anchor="middle" font-size="20" fill="white">a0=1</text><rect x="386" y="338" width="145" height="58" rx="9" fill="#ddd1ee"/><text x="458" y="374" text-anchor="middle" font-size="20" fill="#203035">a1=0</text><rect x="552" y="338" width="145" height="58" rx="9" fill="#ddd1ee"/><text x="624" y="374" text-anchor="middle" font-size="20" fill="#203035">a2=0</text><rect x="718" y="338" width="145" height="58" rx="9" fill="#ddd1ee"/><text x="790" y="374" text-anchor="middle" font-size="20" fill="#203035">a3=-1</text></g><text x="36" y="434" font-size="15" fill="#53676d">紫色为新优化问题的首条控制。完整轨迹还需持续检查安全和求解时限。</text></g></svg>
