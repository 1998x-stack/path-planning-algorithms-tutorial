<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="lm-t lm-d"><title id="lm-t">U形障碍前的局部极小</title><desc id="lm-d">U形三面墙中，目标位于底部；上方机器人受到指向目标的下方引力，同时受到左右两壁向内的斥力，三者在开口中点相消，机器人停在局部极小点。</desc><rect width="960" height="420" rx="18" fill="#fffdf9"/><defs><marker id="lm-ah" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 z" fill="#147f80"/></marker><marker id="lm-rh" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 z" fill="#d06d4d"/></marker></defs><g font-family="Arial,PingFang SC,sans-serif"><rect x="140" y="120" width="680" height="270" rx="12" fill="#eef4f0"/><rect x="330" y="200" width="42" height="170" rx="4" fill="#536767"/><rect x="588" y="200" width="42" height="170" rx="4" fill="#536767"/><rect x="330" y="328" width="300" height="42" rx="4" fill="#536767"/><text x="452" y="356" font-size="15" fill="white">障碍（U 形墙）</text><circle cx="480" cy="120" r="11" fill="#203035"/><text x="498" y="112" font-size="15" fill="#203035">机器人</text><circle cx="480" cy="300" r="9" fill="#7461ba"/><text x="496" y="292" font-size="15" fill="#7461ba">目标（谷底）</text><line x1="480" y1="140" x2="480" y2="212" stroke="#147f80" stroke-width="4" marker-end="url(#lm-ah)"/><text x="490" y="180" font-size="14" fill="#147f80">引力 F_att</text><line x1="372" y1="248" x2="300" y2="248" stroke="#d06d4d" stroke-width="4" marker-end="url(#lm-rh)"/><text x="196" y="242" font-size="14" fill="#d06d4d">左壁斥力</text><line x1="588" y1="248" x2="660" y2="248" stroke="#d06d4d" stroke-width="4" marker-end="url(#lm-rh)"/><text x="666" y="242" font-size="14" fill="#d06d4d">右壁斥力</text><circle cx="480" cy="248" r="12" fill="none" stroke="#7461ba" stroke-width="3"/><text x="330" y="100" font-size="15" fill="#7461ba">合力为零：局部极小</text><line x1="430" y1="108" x2="478" y2="238" stroke="#7461ba" stroke-width="1.4" stroke-dasharray="5 5"/><text x="140" y="410" font-size="14" fill="#53676d">几何为教学示意；驻点位置取决于 k_a、k_r、ρ₀ 与障碍间距，但不保证不存在。</text></g></svg>
