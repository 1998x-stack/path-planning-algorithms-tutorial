<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">LSR是一类前进方向的Dubins可行路径</title><desc id="desc">路径由左弧、直线和右弧组成，方向始终前进，转弯曲率绝对值不超过给定上限。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="36" y="78" width="888" height="312" rx="14" fill="#f3f7f3" stroke="#d7e3da"/><path d="M115 315 A115 115 0 0 1 345 200 L605 200 A115 115 0 0 0 835 85" fill="none" stroke="#147f80" stroke-width="7"/><circle cx="115" cy="315" r="12" fill="#203035"/><circle cx="835" cy="85" r="12" fill="#7461ba"/><g font-size="20" fill="#203035"><text x="90" y="350">Start</text><text x="810" y="58">Goal</text><text x="170" y="177" fill="#147f80">L</text><text x="470" y="180" fill="#147f80">S</text><text x="745" y="315" fill="#147f80">R</text></g><text x="35" y="435" font-size="15" fill="#53676d">示意路径仅解释LSR结构；最短路径需比较符合端点位姿的候选族。</text></g></svg>
