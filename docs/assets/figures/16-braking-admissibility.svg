<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">制动距离必须小于到障碍的可用距离</title><desc id="desc">高速候选轨迹虽然短时无碰撞，但净空小于停止距离时不可接受。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="40" y="48" font-size="21" font-weight="700" fill="#203035">同样没有立即碰撞，制动条件却不同</text><g><circle cx="150" cy="220" r="25" fill="#147f80"/><path d="M175 220 H680" stroke="#147f80" stroke-width="5" stroke-linecap="round"/><rect x="680" y="147" width="55" height="146" fill="#536767"/><path d="M175 266 H590" stroke="#147f80" stroke-width="3" stroke-dasharray="8 7"/><text x="220" y="305" font-size="18" fill="#147f80">d_stop &lt; d_clear：可安全停止</text></g><g><circle cx="150" cy="370" r="25" fill="#d06d4d"/><path d="M175 370 H360" stroke="#d06d4d" stroke-width="5" stroke-linecap="round"/><rect x="360" y="320" width="55" height="95" fill="#536767"/><path d="M175 410 H330" stroke="#d06d4d" stroke-width="3" stroke-dasharray="8 7"/><text x="435" y="377" font-size="18" fill="#d06d4d">d_stop &gt; d_clear：拒绝</text></g><text x="35" y="438" font-size="14" fill="#53676d">障碍距离应沿预测轨迹和机器人足迹计算；图中仅展示一维净空关系。</text></g></svg>
