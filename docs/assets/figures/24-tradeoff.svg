<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="bt-t bt-d"><title id="bt-t">时间—质量曲线与多指标取舍</title><desc id="bt-d">左图横轴为时间预算、纵轴为路径代价，一条随时间下降并逐渐变平的曲线，说明 anytime 算法在不同预算下质量不同。右图横轴为计算时间、纵轴为路径质量，散点分布在一条“快但差、慢但好”的权衡带上。</desc><rect width="900" height="380" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><g transform="translate(60,50)"><rect width="360" height="270" rx="10" fill="#eef4f0"/><line x1="50" y1="230" x2="330" y2="230" stroke="#53676d" stroke-width="2"/><line x1="50" y1="230" x2="50" y2="30" stroke="#53676d" stroke-width="2"/><text x="330" y="252" font-size="13" fill="#53676d" text-anchor="end">时间预算 →</text><text x="46" y="30" font-size="13" fill="#53676d" text-anchor="end">代价 ↓</text><path d="M50 50 C140 170 200 200 330 210" fill="none" stroke="#147f80" stroke-width="4"/><line x1="170" y1="30" x2="170" y2="230" stroke="#7461ba" stroke-width="2" stroke-dasharray="6 5"/><text x="170" y="24" font-size="12" fill="#7461ba" text-anchor="middle">固定预算</text></g><g transform="translate(480,50)"><rect width="360" height="270" rx="10" fill="#eef4f0"/><line x1="50" y1="230" x2="330" y2="230" stroke="#53676d" stroke-width="2"/><line x1="50" y1="230" x2="50" y2="30" stroke="#53676d" stroke-width="2"/><text x="330" y="252" font-size="13" fill="#53676d" text-anchor="end">计算时间 →</text><text x="46" y="30" font-size="13" fill="#53676d" text-anchor="end">路径质量 ↑</text><circle cx="110" cy="190" r="7" fill="#d06d4d"/><circle cx="170" cy="150" r="7" fill="#d06d4d"/><circle cx="230" cy="120" r="7" fill="#147f80"/><circle cx="290" cy="90" r="7" fill="#147f80"/><circle cx="150" cy="170" r="7" fill="#53676d"/><text x="200" y="60" font-size="12" fill="#53676d" text-anchor="middle">不存在单一排序</text></g><text x="450" y="356" font-size="14" fill="#53676d" text-anchor="middle">“更好”必须说明：在哪个指标、哪个预算、哪组场景下成立（示意图）。</text></g></svg>
