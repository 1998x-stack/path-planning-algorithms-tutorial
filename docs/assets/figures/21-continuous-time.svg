<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">连续时间与离散同步动作的区别</title><desc id="d">同一个空间通道中两个机器人在不同时间通过可安全，时间交叠则碰撞。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="52" y="76" width="857" height="325" rx="12" fill="#f3f7f3" stroke="#d9e4dc"/><path d="M130 339 H838 M130 339 V110" stroke="#203035" stroke-width="3" fill="none"/><path d="M155 295 L406 167" stroke="#147f80" stroke-width="6" fill="none"/><path d="M468 317 L738 166" stroke="#7461ba" stroke-width="6" fill="none" stroke-dasharray="12 7"/><path d="M150 160 L734 302" stroke="#d06d4d" stroke-width="4" fill="none" opacity=".7"/><text x="141" y="366" font-size="16" fill="#203035">位置 x</text><text x="82" y="106" font-size="16" fill="#203035">时间 t</text><text x="370" y="147" font-size="18" fill="#147f80">机器人 A</text><text x="670" y="145" font-size="18" fill="#7461ba">机器人 B</text><text x="502" y="264" font-size="17" fill="#d06d4d">移动障碍的时空轨迹</text><text x="35" y="441" font-size="15" fill="#53676d">连续机器人需要时空轨迹、速度与外形检测，离散顶点冲突不足以表达全部物理碰撞。</text></g></svg>
