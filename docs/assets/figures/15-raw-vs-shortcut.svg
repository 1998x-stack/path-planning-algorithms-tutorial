<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">原始绕障碍路径与通过碰撞检查的short-cut对照</title><desc id="d">原路径用五条线段绕墙；合法捷径可以减少部分折点，但起终点直接连接横穿墙，必须拒绝。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="34" y="50" font-size="21" fill="#203035" font-weight="700">原始路径：多折点</text><text x="512" y="50" font-size="21" fill="#203035" font-weight="700">验证后：短接可用的子段</text><rect x="167.5" y="186.75" width="144.5" height="118.14999999999999" fill="#536767" rx="4"/><text x="219.35" y="249.65" font-size="18" fill="white">障碍</text><rect x="655.5" y="186.75" width="144.5" height="118.14999999999999" fill="#536767" rx="4"/><text x="707.35" y="249.65" font-size="18" fill="white">障碍</text><polyline points="62,293 62,354 158,375 354,375 423,354 423,293" fill="none" stroke="#d06d4d" stroke-width="6" stroke-linejoin="round"/><polyline points="550,293 632,375 842,354 911,293" fill="none" stroke="#147f80" stroke-width="6" stroke-linejoin="round"/><path d="M550 293 H911" fill="none" stroke="#d06d4d" stroke-width="3" stroke-dasharray="9 7"/><text x="39" y="430" font-size="14" fill="#53676d">折线顶点与矩形均为示意位置；裁剪代码在正文中使用精确定义的 [4,6]×[3,7]。</text></g></svg>
