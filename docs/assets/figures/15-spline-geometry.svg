<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">曲线平滑与控制折线不同</title><desc id="d">折线控制点沿障碍底部绕行，平滑曲线可能内切更接近障碍，需连续验证安全间隙。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="35" y="51" font-size="21" fill="#203035" font-weight="700">控制多边形 ≠ 实际连续曲线</text><rect x="374" y="88" width="213" height="167" rx="4" fill="#536767"/><text x="439" y="183" fill="#fff" font-size="20">障碍</text><polyline points="138,156 290,356 668,356 820,156" stroke="#8e9b95" stroke-width="4" stroke-dasharray="10 8" fill="none"/><path d="M138 156 C249 310 302 315 480 315 S704 305 820 156" stroke="#147f80" stroke-width="7" fill="none"/><g><circle cx="138" cy="156" r="10" fill="#7461ba"/><circle cx="290" cy="356" r="10" fill="#7461ba"/><circle cx="668" cy="356" r="10" fill="#7461ba"/><circle cx="820" cy="156" r="10" fill="#7461ba"/></g><text x="50" y="436" font-size="15" fill="#53676d">紫色点只是曲线控制数据的示意；曲线是否有界曲率、是否碰撞须独立检验。</text></g></svg>
