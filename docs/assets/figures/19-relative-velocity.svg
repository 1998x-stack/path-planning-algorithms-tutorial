<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">相对速度使当前安全的物体未来相遇</title><desc id="desc">机器人向右、障碍向下运动；相对位置在两秒后为零，发生预测碰撞。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="40" y="78" width="880" height="310" rx="14" fill="#f3f7f3" stroke="#d7e3da"/><circle cx="170" cy="310" r="18" fill="#147f80"/><circle cx="690" cy="130" r="18" fill="#d06d4d"/><path d="M170 310 L690 310" stroke="#147f80" stroke-width="4" stroke-dasharray="10 7"/><path d="M690 130 L690 310" stroke="#d06d4d" stroke-width="4" stroke-dasharray="10 7"/><path d="M170 310 L430 220" stroke="#7461ba" stroke-width="5"/><circle cx="430" cy="220" r="15" fill="#7461ba"/><text x="128" y="350" font-size="18" fill="#147f80">Robot t=0</text><text x="665" y="100" font-size="18" fill="#d06d4d">Obstacle t=0</text><text x="450" y="208" font-size="18" fill="#7461ba">相对最近点</text><text x="35" y="435" font-size="15" fill="#53676d">向量为恒速直线示意；完整规划还要考虑速度可达集与形状。</text></g></svg>
