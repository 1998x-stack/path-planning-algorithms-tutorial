<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Weighted A星次优界的三个成本数值</title><desc id="d">epsilon等于3时，一张图上最优解4，实际返回成本6，形式上界为12。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="46" y="46" font-size="20" fill="#203035" font-weight="700">ε = 3 的手算示例：最优 4，找到的 6，上界 12</text><text x="42" y="135" font-size="20" fill="#203035">最优解 C*</text><rect x="259" y="113" width="176" height="48" rx="8" fill="#147f80"/><text x="452" y="144" font-size="24" font-weight="700" fill="#147f80">4</text><text x="42" y="247" font-size="20" fill="#203035">WA* 返回</text><rect x="259" y="225" width="264" height="48" rx="8" fill="#d06d4d"/><text x="540" y="256" font-size="24" font-weight="700" fill="#d06d4d">6</text><text x="42" y="359" font-size="20" fill="#203035">理论允许上界</text><rect x="259" y="337" width="528" height="48" rx="8" fill="#7461ba"/><text x="804" y="368" font-size="24" font-weight="700" fill="#7461ba">12</text><text x="42" y="447" font-size="14" fill="#53676d">仅在相关条件成立时保证输出成本不超过 ε·C*；并不保证输出达到上界或运行时间成比例。</text></g></svg>
