<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">动态障碍在空间时间图中形成占据带</title><desc id="desc">机器人轨迹和移动障碍在空间位置上相交，但只有相同时间发生交叉才构成碰撞。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="85" y="75" width="790" height="315" rx="12" fill="#f3f7f3" stroke="#d7e3da"/><path d="M120 340 L810 100" stroke="#d06d4d" stroke-width="20" opacity=".18" fill="none"/><path d="M120 100 L810 340" stroke="#147f80" stroke-width="6" fill="none"/><path d="M120 340 L810 100" stroke="#d06d4d" stroke-width="6" fill="none" stroke-dasharray="12 7"/><circle cx="465" cy="220" r="14" fill="#7461ba"/><text x="492" y="211" font-size="18" fill="#7461ba">时空相交</text><text x="28" y="91" font-size="17" fill="#203035">时间 t</text><text x="826" y="420" font-size="17" fill="#203035">位置 x</text><text x="135" y="376" font-size="16" fill="#147f80">机器人轨迹</text><text x="650" y="85" font-size="16" fill="#d06d4d">障碍占据带</text><text x="35" y="445" font-size="14" fill="#53676d">同一空间位置在不同时刻可能安全；碰撞判断必须使用统一时间戳。</text></g></svg>
