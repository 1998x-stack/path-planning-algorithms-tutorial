<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">RRT 四个基本操作的数据流</title><desc id="d">采样 qrand，最近邻 qnear，Steer 有限步长产生 qnew，最后整段碰撞检测才能接纳新树边。</desc><rect width="960" height="460" rx="17" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="26" y="89" width="213" height="281" rx="13" fill="#edf5f0" stroke="#c4d8cd"/><text x="41" y="130" font-size="18" fill="#147f80">01</text><text x="41" y="202" font-size="24" font-weight="700" fill="#203035">SAMPLE</text><text x="41" y="267" font-size="16" fill="#53676d">随机目标 qrand</text><path d="M239 231 h20" stroke="#7461ba" stroke-width="3"/><rect x="260" y="89" width="213" height="281" rx="13" fill="#edf5f0" stroke="#c4d8cd"/><text x="275" y="130" font-size="18" fill="#147f80">02</text><text x="275" y="202" font-size="24" font-weight="700" fill="#203035">NEAREST</text><text x="275" y="267" font-size="16" fill="#53676d">选择 qnear</text><path d="M473 231 h20" stroke="#7461ba" stroke-width="3"/><rect x="494" y="89" width="213" height="281" rx="13" fill="#edf5f0" stroke="#c4d8cd"/><text x="509" y="130" font-size="18" fill="#147f80">03</text><text x="509" y="202" font-size="24" font-weight="700" fill="#203035">STEER</text><text x="509" y="267" font-size="16" fill="#53676d">qnew 距近邻 ≤ η</text><path d="M707 231 h20" stroke="#7461ba" stroke-width="3"/><rect x="728" y="89" width="213" height="281" rx="13" fill="#edf4f9" stroke="#c4d8cd"/><text x="743" y="130" font-size="18" fill="#147f80">04</text><text x="743" y="202" font-size="24" font-weight="700" fill="#203035">VALIDATE</text><text x="743" y="267" font-size="16" fill="#53676d">边合法才加入树</text><text x="39" y="427" font-size="15" fill="#53676d">注意：抽到的 qrand 不等于加入树的 qnew；仅检验新状态不够，还要检验局部运动。</text></g></svg>
