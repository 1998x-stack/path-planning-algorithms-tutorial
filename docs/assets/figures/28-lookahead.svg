<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="la-t la-d"><title id="la-t">前瞻距离过短与过长的两种后果</title><desc id="la-d">一条从起点到目标的折线路径。机器人在路径中段，两个圆分别表示短前瞻与长前瞻：短前瞻的圆小、目标点离机器人近，标注为频繁转向；长前瞻的圆大、目标点越过转角，标注为切角与超前。两个目标点都用三角标记。</desc>
<rect width="900" height="320" rx="18" fill="#fffdf9"/>
<g font-family="Arial,PingFang SC,sans-serif">
<polyline points="80,250 300,250 480,120 760,120" fill="none" stroke="#147f80" stroke-width="4"/>
<circle cx="360" cy="250" r="8" fill="#203035"/>
<text x="330" y="286" font-size="13" fill="#53676d">机器人当前位置</text>
<circle cx="420" cy="250" r="10" fill="none" stroke="#d06d4d" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="560" cy="212" r="46" fill="none" stroke="#7461ba" stroke-width="2" stroke-dasharray="4 3"/>
<path d="M420 240 l-6 12 h12 z" fill="#d06d4d"/>
<circle cx="420" cy="250" r="4" fill="#d06d4d"/>
<circle cx="560" cy="212" r="4" fill="#7461ba"/>
<path d="M560 202 l-6 12 h12 z" fill="#7461ba"/>
<text x="360" y="212" font-size="13" fill="#a5482c">短前瞻：目标点很近</text>
<text x="612" y="200" font-size="13" fill="#7461ba">长前瞻：目标点越过转角</text>
<line x1="420" y1="250" x2="560" y2="212" stroke="#53676d" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="80" y="286" font-size="13" fill="#53676d">起点</text>
<text x="748" y="106" font-size="13" fill="#7461ba">目标</text>
<text x="80" y="308" font-size="13" fill="#203035">短前瞻 → 频繁重新选向、路径抖动；长前瞻 → 切过转角、做出超前加速决策。</text>
</g></svg>
