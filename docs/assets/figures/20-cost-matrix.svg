<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="cm-t cm-d"><title id="cm-t">代价矩阵必须来自内层路径规划</title><desc id="cm-d">左图 A、B 两点用直线相连，直线穿过阴影障碍，标注直线距离 10；右图同样的两点绕障碍走，实际路径更长，标注 30。下方的代价矩阵用绕行后的真实代价填入，而不是直线距离。</desc><rect width="900" height="400" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="250" y="34" font-size="16" fill="#203035" text-anchor="middle">A · 用直线距离（错误）</text><text x="660" y="34" font-size="16" fill="#203035" text-anchor="middle">B · 用内层路径代价（正确）</text><g transform="translate(60,50)"><rect width="380" height="180" rx="10" fill="#eef4f0"/><rect x="180" y="40" width="30" height="120" fill="#f0d3c9" stroke="#d06d4d" stroke-width="2"/><line x1="70" y1="150" x2="320" y2="40" stroke="#d06d4d" stroke-width="3" stroke-dasharray="7 6"/><circle cx="70" cy="150" r="8" fill="#203035"/><circle cx="320" cy="40" r="8" fill="#7461ba"/><text x="58" y="172" font-size="14" fill="#203035">A</text><text x="326" y="36" font-size="14" fill="#7461ba">B</text><text x="196" y="30" font-size="13" fill="#a5482c" text-anchor="middle">障碍</text><text x="190" y="112" font-size="14" fill="#a5482c" text-anchor="middle">直线 10（穿障碍）</text></g><g transform="translate(470,50)"><rect width="380" height="180" rx="10" fill="#eef4f0"/><rect x="180" y="40" width="30" height="120" fill="#f0d3c9" stroke="#d06d4d" stroke-width="2"/><path d="M70 150 L150 150 L150 40 L320 40" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="150" r="8" fill="#203035"/><circle cx="320" cy="40" r="8" fill="#7461ba"/><text x="58" y="172" font-size="14" fill="#203035">A</text><text x="326" y="36" font-size="14" fill="#7461ba">B</text><text x="196" y="30" font-size="13" fill="#a5482c" text-anchor="middle">障碍</text><text x="210" y="100" font-size="14" fill="#53676d" text-anchor="middle">绕行 30</text></g><g transform="translate(300,270)"><text x="0" y="16" font-size="15" fill="#203035" text-anchor="middle">代价矩阵（示意）</text><rect x="-70" y="40" width="60" height="34" fill="#eef4f0" stroke="#cbd9d2"/><rect x="-10" y="40" width="60" height="34" fill="#eef4f0" stroke="#cbd9d2"/><rect x="-70" y="74" width="60" height="34" fill="#eef4f0" stroke="#cbd9d2"/><rect x="-10" y="74" width="60" height="34" fill="#dfeee9" stroke="#cbd9d2"/><text x="-40" y="63" font-size="14" fill="#203035" text-anchor="middle">A</text><text x="20" y="63" font-size="14" fill="#203035" text-anchor="middle">B</text><text x="-40" y="97" font-size="14" fill="#203035" text-anchor="middle">A</text><text x="20" y="97" font-size="14" fill="#147f80" text-anchor="middle">30</text></g><text x="640" y="330" font-size="14" fill="#53676d">矩阵元素为内层规划得到的路径代价；</text><text x="640" y="352" font-size="14" fill="#53676d">图中 10 与 30 为教学示意，非实测。</text></g></svg>
