<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">规划系统的五阶段信息流</title><desc id="d">地图、构型空间、图/采样、路径搜索、轨迹与控制，以及回传观测的在线闭环。</desc><rect width="960" height="470" rx="16" fill="#fffdf9"/><g font-family="Arial, PingFang SC, sans-serif"><text x="40" y="48" fill="#53676d" font-size="16">WORLD → MODEL → SEARCH → FEASIBLE EXECUTION</text><rect x="27" y="124" width="166" height="156" rx="13" fill="#e5f2ed" stroke="#c6d7cd" stroke-width="2"/><circle cx="53" cy="150" r="12" fill="#147f80"/><text x="53" y="155" font-size="13" text-anchor="middle" fill="#fff">1</text><text x="42" y="194" font-size="20" font-weight="700" fill="#203035">感知与地图</text><text x="42" y="228" font-size="14" fill="#53676d">占据 / 语义 / 动态</text><path d="M 196 197 h 17 m-7 -6 l 7 6 -7 6" fill="none" stroke="#147f80" stroke-width="3"/><rect x="217" y="124" width="166" height="156" rx="13" fill="#e5f2ed" stroke="#c6d7cd" stroke-width="2"/><circle cx="243" cy="150" r="12" fill="#147f80"/><text x="243" y="155" font-size="13" text-anchor="middle" fill="#fff">2</text><text x="232" y="194" font-size="20" font-weight="700" fill="#203035">构型空间</text><text x="232" y="228" font-size="14" fill="#53676d">机器人足迹与障碍</text><path d="M 386 197 h 17 m-7 -6 l 7 6 -7 6" fill="none" stroke="#147f80" stroke-width="3"/><rect x="407" y="124" width="166" height="156" rx="13" fill="#ece9f6" stroke="#c6d7cd" stroke-width="2"/><circle cx="433" cy="150" r="12" fill="#147f80"/><text x="433" y="155" font-size="13" text-anchor="middle" fill="#fff">3</text><text x="422" y="194" font-size="20" font-weight="700" fill="#203035">状态表示</text><text x="422" y="228" font-size="14" fill="#53676d">网格图 / 采样树</text><path d="M 576 197 h 17 m-7 -6 l 7 6 -7 6" fill="none" stroke="#147f80" stroke-width="3"/><rect x="597" y="124" width="166" height="156" rx="13" fill="#f9eee7" stroke="#c6d7cd" stroke-width="2"/><circle cx="623" cy="150" r="12" fill="#147f80"/><text x="623" y="155" font-size="13" text-anchor="middle" fill="#fff">4</text><text x="612" y="194" font-size="20" font-weight="700" fill="#203035">全局规划</text><text x="612" y="228" font-size="14" fill="#53676d">可行路径与代价</text><path d="M 766 197 h 17 m-7 -6 l 7 6 -7 6" fill="none" stroke="#147f80" stroke-width="3"/><rect x="787" y="124" width="166" height="156" rx="13" fill="#f9eee7" stroke="#c6d7cd" stroke-width="2"/><circle cx="813" cy="150" r="12" fill="#147f80"/><text x="813" y="155" font-size="13" text-anchor="middle" fill="#fff">5</text><text x="802" y="194" font-size="20" font-weight="700" fill="#203035">轨迹与控制</text><text x="802" y="228" font-size="14" fill="#53676d">时间化 / 跟踪 / 安全</text><path d="M 895 288 V 371 H 118 V 288" stroke="#7461ba" stroke-width="3" fill="none" stroke-dasharray="10 7"/><path d="M 111 298 L 118 288 L 125 298" fill="none" stroke="#7461ba" stroke-width="3"/><rect x="327" y="352" width="334" height="38" rx="19" fill="#fff" stroke="#b3a8d3"/><text x="494" y="378" text-anchor="middle" font-size="17" fill="#57488c">位置反馈 · 地图更新 · 局部重规划</text><text x="34" y="436" font-size="14" fill="#53676d">虚线表示在线反馈，不是所有离线规划任务都具有该闭环。</text></g></svg>
