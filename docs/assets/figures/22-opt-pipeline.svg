<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="op-t op-d"><title id="op-t">优化建模的三个输入与输出</title><desc id="op-d">左侧三个方框分别是决策变量、目标函数与约束条件，箭头汇入中间的求解器框，求解器再向右输出一条满足约束、使目标较小的轨迹。</desc><rect width="900" height="420" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="40" y="70" width="230" height="60" rx="10" fill="#f3f0fb" stroke="#7461ba"/><text x="155" y="98" font-size="15" fill="#203035" text-anchor="middle">决策变量</text><text x="155" y="118" font-size="13" fill="#53676d" text-anchor="middle">路径点 x 或控制量 u</text><rect x="40" y="180" width="230" height="60" rx="10" fill="#eef4f0" stroke="#147f80"/><text x="155" y="208" font-size="15" fill="#203035" text-anchor="middle">目标函数</text><text x="155" y="228" font-size="13" fill="#53676d" text-anchor="middle">长度 + 平滑 + 避障惩罚</text><rect x="40" y="290" width="230" height="60" rx="10" fill="#f0e6e1" stroke="#d06d4d"/><text x="155" y="318" font-size="15" fill="#203035" text-anchor="middle">约束条件</text><text x="155" y="338" font-size="13" fill="#53676d" text-anchor="middle">动力学 / 避障 / 边界</text><line x1="270" y1="100" x2="380" y2="195" stroke="#53676d" stroke-width="2.5"/><line x1="270" y1="210" x2="380" y2="210" stroke="#53676d" stroke-width="2.5"/><line x1="270" y1="320" x2="380" y2="225" stroke="#53676d" stroke-width="2.5"/><rect x="380" y="150" width="180" height="120" rx="12" fill="#e6e2f5" stroke="#7461ba" stroke-width="2"/><text x="470" y="200" font-size="16" fill="#203035" text-anchor="middle">求解器</text><text x="470" y="224" font-size="13" fill="#53676d" text-anchor="middle">QP / SQP / 内点 / 梯度</text><line x1="560" y1="210" x2="660" y2="210" stroke="#53676d" stroke-width="2.5"/><polygon points="660,210 648,204 648,216" fill="#53676d"/><rect x="670" y="110" width="200" height="200" rx="12" fill="#eef4f0"/><rect x="700" y="150" width="60" height="120" fill="#f0d3c9"/><path d="M690 290 L730 290 L730 200 L830 200 L830 150" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="690" cy="290" r="6" fill="#203035"/><circle cx="830" cy="150" r="6" fill="#7461ba"/><text x="770" y="332" font-size="14" fill="#53676d" text-anchor="middle">输出轨迹</text><text x="450" y="370" font-size="14" fill="#53676d" text-anchor="middle">改需求 = 改目标或约束，无需重写求解过程（教学示意）。</text></g></svg>
