<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">滚动时域局部规划在障碍占据通道时先等待</title><desc id="svg-desc">时间轴显示障碍物在t=1进入通道，机器人在t=0等待，障碍物移动后机器人沿通道继续行进。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,'PingFang SC',sans-serif"><text x="32" y="52" font-size="22" fill="#203035" font-weight="700">Receding-horizon execution</text><g><rect x="102" y="113" width="108" height="190" rx="10" fill="#f5f8f5" stroke="#d7e2da"/><text x="156" y="145" text-anchor="middle" font-size="18" fill="#203035">t = 0</text><rect x="120" y="185" width="72" height="34" rx="5" fill="#d06d4d"/><text x="156" y="207" text-anchor="middle" font-size="13" fill="#fff">obstacle</text><circle cx="156" cy="263" r="13" fill="#147f80"/><text x="156" y="292" text-anchor="middle" font-size="13" fill="#53676d">wait</text><rect x="239" y="113" width="108" height="190" rx="10" fill="#f5f8f5" stroke="#d7e2da"/><text x="293" y="145" text-anchor="middle" font-size="18" fill="#203035">t = 1</text><rect x="257" y="185" width="72" height="34" rx="5" fill="#d06d4d"/><text x="293" y="207" text-anchor="middle" font-size="13" fill="#fff">obstacle</text><circle cx="293" cy="263" r="13" fill="#147f80"/><text x="293" y="292" text-anchor="middle" font-size="13" fill="#53676d">move</text><rect x="376" y="113" width="108" height="190" rx="10" fill="#f5f8f5" stroke="#d7e2da"/><text x="430" y="145" text-anchor="middle" font-size="18" fill="#203035">t = 2</text><rect x="394" y="185" width="72" height="34" rx="5" fill="#d06d4d"/><text x="430" y="207" text-anchor="middle" font-size="13" fill="#fff">obstacle</text><circle cx="430" cy="263" r="13" fill="#147f80"/><text x="430" y="292" text-anchor="middle" font-size="13" fill="#53676d">move</text><rect x="513" y="113" width="108" height="190" rx="10" fill="#f5f8f5" stroke="#d7e2da"/><text x="567" y="145" text-anchor="middle" font-size="18" fill="#203035">t = 3</text><rect x="531" y="185" width="72" height="34" rx="5" fill="#e4eae5"/><text x="567" y="207" text-anchor="middle" font-size="13" fill="#fff">obstacle</text><circle cx="567" cy="263" r="13" fill="#147f80"/><text x="567" y="292" text-anchor="middle" font-size="13" fill="#53676d">move</text><rect x="650" y="113" width="108" height="190" rx="10" fill="#f5f8f5" stroke="#d7e2da"/><text x="704" y="145" text-anchor="middle" font-size="18" fill="#203035">t = 4</text><rect x="668" y="185" width="72" height="34" rx="5" fill="#e4eae5"/><text x="704" y="207" text-anchor="middle" font-size="13" fill="#53676d">clear</text><circle cx="704" cy="263" r="13" fill="#147f80"/><text x="704" y="292" text-anchor="middle" font-size="13" fill="#53676d">move</text><rect x="787" y="113" width="108" height="190" rx="10" fill="#f5f8f5" stroke="#d7e2da"/><text x="841" y="145" text-anchor="middle" font-size="18" fill="#203035">t = 5</text><rect x="805" y="185" width="72" height="34" rx="5" fill="#e4eae5"/><text x="841" y="207" text-anchor="middle" font-size="13" fill="#53676d">clear</text><circle cx="841" cy="263" r="13" fill="#147f80"/><text x="841" y="292" text-anchor="middle" font-size="13" fill="#53676d">move</text></g><path d="M210 333 H238 M347 333 H375 M484 333 H512 M621 333 H649" stroke="#147f80" stroke-width="3"/><text x="32" y="385" font-size="18" fill="#d06d4d">At t=0 the next cell is occupied at t=1 → wait one tick</text><text x="32" y="427" font-size="15" fill="#53676d">Only the first local action is executed; the plan is recomputed after each observation.</text></g></svg>
