<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">机器人等待后沿通道通过移动障碍</title><desc id="svg-desc">五个时刻的离散走廊状态：t0机器人位于0并等待，t1机器人仍在0而障碍物位于1，t2机器人在1而障碍物在2，t3机器人在2而障碍物在3，t4机器人在3而障碍物已移出通道。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><text x="30" y="48" font-size="22" font-family="Arial,'PingFang SC',sans-serif" font-weight="700" fill="#203035">One-step execution, then replan</text><rect x="24" y="94" width="174" height="250" rx="12" fill="#f4f8f4" stroke="#d7e2da"/><text x="111" y="127" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#203035">t = 0</text><rect x="37" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="61" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="85" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="109" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="133" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="157" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><circle cx="47" cy="237" r="10" fill="#147f80"/><text x="47" y="282" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#147f80">R</text><text x="111" y="184" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="#53676d">obstacle off lane</text><text x="111" y="318" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#53676d">wait</text><rect x="212" y="94" width="174" height="250" rx="12" fill="#f4f8f4" stroke="#d7e2da"/><text x="299" y="127" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#203035">t = 1</text><rect x="225" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="249" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="273" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="297" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="321" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="345" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><circle cx="235" cy="237" r="10" fill="#147f80"/><text x="235" y="282" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#147f80">R</text><rect x="254" y="170" width="18" height="18" rx="3" fill="#d06d4d"/><text x="263" y="160" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#d06d4d">O</text><text x="299" y="318" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#53676d">move to 1</text><rect x="400" y="94" width="174" height="250" rx="12" fill="#f4f8f4" stroke="#d7e2da"/><text x="487" y="127" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#203035">t = 2</text><rect x="413" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="437" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="461" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="485" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="509" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="533" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><circle cx="447" cy="237" r="10" fill="#147f80"/><text x="447" y="282" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#147f80">R</text><rect x="466" y="170" width="18" height="18" rx="3" fill="#d06d4d"/><text x="475" y="160" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#d06d4d">O</text><text x="487" y="318" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#53676d">move to 2</text><rect x="588" y="94" width="174" height="250" rx="12" fill="#f4f8f4" stroke="#d7e2da"/><text x="675" y="127" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#203035">t = 3</text><rect x="601" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="625" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="649" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="673" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="697" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="721" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><circle cx="659" cy="237" r="10" fill="#147f80"/><text x="659" y="282" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#147f80">R</text><rect x="678" y="170" width="18" height="18" rx="3" fill="#d06d4d"/><text x="687" y="160" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#d06d4d">O</text><text x="675" y="318" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#53676d">move to 3</text><rect x="776" y="94" width="174" height="250" rx="12" fill="#f4f8f4" stroke="#d7e2da"/><text x="863" y="127" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#203035">t = 4</text><rect x="789" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="813" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="837" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="861" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="885" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><rect x="909" y="218" width="21" height="38" rx="3" fill="#fff" stroke="#cbdacf"/><circle cx="871" cy="237" r="10" fill="#147f80"/><text x="871" y="282" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#147f80">R</text><text x="863" y="184" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="#53676d">obstacle off lane</text><text x="863" y="318" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#53676d">continue</text><text x="30" y="397" font-size="18" font-family="Arial,'PingFang SC',sans-serif" fill="#d06d4d">At t=0 the predicted next cell is occupied at t=1, so the robot waits.</text><text x="30" y="431" font-size="15" font-family="Arial,'PingFang SC',sans-serif" fill="#53676d">The local plan is recomputed after each observation; only its first action is executed.</text></svg>
