<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Neural A星把可学习引导图接入可微分搜索</title><desc id="svg-desc">地图和起终点经卷积编码器生成guidance map，接入可微分A*模块输出路径，专家路径监督训练引导表示。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,'PingFang SC',sans-serif"><rect x="28" y="133" width="150" height="142" rx="12" fill="#eef6f1" stroke="#cbdacf"/><text x="103" y="174" text-anchor="middle" font-size="19" fill="#203035">Map + goal</text><g fill="#536767"><rect x="65" y="198" width="18" height="18"/><rect x="83" y="198" width="18" height="18"/><rect x="101" y="216" width="18" height="18"/></g><path d="M178 204 H227" stroke="#147f80" stroke-width="4"/><rect x="227" y="133" width="168" height="142" rx="12" fill="#f6f2fa" stroke="#d8d1e7"/><text x="311" y="174" text-anchor="middle" font-size="19" fill="#203035">Encoder</text><text x="311" y="213" text-anchor="middle" font-size="16" fill="#53676d">CNN features</text><text x="311" y="241" text-anchor="middle" font-size="16" fill="#53676d">learned guidance</text><path d="M395 204 H445" stroke="#147f80" stroke-width="4"/><rect x="445" y="133" width="202" height="142" rx="12" fill="#f8f1eb" stroke="#e4d2c7"/><text x="546" y="174" text-anchor="middle" font-size="19" fill="#203035">Differentiable A*</text><text x="546" y="213" text-anchor="middle" font-size="16" fill="#53676d">search recurrence</text><text x="546" y="241" text-anchor="middle" font-size="16" fill="#53676d">soft path weights</text><path d="M647 204 H699" stroke="#147f80" stroke-width="4"/><rect x="699" y="133" width="232" height="142" rx="12" fill="#eef6f1" stroke="#cbdacf"/><text x="815" y="174" text-anchor="middle" font-size="19" fill="#203035">Predicted path</text><path d="M742 233 L780 214 L813 228 L859 190" stroke="#147f80" stroke-width="5" fill="none"/><path d="M546 275 V343 H311 V275" stroke="#d06d4d" stroke-width="3" stroke-dasharray="8 6" fill="none"/><text x="426" y="373" font-size="17" fill="#d06d4d">expert path supervision / loss</text></g></svg>
