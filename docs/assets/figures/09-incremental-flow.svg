<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">D星Lite修复循环的三分支</title><desc id="d">从OPEN弹出最小键：若旧键小于新键则重入队；过一致时更新g；欠一致时失效g并更新前驱。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="298" y="28" width="365" height="62" rx="10" fill="#203035"/><text x="480" y="67" fill="white" text-anchor="middle" font-size="20">OPEN 弹出最小 key 的 u</text><path d="M480 90 V135" stroke="#53676d" stroke-width="3"/><rect x="296" y="135" width="368" height="64" rx="10" fill="#edf4ef" stroke="#b9d0c5"/><text x="480" y="174" text-anchor="middle" font-size="18" fill="#203035">oldKey &lt; newKey ?</text><g><path d="M300 167 H159 V236 M660 167 H800 V236 M480 199 V236" stroke="#7461ba" stroke-width="3" fill="none"/><rect x="20" y="236" width="271" height="128" rx="12" fill="#e8f1fb" stroke="#acbedd"/><rect x="344" y="236" width="271" height="128" rx="12" fill="#e9f5ed" stroke="#add1c0"/><rect x="669" y="236" width="271" height="128" rx="12" fill="#fff0e8" stroke="#e4baa8"/></g><g font-size="17" fill="#203035"><text x="35" y="270" font-weight="700">旧键偏小</text><text x="35" y="310">更新 key 重新入队</text><text x="360" y="270" font-weight="700">g(u) &gt; rhs(u)</text><text x="360" y="310">令 g=rhs，通知前驱</text><text x="683" y="270" font-weight="700">其余：旧 g 失效</text><text x="683" y="310">令 g=∞，修复前驱</text></g><text x="42" y="426" font-size="15" fill="#53676d">持续到 OPEN 顶部的 key 不优于起点 key，且起点 g/rhs 已一致。</text></g></svg>
