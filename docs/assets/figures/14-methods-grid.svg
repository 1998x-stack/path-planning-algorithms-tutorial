<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">RRT树、RRT星重连树和PRM含环路网的结构区别</title><desc id="d">两种树与复用的有环路网，以数据结构、查询复用而非速度排名为重点。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="18" y="76" width="295" height="316" rx="13" fill="#f2f7f3" stroke="#d1e0d4"/><text x="36" y="114" font-size="22" font-weight="700" fill="#203035">RRT</text><path d="M66 310 L117 219 L181 255 M117 219 L142 151 L222 118 M142 151 L81 91" stroke="#147f80" stroke-width="4" fill="none"/><circle cx="66" cy="310" r="11" fill="#147f80"/><text x="35" y="379" font-size="15" fill="#53676d">先找合法树</text></rect><rect x="333" y="76" width="295" height="316" rx="13" fill="#f2f7f3" stroke="#d1e0d4"/><text x="351" y="114" font-size="22" font-weight="700" fill="#203035">RRT*</text><path d="M381 310 L432 219 L496 255 M432 219 L457 151 L537 118 M457 151 L396 91" stroke="#147f80" stroke-width="4" fill="none"/><circle cx="381" cy="310" r="11" fill="#147f80"/><path d="M383 329 L523 191" stroke="#d06d4d" stroke-width="4" stroke-dasharray="8 7"/><text x="350" y="379" font-size="15" fill="#53676d">树上重连优化</text></rect><rect x="648" y="76" width="295" height="316" rx="13" fill="#f2f7f3" stroke="#d1e0d4"/><text x="666" y="114" font-size="22" font-weight="700" fill="#203035">PRM / PRM*</text><path d="M693 310 L762 150 L842 267 L893 112 L761 86 L842 267 L761 86 M762 150 L893 112" stroke="#7461ba" stroke-width="3" fill="none"/><circle cx="693" cy="310" r="9" fill="#7461ba"/><circle cx="762" cy="150" r="9" fill="#7461ba"/><circle cx="842" cy="267" r="9" fill="#7461ba"/><circle cx="893" cy="112" r="9" fill="#7461ba"/><circle cx="761" cy="86" r="9" fill="#7461ba"/><text x="665" y="379" font-size="15" fill="#53676d">建图后反复查询</text></rect><text x="21" y="436" font-size="14" fill="#53676d">虚线代表 RRT* 的候选重连，不代表这条边无需碰撞测试。</text></g></svg>
