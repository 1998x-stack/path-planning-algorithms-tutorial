<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="bv-t bv-d"><title id="bv-t">小样本与大样本的估计波动</title><desc id="bv-d">同一真实均值下，n=3 的估计在很宽的范围内跳动，n=30 的估计集中得多。两组虚线竖线分别表示两种样本量下的置信区间，中心估计相同。</desc><rect width="900" height="340" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><line x1="80" y1="240" x2="820" y2="240" stroke="#53676d" stroke-width="2"/><text x="800" y="264" font-size="14" fill="#53676d" text-anchor="end">耗时 →</text><line x1="450" y1="60" x2="450" y2="240" stroke="#203035" stroke-width="2" stroke-dasharray="4 4"/><text x="450" y="48" font-size="14" fill="#203035" text-anchor="middle">真实均值</text><rect x="230" y="90" width="440" height="30" rx="6" fill="#f0d3c9" opacity="0.55"/><text x="230" y="84" font-size="14" fill="#a5482c">n = 3 的置信区间（宽）</text><rect x="360" y="150" width="180" height="30" rx="6" fill="#dfeee9"/><text x="360" y="144" font-size="14" fill="#147f80">n = 30 的置信区间（窄）</text><circle cx="120" cy="210" r="5" fill="#d06d4d"/><circle cx="300" cy="210" r="5" fill="#d06d4d"/><circle cx="520" cy="210" r="5" fill="#d06d4d"/><circle cx="700" cy="210" r="5" fill="#d06d4d"/><circle cx="430" cy="210" r="5" fill="#53676d"/><circle cx="470" cy="210" r="5" fill="#53676d"/><circle cx="450" cy="210" r="5" fill="#53676d"/><text x="420" y="300" font-size="14" fill="#53676d">红色：少数次运行的点估计仍可能远离真实值（教学示意）。</text></g></svg>
