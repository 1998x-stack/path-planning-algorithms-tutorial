<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="tl-t tl-d"><title id="tl-t">多目标规划的双层结构</title><desc id="tl-d">上层是一串访问顺序 S、g3、g1、g4、g2、G；每对相邻目标点通过箭头调用下层的内层路径规划，在带障碍的栅格上求两点最优路径，并把路径代价返回给上层用于评分。</desc><rect width="900" height="380" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="40" y="46" width="820" height="90" rx="12" fill="#f3f0fb"/><text x="60" y="36" font-size="15" fill="#7461ba">外层：搜索访问顺序（TSP 类组合问题）</text><g font-size="15"><circle cx="110" cy="91" r="22" fill="#203035"/><text x="110" y="97" fill="#fff" text-anchor="middle">S</text><circle cx="250" cy="91" r="22" fill="#7461ba"/><text x="250" y="97" fill="#fff" text-anchor="middle">g3</text><circle cx="390" cy="91" r="22" fill="#7461ba"/><text x="390" y="97" fill="#fff" text-anchor="middle">g1</text><circle cx="530" cy="91" r="22" fill="#7461ba"/><text x="530" y="97" fill="#fff" text-anchor="middle">g4</text><circle cx="670" cy="91" r="22" fill="#7461ba"/><text x="670" y="97" fill="#fff" text-anchor="middle">g2</text><circle cx="810" cy="91" r="22" fill="#203035"/><text x="810" y="97" fill="#fff" text-anchor="middle">G</text></g><line x1="132" y1="91" x2="228" y2="91" stroke="#7461ba" stroke-width="3"/><line x1="272" y1="91" x2="368" y2="91" stroke="#7461ba" stroke-width="3"/><line x1="412" y1="91" x2="508" y2="91" stroke="#7461ba" stroke-width="3"/><line x1="552" y1="91" x2="648" y2="91" stroke="#7461ba" stroke-width="3"/><line x1="692" y1="91" x2="788" y2="91" stroke="#7461ba" stroke-width="3"/><line x1="390" y1="116" x2="390" y2="168" stroke="#53676d" stroke-width="3" stroke-dasharray="6 5"/><line x1="530" y1="116" x2="530" y2="168" stroke="#53676d" stroke-width="3" stroke-dasharray="6 5"/><polygon points="390,168 384,156 396,156" fill="#53676d"/><polygon points="530,168 524,156 536,156" fill="#53676d"/><rect x="120" y="170" width="660" height="150" rx="12" fill="#eef4f0" stroke="#cbd9d2"/><text x="140" y="196" font-size="15" fill="#203035">内层：在障碍地图上求两点间最优路径（图搜索 / 采样）</text><rect x="360" y="220" width="200" height="80" rx="8" fill="#fffdf9" stroke="#cbd9d2"/><rect x="440" y="220" width="40" height="80" fill="#f0d3c9"/><path d="M380 285 L380 240 L500 240 L540 285" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="380" cy="285" r="6" fill="#203035"/><circle cx="540" cy="285" r="6" fill="#d06d4d"/><text x="460" y="216" font-size="13" fill="#a5482c" text-anchor="middle">障碍</text><text x="460" y="316" font-size="13" fill="#53676d" text-anchor="middle">返回真实路径代价 D[i][j]</text><text x="490" y="360" font-size="14" fill="#53676d" text-anchor="middle">外层用 D 给顺序打分；两层反复交互，而非一次完成。</text></g></svg>
