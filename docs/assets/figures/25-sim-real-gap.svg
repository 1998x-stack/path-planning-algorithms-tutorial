<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">仿真与真实设备存在状态估计与物理误差</title><desc id="d">仿真侧显示理想模型、同步数据；实车侧显示传感器噪声、通信延迟、轮胎滑移与制动偏差。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="24" y="84" width="438" height="288" rx="14" fill="#f0f7f1" stroke="#cbdacf"/><rect x="495" y="84" width="440" height="288" rx="14" fill="#f7f1f4" stroke="#ddd0de"/><text x="50" y="126" font-size="24" font-weight="700" fill="#203035">SIMULATION</text><text x="520" y="126" font-size="24" font-weight="700" fill="#203035">REAL ROBOT</text><path d="M65 314 Q201 155 428 248" stroke="#147f80" stroke-width="6" fill="none"/><path d="M538 314 Q671 164 891 242" stroke="#147f80" stroke-width="4" stroke-dasharray="11 6" fill="none"/><path d="M538 314 Q665 187 891 280" stroke="#d06d4d" stroke-width="6" fill="none"/><circle cx="179" cy="214" r="20" fill="#147f80"/><circle cx="674" cy="226" r="20" fill="#d06d4d"/><g font-size="18" fill="#53676d"><text x="52" y="344">理想模型、理想时间戳</text><text x="521" y="344">延迟、噪声、滑移、制动偏差</text></g><text x="30" y="430" font-size="15" fill="#53676d">差异图不是实测轨迹；展示需要单独辨识和验证的四类误差来源。</text></g></svg>
