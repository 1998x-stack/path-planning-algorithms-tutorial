<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">运动学规划状态包含平面位置与朝向</title><desc id="desc">同一坐标位置的两辆车朝向不同，因此可执行的下一段曲线也不同。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="38" y="78" width="884" height="312" rx="14" fill="#f3f7f3" stroke="#d7e3da"/><circle cx="270" cy="235" r="18" fill="#147f80"/><path d="M270 235 H450" stroke="#147f80" stroke-width="8" stroke-linecap="round"/><path d="M270 235 L270 110" stroke="#d06d4d" stroke-width="8" stroke-linecap="round"/><path d="M440 235 l-22 -13 v26 z" fill="#147f80"/><path d="M270 110 l-13 22 h26 z" fill="#d06d4d"/><text x="475" y="242" font-size="19" fill="#147f80">θ = 0</text><text x="292" y="111" font-size="19" fill="#d06d4d">θ = π/2</text><text x="232" y="285" font-size="18" fill="#203035">同一 (x,y)</text><text x="520" y="155" font-size="18" fill="#53676d">状态 = (x, y, θ)</text><text x="520" y="205" font-size="17" fill="#53676d">方向不同 → 运动约束不同</text><text x="35" y="435" font-size="15" fill="#53676d">车体模型示意，未按具体轴距或轮距绘制。</text></g></svg>
