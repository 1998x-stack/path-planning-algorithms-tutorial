<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">ARA星通过修复和降低权重持续改善解</title><desc id="d">两个阶段示意epsilon3成本6和epsilon1成本4，OPEN/CLOSED/INCONS在调整权重后复用。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="37" y="86" width="351" height="300" rx="15" fill="#f7eee8" stroke="#e3bba9"/><rect x="570" y="86" width="351" height="300" rx="15" fill="#e8f4ee" stroke="#a4cabc"/><g font-size="20" fill="#203035"><text x="67" y="136" font-weight="700">初始：ε = 3</text><text x="610" y="136" font-weight="700">修复后：ε = 1</text><text x="67" y="208">S → B → G</text><text x="610" y="208">S → A → G</text><text x="67" y="266" fill="#b66047" font-weight="700">成本 6 · 有界次优</text><text x="610" y="266" fill="#147f80" font-weight="700">成本 4 · 最优</text></g><path d="M 394 236 H 558 m-13 -9 l13 9 -13 9" fill="none" stroke="#7461ba" stroke-width="4"/><rect x="405" y="166" width="145" height="48" rx="8" fill="#fff" stroke="#7461ba"/><text x="478" y="195" text-anchor="middle" font-size="17" fill="#57488c">降低 ε</text><text x="410" y="316" font-size="15" fill="#57488c">复用 g、OPEN、INCONS</text><text x="42" y="437" font-size="15" fill="#53676d">示意搜索质量改善；实际 ARA* 需正确维护 INCONS、CLOSED 和次优界更新。</text></g></svg>
