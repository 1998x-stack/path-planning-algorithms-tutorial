<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">松弛让暂定代价下降</title><desc id="d">三个阶段说明找到更优候选边后会更新未定稿节点的暂定距离。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="35" y="83" width="280" height="305" rx="15" fill="#f4f7f3" stroke="#c8d7ce" stroke-width="2"/><circle cx="69" cy="117" r="19" fill="#147f80"/><text x="69" y="124" font-size="19" fill="white" text-anchor="middle">1</text><text x="56" y="170" font-size="23" font-weight="700" fill="#203035">弹出 S</text><text x="56" y="226" font-size="18" fill="#203035">最小堆候选：</text><text x="56" y="267" font-size="19" fill="#147f80">A:2  B:5</text><text x="56" y="321" font-size="16" fill="#53676d">已确认：S</text></rect><rect x="345" y="83" width="280" height="305" rx="15" fill="#e9f4ee" stroke="#c8d7ce" stroke-width="2"/><circle cx="379" cy="117" r="19" fill="#147f80"/><text x="379" y="124" font-size="19" fill="white" text-anchor="middle">2</text><text x="366" y="170" font-size="23" font-weight="700" fill="#203035">弹出 A</text><text x="366" y="226" font-size="18" fill="#203035">最小堆候选：</text><text x="366" y="267" font-size="19" fill="#147f80">B:3  G:9</text><text x="366" y="321" font-size="16" fill="#53676d">已确认：S, A</text></rect><rect x="655" y="83" width="280" height="305" rx="15" fill="#f4f7f3" stroke="#c8d7ce" stroke-width="2"/><circle cx="689" cy="117" r="19" fill="#147f80"/><text x="689" y="124" font-size="19" fill="white" text-anchor="middle">3</text><text x="676" y="170" font-size="23" font-weight="700" fill="#203035">弹出 B</text><text x="676" y="226" font-size="18" fill="#203035">最小堆候选：</text><text x="676" y="267" font-size="19" fill="#147f80">G:5</text><text x="676" y="321" font-size="16" fill="#53676d">已确认：S, A, B</text></rect><text x="43" y="431" font-size="15" fill="#53676d">S→A 的成本 2，A→B 的成本 1；发现更低代价时只更新暂定值，不提前终止。</text></g></svg>
