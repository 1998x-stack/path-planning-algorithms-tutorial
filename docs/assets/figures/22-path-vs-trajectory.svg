<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">路径只有几何，轨迹还要满足时间与速度</title><desc id="d">左侧折线路径没有时间，右侧同一路线沿时间轴标注速度与停止状态。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="27" y="80" width="434" height="296" rx="14" fill="#f1f6f2" stroke="#d3e0d6"/><rect x="494" y="80" width="436" height="296" rx="14" fill="#f6f3fa" stroke="#ddd6e7"/><text x="48" y="116" font-size="23" font-weight="700" fill="#203035">PATH：只包含位置</text><text x="515" y="116" font-size="23" font-weight="700" fill="#203035">TRAJECTORY：位置 + 时间</text><path d="M70 300 Q140 180 240 226 T402 148" stroke="#147f80" stroke-width="7" fill="none"/><path d="M540 300 Q615 180 705 226 T868 148" stroke="#7461ba" stroke-width="7" fill="none"/><g font-size="17" fill="#203035"><circle cx="540" cy="300" r="10" fill="#7461ba"/><text x="547" y="334">t=0, v=0.2</text><circle cx="705" cy="226" r="10" fill="#7461ba"/><text x="620" y="205">t=1.0, v=1.2</text><circle cx="868" cy="148" r="10" fill="#7461ba"/><text x="762" y="133">t=2.0, v=0.7</text><text x="65" y="345" fill="#53676d">没有速度/加速度定义</text></g><text x="35" y="432" font-size="16" fill="#53676d">给定空间路线不决定机器人何时通过每个位置，更不代表直接可执行。</text></g></svg>
