<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="lp-t lp-d"><title id="lp-t">运动基元弧簇与晶格搜索</title><desc id="lp-d">左图从一个状态出发，按不同曲率与速度采样出一簇圆滑的运动基元；右图把基元作为边连接离散晶格状态，高亮一条从起点到目标的拼接路径。</desc><rect width="960" height="400" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="30" y="34" font-size="18" fill="#203035" font-weight="700">同一状态的基元弧簇</text><text x="520" y="34" font-size="18" fill="#203035" font-weight="700">晶格搜索：基元作为边</text><rect x="30" y="50" width="420" height="320" rx="12" fill="#eef4f0"/><path d="M120 330 L120 150" fill="none" stroke="#203035" stroke-width="4" stroke-linecap="round"/><path d="M120 330 Q112 240 92 150" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round"/><path d="M120 330 Q70 250 34 160" fill="none" stroke="#7461ba" stroke-width="4" stroke-linecap="round"/><path d="M120 330 Q128 240 148 150" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round"/><path d="M120 330 Q172 250 206 160" fill="none" stroke="#7461ba" stroke-width="4" stroke-linecap="round"/><circle cx="120" cy="330" r="9" fill="#203035"/><text x="96" y="362" font-size="14" fill="#203035">初始状态</text><text x="150" y="120" font-size="14" fill="#203035">曲率↑ / 速度不同</text><rect x="520" y="50" width="410" height="320" rx="12" fill="#eef4f0"/><g stroke="#c7d5cd" stroke-width="2" fill="none"><path d="M570 300 Q620 296 670 300"/><path d="M670 300 Q720 296 770 300"/><path d="M770 300 Q820 296 870 300"/><path d="M570 220 Q620 216 670 220"/><path d="M670 220 Q720 216 770 220"/><path d="M770 220 Q820 216 870 220"/><path d="M570 140 A70 70 0 0 1 670 140"/><path d="M670 140 A70 70 0 0 1 770 140"/><path d="M770 140 A70 70 0 0 1 870 140"/><path d="M570 300 Q620 250 670 220"/><path d="M670 300 Q720 250 770 220"/><path d="M670 220 Q720 170 770 140"/><path d="M770 220 Q820 170 870 140"/></g><path d="M570 300 Q620 250 670 220 Q720 170 770 140 L870 140" fill="none" stroke="#d06d4d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#53676d"><circle cx="570" cy="300" r="6"/><circle cx="670" cy="300" r="6"/><circle cx="770" cy="300" r="6"/><circle cx="870" cy="300" r="6"/><circle cx="570" cy="220" r="6"/><circle cx="670" cy="220" r="6"/><circle cx="770" cy="220" r="6"/><circle cx="870" cy="220" r="6"/><circle cx="570" cy="140" r="6"/><circle cx="670" cy="140" r="6"/><circle cx="770" cy="140" r="6"/></g><circle cx="570" cy="300" r="10" fill="#147f80"/><circle cx="870" cy="140" r="10" fill="#7461ba"/><text x="540" y="336" font-size="14" fill="#147f80">起点</text><text x="884" y="140" font-size="14" fill="#7461ba">目标</text><text x="580" y="392" font-size="14" fill="#53676d">灰线为连接邻接状态的基元边；陶红为搜索得到的一条拼接轨迹。</text></g></svg>
