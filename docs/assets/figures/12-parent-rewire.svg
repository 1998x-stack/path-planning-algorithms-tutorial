<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">选父节点要比较累计成本加边成本</title><desc id="d">新节点X距离A更近，A到根的成本8；B较远但累计成本3，选择B给出更低总成本。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="32" y="44" font-size="21" font-weight="700" fill="#203035">最近邻不一定是最便宜的父节点</text><path d="M 102 312 L 302 140 L 564 246 M 102 312 L 382 350 L 564 246" stroke="#b8cfc0" stroke-width="4" fill="none"/><path d="M 382 350 L 564 246" stroke="#147f80" stroke-width="7"/><path d="M 302 140 L 564 246" stroke="#d06d4d" stroke-width="4" stroke-dasharray="10 7"/><circle cx="102" cy="312" r="21" stroke="#203035" stroke-width="2" fill="#147f80"/><text x="102" y="319" text-anchor="middle" font-size="22" fill="#fff">S</text><circle cx="302" cy="140" r="21" stroke="#203035" stroke-width="2" fill="#fff"/><text x="302" y="147" text-anchor="middle" font-size="22" fill="#203035">A</text><circle cx="382" cy="350" r="21" stroke="#203035" stroke-width="2" fill="#fff"/><text x="382" y="357" text-anchor="middle" font-size="22" fill="#203035">B</text><circle cx="564" cy="246" r="21" stroke="#203035" stroke-width="2" fill="#7461ba"/><text x="564" y="253" text-anchor="middle" font-size="22" fill="#fff">X</text><g font-size="19" fill="#203035"><text x="240" y="112">g(A)=8</text><text x="348" y="398">g(B)=3</text><text x="643" y="151" fill="#d06d4d">经 A：8+2=10</text><text x="643" y="213" fill="#147f80">经 B：3+3=6</text><text x="643" y="278">选 B 为 parent(X)</text></g><text x="33" y="436" font-size="15" fill="#53676d">图只描述“近邻集合中的合法父边”选择，实际算法必须逐条校验碰撞。</text></g></svg>
