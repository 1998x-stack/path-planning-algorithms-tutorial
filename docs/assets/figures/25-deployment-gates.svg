<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">从单元测试到真实现场的五级上线门禁</title><desc id="d">依次通过离线算法测试、仿真、硬件在环、低速隔离试验与安全审查，每一级失败返回整改。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="31" y="49" font-size="22" font-weight="700" fill="#203035">EVIDENCE-BASED DEPLOYMENT GATES</text><rect x="16" y="260" width="178" height="130" rx="12" fill="#eef7f1" stroke="#d0dcd5" stroke-width="2"/><text x="34" y="304" font-size="18" fill="#203035" font-weight="700">01</text><text x="34" y="350" font-size="20" fill="#147f80">代码单测</text><rect x="206" y="220" width="178" height="170" rx="12" fill="#f6f2fa" stroke="#d0dcd5" stroke-width="2"/><text x="224" y="264" font-size="18" fill="#203035" font-weight="700">02</text><text x="224" y="310" font-size="20" fill="#147f80">仿真</text><rect x="396" y="180" width="178" height="210" rx="12" fill="#eef7f1" stroke="#d0dcd5" stroke-width="2"/><text x="414" y="224" font-size="18" fill="#203035" font-weight="700">03</text><text x="414" y="270" font-size="20" fill="#147f80">硬件在环</text><rect x="586" y="140" width="178" height="250" rx="12" fill="#f6f2fa" stroke="#d0dcd5" stroke-width="2"/><text x="604" y="184" font-size="18" fill="#203035" font-weight="700">04</text><text x="604" y="230" font-size="20" fill="#147f80">低速隔离</text><rect x="776" y="100" width="178" height="290" rx="12" fill="#f9eae2" stroke="#d06d4d" stroke-width="2"/><text x="794" y="144" font-size="18" fill="#203035" font-weight="700">05</text><text x="794" y="190" font-size="20" fill="#147f80">现场评审</text><text x="33" y="436" font-size="15" fill="#53676d">门禁是安全论证与测试证据的累积；不能仅凭导航成功退出码自动放行。</text></g></svg>
