<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">综合导航系统由全局路径、局部时空搜索和安全反馈组成</title><desc id="svg-desc">静态地图A*给出全局路线，局部时空规划考虑动态障碍，碰撞检查决定下一步，执行反馈触发滚动重规划。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,'PingFang SC',sans-serif"><rect x="24" y="124" width="170" height="132" rx="12" fill="#eef6f1" stroke="#cbdacf"/><text x="109" y="168" text-anchor="middle" font-size="20" fill="#203035" font-weight="700">Static map</text><text x="109" y="207" text-anchor="middle" font-size="16" fill="#53676d">start / goal</text><path d="M194 190 H238" stroke="#147f80" stroke-width="4"/><rect x="238" y="124" width="174" height="132" rx="12" fill="#f6f2fa" stroke="#d8d1e7"/><text x="325" y="168" text-anchor="middle" font-size="20" fill="#203035" font-weight="700">Global A*</text><text x="325" y="207" text-anchor="middle" font-size="16" fill="#53676d">static route</text><path d="M412 190 H456" stroke="#147f80" stroke-width="4"/><rect x="456" y="124" width="180" height="132" rx="12" fill="#f8f1eb" stroke="#e4d2c7"/><text x="546" y="168" text-anchor="middle" font-size="20" fill="#203035" font-weight="700">Time-expanded A*</text><text x="546" y="207" text-anchor="middle" font-size="16" fill="#53676d">space-time search</text><path d="M636 190 H680" stroke="#147f80" stroke-width="4"/><rect x="680" y="124" width="250" height="132" rx="12" fill="#edf5f5" stroke="#bcd8d5"/><text x="805" y="168" text-anchor="middle" font-size="20" fill="#203035" font-weight="700">Collision guard</text><text x="805" y="207" text-anchor="middle" font-size="16" fill="#53676d">vertex / edge swap</text><path d="M805 256 V329 H325 V256" stroke="#d06d4d" stroke-width="4" fill="none"/><text x="560" y="359" text-anchor="middle" font-size="17" fill="#d06d4d">execute one step → observe → replan</text><text x="28" y="430" font-size="15" fill="#53676d">The local planner in the runnable example is discrete space-time A*, not continuous DWA.</text></g></svg>
