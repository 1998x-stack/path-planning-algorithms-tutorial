<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">障碍改变roadmap连通结构</title><desc id="d">矩形墙阻挡左右两侧的直接边，路网通过上缘或下缘连接而非跨障碍。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="44" y="77" width="860" height="316" rx="14" fill="#edf6f0" stroke="#d5e5d9"/><rect x="443" y="157" width="111" height="166" rx="4" fill="#536767"/><text x="470" y="246" font-size="18" fill="#fff">墙</text><g stroke="#147f80" stroke-width="4" fill="none"><path d="M 130 240 L 251 167 L 371 127 L 627 131 L 760 223"/><path d="M 130 240 L 257 345 L 367 353 L 636 358 L 760 223"/></g><path d="M370 234 L644 237" stroke="#d06d4d" stroke-dasharray="10 8" stroke-width="5" fill="none"/><text x="582" y="219" font-size="16" fill="#d06d4d">跨墙边拒绝</text><circle cx="130" cy="240" r="10" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="251" cy="167" r="10" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="371" cy="127" r="10" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="627" cy="131" r="10" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="760" cy="223" r="10" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="257" cy="345" r="10" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="367" cy="353" r="10" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="636" cy="358" r="10" fill="#147f80" stroke="#fff" stroke-width="2"/><text x="46" y="435" font-size="15" fill="#53676d">绿色折线是经验证的多个局部边，而非跨越障碍的一条直线。</text></g></svg>
