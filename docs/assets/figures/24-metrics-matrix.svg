<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">可行性质量与资源是三个不同维度</title><desc id="d">三组矩形分别给成功率、路径代价与资源开销的指标，不能用一个数代替三种结果。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="32" y="54" font-size="22" fill="#203035" font-weight="700">三个指标，不同分母</text><rect x="26" y="112" width="287" height="274" rx="15" fill="#f4f8f4" stroke="#147f80" stroke-width="2"/><circle cx="68" cy="157" r="24" fill="#147f80"/><text x="68" y="164" text-anchor="middle" font-size="21" fill="white">1</text><text x="51" y="225" font-size="25" font-weight="700" fill="#203035">可行性</text><text x="51" y="286" font-size="19" fill="#147f80">成功 / 失败</text><text x="51" y="346" font-size="17" fill="#53676d">所有预定任务</text></rect><rect x="337" y="112" width="287" height="274" rx="15" fill="#f4f8f4" stroke="#7461ba" stroke-width="2"/><circle cx="379" cy="157" r="24" fill="#7461ba"/><text x="379" y="164" text-anchor="middle" font-size="21" fill="white">2</text><text x="362" y="225" font-size="25" font-weight="700" fill="#203035">解质量</text><text x="362" y="286" font-size="19" fill="#7461ba">成本 / 分位数</text><text x="362" y="346" font-size="17" fill="#53676d">仅成功任务 + N</text></rect><rect x="648" y="112" width="287" height="274" rx="15" fill="#f4f8f4" stroke="#d06d4d" stroke-width="2"/><circle cx="690" cy="157" r="24" fill="#d06d4d"/><text x="690" y="164" text-anchor="middle" font-size="21" fill="white">3</text><text x="673" y="225" font-size="25" font-weight="700" fill="#203035">资源开销</text><text x="673" y="286" font-size="19" fill="#d06d4d">时间 / 展开 / 碰撞</text><text x="673" y="346" font-size="17" fill="#53676d">包含失败的预算</text></rect><text x="31" y="433" font-size="15" fill="#53676d">报告条件成本时，一定显示成功样本数和总尝试数，避免隐藏未找到路径的运行。</text></g></svg>
