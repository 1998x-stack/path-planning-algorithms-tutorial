<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">吸引向量和多个斥力向量求和</title><desc id="desc">当前位置的吸引向量指向目标，两个障碍斥力分别指向远离障碍的方向，合力决定局部下降方向。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="36" y="77" width="888" height="314" rx="14" fill="#f3f7f3" stroke="#d7e3da"/><circle cx="175" cy="246" r="14" fill="#203035"/><circle cx="800" cy="246" r="13" fill="#147f80"/><circle cx="460" cy="130" r="40" fill="#536767"/><circle cx="480" cy="344" r="40" fill="#536767"/><path d="M175 246 L370 246" stroke="#147f80" stroke-width="6"/><path d="M175 246 L254 190" stroke="#d06d4d" stroke-width="6"/><path d="M175 246 L253 302" stroke="#d06d4d" stroke-width="6"/><path d="M175 246 L322 246" stroke="#7461ba" stroke-width="5" stroke-dasharray="9 6"/><g font-size="17" fill="#203035"><text x="72" y="284">q</text><text x="386" y="233" fill="#147f80">F_att</text><text x="264" y="174" fill="#d06d4d">F_rep,1</text><text x="265" y="326" fill="#d06d4d">F_rep,2</text><text x="340" y="270" fill="#7461ba">合力方向</text><text x="781" y="279">目标</text></g><text x="35" y="435" font-size="15" fill="#53676d">箭头仅表达力向量的方向关系，未按同一比例绘制。</text></g></svg>
