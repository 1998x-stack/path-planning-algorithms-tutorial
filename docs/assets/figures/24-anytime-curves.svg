<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Anytime规划器的最好路径成本随计算时间非递增</title><desc id="d">最初未找到路径，首个可行解后最好成本阶梯式下降，最终仍需要报告失败或超时情形。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="70" y="75" width="826" height="316" rx="11" fill="#f3f7f3" stroke="#d7e2da"/><path d="M139 338 V103 M139 338 H852" stroke="#203035" stroke-width="3" fill="none"/><path d="M276 164 H405 V222 H557 V260 H720 V299 H825" stroke="#147f80" stroke-width="6" fill="none"/><path d="M276 338 V163" stroke="#d06d4d" stroke-width="3" stroke-dasharray="9 7"/><text x="173" y="144" font-size="18" fill="#d06d4d">首条可行解</text><text x="729" y="290" font-size="18" fill="#147f80">最好成本下降</text><text x="57" y="100" font-size="17" fill="#203035">路径代价</text><text x="735" y="369" font-size="17" fill="#203035">计算预算</text><text x="35" y="434" font-size="15" fill="#53676d">无解时成本未定义；示意阶梯曲线不代表实际RRT*或其它算法的实验数据。</text></g></svg>
