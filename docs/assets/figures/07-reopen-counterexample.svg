<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">不一致启发式导致A节点需要重开的图例</title><desc id="d">S-A=2，S-B=1，B-A=0.5，A-G=2；h(B)=2合法却不一致，A节点若被永久关闭会错过3.5的路线。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="36" y="43" font-size="17" fill="#53676d">路径① S→A→G = 4；路径② S→B→A→G = 3.5</text><path d="M 119 229 L 415 118 L 825 229" fill="none" stroke="#d06d4d" stroke-width="5"/><path d="M 119 229 L 374 328 L 415 118" fill="none" stroke="#147f80" stroke-width="7"/><g font-size="18" font-weight="700"><text x="243" y="136" fill="#d06d4d">2</text><text x="615" y="137" fill="#d06d4d">2</text><text x="223" y="312" fill="#147f80">1</text><text x="355" y="223" fill="#147f80">0.5</text></g><circle cx="119" cy="229" r="30" fill="#fff" stroke="#203035" stroke-width="3"/><text x="119" y="237" text-anchor="middle" font-size="23" fill="#203035" font-weight="700">S</text><text x="87" y="282" font-size="15" fill="#53676d">h=0</text><circle cx="415" cy="118" r="30" fill="#fff" stroke="#203035" stroke-width="3"/><text x="415" y="126" text-anchor="middle" font-size="23" fill="#203035" font-weight="700">A</text><text x="383" y="171" font-size="15" fill="#53676d">h=0</text><circle cx="374" cy="328" r="30" fill="#fff" stroke="#203035" stroke-width="3"/><text x="374" y="336" text-anchor="middle" font-size="23" fill="#203035" font-weight="700">B</text><text x="342" y="381" font-size="15" fill="#53676d">h=2</text><circle cx="825" cy="229" r="30" fill="#fff" stroke="#203035" stroke-width="3"/><text x="825" y="237" text-anchor="middle" font-size="23" fill="#203035" font-weight="700">G</text><text x="793" y="282" font-size="15" fill="#53676d">h=0</text><rect x="81" y="405" width="792" height="40" rx="7" fill="#e6f4ee"/><text x="111" y="432" font-size="17" fill="#147f80">B 发现 g(A)=1.5 后，应允许 A 重新进入队列</text></g></svg>
