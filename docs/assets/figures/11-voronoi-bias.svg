<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">RRT 最近邻的 Voronoi 空间直觉</title><desc id="d">中间簇多个树节点分区小，孤立外围节点分区大，因此均匀随机样本更常选中外围点。</desc><rect width="960" height="460" rx="17" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="48" y="78" width="845" height="306" rx="11" fill="#f0f5ef" stroke="#d5e2d8"/><path d="M 220 78 L 255 380 M 390 78 L 370 380 M 540 78 L 550 380 M 730 78 L 650 380" stroke="#bccfc4" stroke-width="2" stroke-dasharray="8 7"/><path d="M 392 78 L 445 165 L 410 284 L 370 380 M 445 165 L 539 78 M 410 284 L 554 380 M 256 380 L 341 223 L 220 78" stroke="#b4c9be" stroke-width="2" fill="none"/><circle cx="122" cy="205" r="14" fill="#147f80"/><circle cx="420" cy="204" r="12" fill="#7461ba"/><circle cx="468" cy="227" r="9" fill="#7461ba"/><circle cx="446" cy="277" r="9" fill="#7461ba"/><circle cx="778" cy="203" r="14" fill="#147f80"/><text x="68" y="351" font-size="19" fill="#147f80">稀疏外围：大区域</text><text x="373" y="351" font-size="19" fill="#7461ba">密集中心：小区域</text><text x="665" y="351" font-size="19" fill="#147f80">稀疏外围：大区域</text><text x="49" y="435" font-size="14" fill="#53676d">灰线只示意“最近邻分区”，不代表精确计算的 Voronoi 边界。</text></g></svg>
