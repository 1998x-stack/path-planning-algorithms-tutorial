<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">滚动时域重规划是一个带反馈的闭环</title><desc id="desc">状态估计、障碍预测、轨迹生成、安全检查、短时执行后再次观测。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><g fill="#f2f7f3" stroke="#cbdacf" stroke-width="2"><rect x="45" y="140" width="175" height="105" rx="12"/><rect x="275" y="140" width="175" height="105" rx="12"/><rect x="505" y="140" width="175" height="105" rx="12"/><rect x="735" y="140" width="175" height="105" rx="12"/></g><g font-size="19" fill="#203035" text-anchor="middle"><text x="132" y="181">状态估计</text><text x="132" y="211">定位 / 速度</text><text x="362" y="181">障碍预测</text><text x="362" y="211">位置 / 时间</text><text x="592" y="181">轨迹规划</text><text x="592" y="211">时空碰撞</text><text x="822" y="181">短时执行</text><text x="822" y="211">控制反馈</text></g><g stroke="#147f80" stroke-width="4" fill="none"><path d="M220 192 H275 M450 192 H505 M680 192 H735"/><path d="M822 245 V330 H132 V245"/></g><path d="M268 184 l8 8 -8 8 M498 184 l8 8 -8 8 M728 184 l8 8 -8 8" stroke="#147f80" stroke-width="3" fill="none"/><text x="435" y="367" font-size="17" fill="#147f80">新观测进入下一轮</text><text x="35" y="435" font-size="15" fill="#53676d">实际系统还要携带时间戳、预测版本、延迟和安全监视状态。</text></g></svg>
