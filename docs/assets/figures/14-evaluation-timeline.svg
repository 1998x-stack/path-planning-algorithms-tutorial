<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">采样规划基准测量事件模板</title><desc id="d">PRM独立记录预处理和多次查询，RRT星记录首次解与后续优化，所有方法记录失败运行的上限。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="35" y="42" font-size="22" fill="#203035" font-weight="700">每次运行：明确起止事件和成本口径</text><g font-size="18" fill="#203035"><text x="35" y="143">PRM</text><text x="35" y="251">RRT*</text><text x="35" y="363">失败运行</text></g><g><rect x="163" y="107" width="199" height="47" rx="8" fill="#7461ba"/><rect x="362" y="107" width="169" height="47" rx="8" fill="#147f80"/><rect x="540" y="107" width="168" height="47" rx="8" fill="#147f80"/><rect x="163" y="213" width="227" height="47" rx="8" fill="#d06d4d"/><rect x="390" y="213" width="319" height="47" rx="8" fill="#147f80"/><rect x="163" y="326" width="554" height="46" rx="8" fill="#f7ebe4" stroke="#d06d4d" stroke-width="3" stroke-dasharray="10 6"/></g><g font-size="17" fill="white"><text x="196" y="138">一次建图</text><text x="388" y="138">查询 1</text><text x="556" y="138">查询 2</text><text x="205" y="244">首次解之前</text><text x="436" y="244">继续优化路线成本</text></g><text x="360" y="356" text-anchor="middle" font-size="17" fill="#d06d4d">记录完整预算与未成功状态</text><text x="35" y="430" font-size="15" fill="#53676d">各条矩形长度不代表任何真实测量比例；仅说明时间和指标的分离。</text></g></svg>
