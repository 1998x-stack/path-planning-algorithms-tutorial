<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">六个真实网格步与一条宏边的成本对照</title><desc id="d">上方六个水平相邻移动，每步权重1；下方对应的一条宏边代价为6，不能只计1。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="40" y="52" font-size="20" font-weight="700" fill="#203035">普通 A*：每次扩展一格</text><rect x="90" y="105" width="81" height="75" rx="9" fill="#e9f5ee" stroke="#b0cec1"/><text x="130" y="153" font-size="20" text-anchor="middle" fill="#203035">0</text><rect x="186" y="105" width="81" height="75" rx="9" fill="#e9f5ee" stroke="#b0cec1"/><text x="226" y="153" font-size="20" text-anchor="middle" fill="#203035">1</text><rect x="282" y="105" width="81" height="75" rx="9" fill="#e9f5ee" stroke="#b0cec1"/><text x="322" y="153" font-size="20" text-anchor="middle" fill="#203035">2</text><rect x="378" y="105" width="81" height="75" rx="9" fill="#e9f5ee" stroke="#b0cec1"/><text x="418" y="153" font-size="20" text-anchor="middle" fill="#203035">3</text><rect x="474" y="105" width="81" height="75" rx="9" fill="#e9f5ee" stroke="#b0cec1"/><text x="514" y="153" font-size="20" text-anchor="middle" fill="#203035">4</text><rect x="570" y="105" width="81" height="75" rx="9" fill="#e9f5ee" stroke="#b0cec1"/><text x="610" y="153" font-size="20" text-anchor="middle" fill="#203035">5</text><rect x="666" y="105" width="81" height="75" rx="9" fill="#e9f5ee" stroke="#b0cec1"/><text x="706" y="153" font-size="20" text-anchor="middle" fill="#203035">6</text><g font-size="17" fill="#147f80"><text x="174" y="150">+1</text><text x="270" y="150">+1</text><text x="366" y="150">+1</text><text x="462" y="150">+1</text><text x="558" y="150">+1</text><text x="654" y="150">+1</text></g><text x="40" y="280" font-size="20" font-weight="700" fill="#203035">JPS 宏边：从一个跳点到下一个跳点</text><rect x="91" y="306" width="80" height="80" rx="10" fill="#147f80"/><text x="131" y="358" font-size="27" text-anchor="middle" fill="white">P</t