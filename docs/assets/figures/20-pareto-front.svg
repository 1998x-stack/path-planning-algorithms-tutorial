<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">非支配路线形成Pareto前沿</title><desc id="desc">长度和风险都最小化时，前沿上的点互不支配；右上方的候选点被其它点支配。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><path d="M110 370 V90 M110 370 H870" stroke="#203035" stroke-width="3"/><path d="M220 130 Q350 180 470 230 T790 330" fill="none" stroke="#147f80" stroke-width="3" stroke-dasharray="8 7"/><g fill="#147f80"><circle cx="220" cy="130" r="11"/><circle cx="350" cy="177" r="11"/><circle cx="500" cy="230" r="11"/><circle cx="665" cy="282" r="11"/></g><circle cx="710" cy="140" r="12" fill="#d06d4d"/><g font-size="18" fill="#203035"><text x="800" y="394">长度</text><text x="48" y="92">风险</text><text x="215" y="108">A</text><text x="345" y="155">B</text><text x="495" y="207">C</text><text x="672" y="262">D</text><text x="731" y="133" fill="#d06d4d">被支配</text></g><text x="35" y="435" font-size="15" fill="#53676d">示意坐标为构造值；两个目标均越小越好，非支配前沿向右下延伸。</text></g></svg>
