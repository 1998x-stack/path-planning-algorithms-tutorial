<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="pf-t pf-d"><title id="pf-t">势场俯视图：引力井、斥力丘与梯度下降路径</title><desc id="pf-d">左图用同心圆表示势的高低，目标处为低谷、障碍处为高丘，机器人沿合力方向移动；右图显示一条绕开孤立障碍、沿势场下降方向抵达目标的路径。</desc><rect width="960" height="420" rx="18" fill="#fffdf9"/><defs><marker id="pf-ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#203035"/></marker></defs><g font-family="Arial,PingFang SC,sans-serif"><text x="34" y="44" font-size="20" fill="#203035" font-weight="700">势的高低（俯视）</text><text x="520" y="44" font-size="20" fill="#203035" font-weight="700">梯度下降路径</text><rect x="34" y="62" width="420" height="320" rx="12" fill="#eef4f0"/><g fill="none" stroke="#147f80" stroke-width="1.6"><circle cx="250" cy="230" r="30"/><circle cx="250" cy="230" r="60"/><circle cx="250" cy="230" r="90"/><circle cx="250" cy="230" r="120"/></g><circle cx="250" cy="230" r="8" fill="#147f80"/><text x="258" y="222" font-size="15" fill="#147f80">目标（谷底）</text><g fill="none" stroke="#d06d4d" stroke-width="1.6"><circle cx="140" cy="130" r="22"/><circle cx="140" cy="130" r="48"/><circle cx="140" cy="130" r="74"/></g><circle cx="140" cy="130" r="7" fill="#d06d4d"/><text x="150" y="120" font-size="15" fill="#d06d4d">障碍（高丘）</text><circle cx="140" cy="330" r="10" fill="#203035"/><text x="60" y="366" font-size="15" fill="#203035">机器人</text><line x1="150" y1="324" x2="232" y2="248" stroke="#203035" stroke-width="3" marker-end="url(#pf-ah)"/><rect x="520" y="62" width="406" height="320" rx="12" fill="#eef4f0"/><g fill="none" stroke="#d06d4d" stroke-width="1.6"><circle cx="720" cy="220" r="26"/><circle cx="720" cy="220" r="52"/><circle cx="720" cy="220" r="78"/></g><circle cx="720" cy="220" r="9" fill="#d06d4d"/><text x="732" y="212" font-size="14" fill="#d06d4d">障碍</text><polyline points="556,344 624,312 672,258 748,196 812,150 876,104" fill="none" stroke="#147f80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="556" cy="344" r="9" fill="#203035"/><circle cx="876" cy="104" r="9" fill="#7461ba"/><text x="884" y="96" font-size="14" fill="#7461ba">目标</text><text x="530" y="372" font-size="14" fill="#53676d">只绕过一个孤立障碍时，梯度下降通常能顺利抵达。</text></g></svg>
