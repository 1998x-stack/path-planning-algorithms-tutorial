<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">ROS2 Nav2导航闭环及独立安全层</title><desc id="d">传感器和TF进入costmap，规划器产生路线，控制器产生速度命令，硬件执行并反馈，安全监测并行控制。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><g font-size="18" fill="#203035"><rect x="24" y="127" width="160" height="99" rx="10" fill="#f0f7f1" stroke="#cdded2"/><text x="104" y="172" text-anchor="middle" font-weight="700">Sensors / TF</text><text x="104" y="201" text-anchor="middle" font-size="14" fill="#53676d">pose / scan</text><rect x="212" y="127" width="160" height="99" rx="10" fill="#f6f2fa" stroke="#d9d0e6"/><text x="292" y="172" text-anchor="middle" font-weight="700">Costmap</text><text x="292" y="201" text-anchor="middle" font-size="14" fill="#53676d">obstacle</text><rect x="400" y="127" width="160" height="99" rx="10" fill="#f0f7f1" stroke="#cdded2"/><text x="480" y="172" text-anchor="middle" font-weight="700">Planner</text><text x="480" y="201" text-anchor="middle" font-size="14" fill="#53676d">path</text><rect x="588" y="127" width="160" height="99" rx="10" fill="#f6f2fa" stroke="#d9d0e6"/><text x="668" y="172" text-anchor="middle" font-weight="700">Controller</text><text x="668" y="201" text-anchor="middle" font-size="14" fill="#53676d">cmd_vel</text><rect x="776" y="127" width="160" height="99" rx="10" fill="#f0f7f1" stroke="#cdded2"/><text x="856" y="172" text-anchor="middle" font-weight="700">Base driver</text><text x="856" y="201" text-anchor="middle" font-size="14" fill="#53676d">odometry</text></g><g stroke="#147f80" stroke-width="4"><path d="M184 178 H211 M372 178 H400 M560 178 H588 M748 178 H776"/></g><path d="M857 225 V333 H102 V225" stroke="#7461ba" stroke-width="4" fill="none"/><text x="327" y="351" font-size="18" fill="#7461ba">执行反馈 / 里程计 / TF</text><rect x="310" y="40" width="342" height="62" rx="10" fill="#fbeee8" stroke="#d06d4d" stroke-width="2"/><text x="481" y="78" font-size="19" text-anchor="middle" fill="#d06d4d">独立安全监测 / 停止链</text><path d="M481 102 V126" stroke="#d06d4d" stroke-width="4" stroke-dasharray="7 6"/><text x="36" y="432" font-size="15" fill="#53676d">并行软件监测不等于认证硬件急停；控制链必须按实际设备架构进行安全评估。</text></g></svg>
