<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">两机器人独立最短路在t=1发生同格顶点冲突</title><desc id="d">三个时间片分别展示A向右B向左，t=1时同格的中点不能由两者同时占据。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="32" y="48" font-size="22" font-weight="700" fill="#203035">分别最短 ≠ 联合可行</text><rect x="50" y="144" width="270" height="184" rx="10" fill="#f1f6f2" stroke="#d5e3da"/><text x="62" y="127" font-size="19" fill="#203035">t = 0</text><rect x="71" y="164" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="153" y="164" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="235" y="164" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="71" y="234" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="153" y="234" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="235" y="234" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><circle cx="109" cy="196" r="20" fill="#147f80"/><text x="109" y="202" fill="#fff" text-anchor="middle" font-size="18">A</text><circle cx="273" cy="196" r="20" fill="#7461ba"/><text x="273" y="202" fill="#fff" text-anchor="middle" font-size="18">B</text></rect><rect x="365" y="144" width="270" height="184" rx="10" fill="#f1f6f2" stroke="#d5e3da"/><text x="377" y="127" font-size="19" fill="#203035">t = 1</text><rect x="386" y="164" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="468" y="164" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="550" y="164" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="386" y="234" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="468" y="234" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="550" y="234" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><circle cx="506" cy="196" r="24" fill="#d06d4d"/><text x="506" y="203" fill="#fff" text-anchor="middle" font-size="17">A+B</text><text x="447" y="325" font-size="15" fill="#d06d4d">顶点冲突！</text></rect><rect x="680" y="144" width="270" height="184" rx="10" fill="#f1f6f2" stroke="#d5e3da"/><text x="692" y="127" font-size="19" fill="#203035">t = 2</text><rect x="701" y="164" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="783" y="164" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="865" y="164" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="701" y="234" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="783" y="234" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><rect x="865" y="234" width="77" height="64" rx="5" fill="#fff" stroke="#cad5ce"/><circle cx="903" cy="196" r="20" fill="#147f80"/><text x="903" y="202" fill="#fff" text-anchor="middle" font-size="18">A</text><circle cx="739" cy="196" r="20" fill="#7461ba"/><text x="739" y="202" fill="#fff" text-anchor="middle" font-size="18">B</text></rect><text x="38" y="420" font-size="16" fill="#53676d">两台机器人均允许等待，但独立最短路线都未选择等待或绕行。</text></g></svg>
