<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="rh-t rh-d"><title id="rh-t">滚动窗口规划的时间结构</title><desc id="rh-d">横轴为时间。每个周期规划一段长度为 H 的窗口，但只执行其中最前面的 Δ 段，随后从当前位置重新规划；下一个窗口与上一个重叠。一个环境变化事件在某个时刻触发紧急重规划。</desc><rect width="900" height="340" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="80" y="150" width="300" height="30" rx="6" fill="#dfeee9"/><rect x="170" y="150" width="300" height="30" rx="6" fill="#dfeee9"/><rect x="260" y="150" width="300" height="30" rx="6" fill="#dfeee9"/><rect x="350" y="150" width="300" height="30" rx="6" fill="#dfeee9"/><rect x="80" y="112" width="90" height="24" rx="6" fill="#147f80"/><rect x="170" y="112" width="90" height="24" rx="6" fill="#147f80"/><rect x="260" y="112" width="90" height="24" rx="6" fill="#147f80"/><rect x="350" y="112" width="90" height="24" rx="6" fill="#147f80"/><line x1="170" y1="100" x2="170" y2="290" stroke="#7461ba" stroke-width="2" stroke-dasharray="6 5"/><line x1="260" y1="100" x2="260" y2="290" stroke="#7461ba" stroke-width="2" stroke-dasharray="6 5"/><line x1="350" y1="100" x2="350" y2="290" stroke="#7461ba" stroke-width="2" stroke-dasharray="6 5"/><line x1="440" y1="100" x2="440" y2="290" stroke="#7461ba" stroke-width="2" stroke-dasharray="6 5"/><line x1="60" y1="270" x2="860" y2="270" stroke="#53676d" stroke-width="2"/><polygon points="860,270 850,265 850,275" fill="#53676d"/><text x="820" y="300" font-size="15" fill="#53676d">时间 →</text><circle cx="80" cy="270" r="6" fill="#203035"/><text x="80" y="258" font-size="13" fill="#203035" text-anchor="middle">现在</text><polygon points="260,64 250,84 270,84" fill="#d06d4d"/><text x="260" y="54" font-size="14" fill="#a5482c" text-anchor="middle">环境变化 → 紧急重规划</text><text x="96" y="129" font-size="13" fill="#ffffff">执行 Δ</text><text x="96" y="170" font-size="13" fill="#203035">规划窗口 H</text><text x="176" y="300" font-size="13" fill="#7461ba">t₁ 重新规划</text><text x="266" y="318" font-size="13" fill="#7461ba">t₂ 重新规划</text></g></svg>
