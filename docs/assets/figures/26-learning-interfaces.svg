<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">学习模块进入规划栈的不同接口</title><desc id="svg-desc">感知代价、搜索引导、策略动作、轨迹生成和动力学预测是不同的学习输出接口，均由经典几何验证环节连接。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,'PingFang SC',sans-serif"><text x="30" y="48" font-size="22" fill="#203035" font-weight="700">Where does learning enter?</text><rect x="32" y="146" width="150" height="118" rx="12" fill="#eef5ef" stroke="#cbdacf"/><text x="107" y="192" font-size="21" text-anchor="middle" fill="#203035">Sensors</text><text x="107" y="226" font-size="16" text-anchor="middle" fill="#53676d">map / state</text><path d="M182 205 H222" stroke="#147f80" stroke-width="4"/><rect x="222" y="84" width="190" height="240" rx="12" fill="#f7f2eb" stroke="#dfd4c4"/><text x="317" y="119" font-size="19" text-anchor="middle" fill="#203035" font-weight="700">Learned modules</text><rect x="244" y="128" width="146" height="31" rx="7" fill="#fff" stroke="#d8c9b7"/><text x="317" y="149" text-anchor="middle" font-size="15" fill="#53676d">Perception</text><rect x="244" y="170" width="146" height="31" rx="7" fill="#fff" stroke="#d8c9b7"/><text x="317" y="191" text-anchor="middle" font-size="15" fill="#53676d">Cost / heuristic</text><rect x="244" y="212" width="146" height="31" rx="7" fill="#fff" stroke="#d8c9b7"/><text x="317" y="233" text-anchor="middle" font-size="15" fill="#53676d">Policy / action</text><rect x="244" y="254" width="146" height="31" rx="7" fill="#fff" stroke="#d8c9b7"/><text x="317" y="275" text-anchor="middle" font-size="15" fill="#53676d">Trajectory</text><path d="M412 205 H463" stroke="#d06d4d" stroke-width="4"/><rect x="463" y="133" width="190" height="145" rx="12" fill="#f2eff8" stroke="#d8d1e7"/><text x="558" y="178" text-anchor="middle" font-size="20" fill="#203035" font-weight="700">Classical planner</text><text x="558" y="213" text-anchor="middle" font-size="16" fill="#53676d">search / constraints</text><text x="558" y="246" text-anchor="middle" font-size="16" fill="#53676d">collision / dynamics</text><path d="M653 205 H704" stroke="#147f80" stroke-width="4"/><rect x="704" y="146" width="222" height="118" rx="12" fill="#edf5f5" stroke="#bcd8d5"/><text x="815" y="192" text-anchor="middle" font-size="20" fill="#203035">Executable route</text><text x="815" y="226" text-anchor="middle" font-size="16" fill="#53676d">verified command</text><text x="32" y="403" font-size="16" fill="#53676d">The interface determines the proof obligations downstream.</text></g></svg>
