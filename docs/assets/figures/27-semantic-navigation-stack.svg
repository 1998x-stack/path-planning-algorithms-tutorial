<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">语义导航从自然语言到可执行轨迹的系统层次</title><desc id="svg-desc">语义理解把语言指令定位成地图目标区域，几何规划器输出可行路线，控制器执行并由安全层监测。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,'PingFang SC',sans-serif"><rect x="25" y="127" width="164" height="142" rx="12" fill="#f6f2fa" stroke="#d8d1e7"/><text x="107" y="169" text-anchor="middle" font-size="20" fill="#203035" font-weight="700">Instruction</text><text x="107" y="209" text-anchor="middle" font-size="16" fill="#53676d">“blue chair”</text><path d="M189 198 H235" stroke="#7461ba" stroke-width="4"/><rect x="235" y="127" width="174" height="142" rx="12" fill="#eef6f1" stroke="#cbdacf"/><text x="322" y="169" text-anchor="middle" font-size="20" fill="#203035" font-weight="700">VLM / VLA</text><text x="322" y="209" text-anchor="middle" font-size="16" fill="#53676d">object / relation</text><path d="M409 198 H455" stroke="#147f80" stroke-width="4"/><rect x="455" y="127" width="174" height="142" rx="12" fill="#f8f1eb" stroke="#e4d2c7"/><text x="542" y="169" text-anchor="middle" font-size="20" fill="#203035" font-weight="700">Grounding</text><text x="542" y="209" text-anchor="middle" font-size="16" fill="#53676d">map frame + σ</text><path d="M629 198 H675" stroke="#147f80" stroke-width="4"/><rect x="675" y="127" width="255" height="142" rx="12" fill="#edf5f5" stroke="#bcd8d5"/><text x="802" y="169" text-anchor="middle" font-size="20" fill="#203035" font-weight="700">Metric planner</text><text x="802" y="209" text-anchor="middle" font-size="16" fill="#53676d">path / trajectory</text><path d="M802 269 V333" stroke="#d06d4d" stroke-width="4"/><rect x="675" y="333" width="255" height="74" rx="12" fill="#f8eee8" stroke="#e2cfc3"/><text x="802" y="379" text-anchor="middle" font-size="19" fill="#203035">Control + safety monitor</text><text x="30" y="439" font-size="15" fill="#53676d">The semantic target must carry a coordinate frame and uncertainty into metric planning.</text></g></svg>
