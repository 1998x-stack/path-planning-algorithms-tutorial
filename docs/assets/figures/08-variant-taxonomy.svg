<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">四种 A星改进方法的变量对照</title><desc id="d">四个模块分别强调加权启发、双向搜索、ARA修复和分层抽象，不能混淆对应保证。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="25" y="94" width="214" height="297" rx="13" fill="#e9f3ed" stroke="#cbdbcf"/><circle cx="61" cy="131" r="23" fill="#147f80"/><text x="61" y="138" font-size="20" text-anchor="middle" fill="white">1</text><text x="44" y="210" font-size="28" font-weight="700" fill="#203035">权重</text><text x="44" y="267" font-size="17" fill="#53676d">修改 f=g+εh</text><text x="44" y="329" font-size="21" font-weight="700" fill="#203035">WA*</text></rect><rect x="259" y="94" width="214" height="297" rx="13" fill="#f3f0f8" stroke="#cbdbcf"/><circle cx="295" cy="131" r="23" fill="#7461ba"/><text x="295" y="138" font-size="20" text-anchor="middle" fill="white">2</text><text x="278" y="210" font-size="28" font-weight="700" fill="#203035">方向</text><text x="278" y="267" font-size="17" fill="#53676d">搜索起点与目标</text><text x="278" y="329" font-size="21" font-weight="700" fill="#203035">双向 A*</text></rect><rect x="493" y="94" width="214" height="297" rx="13" fill="#e9f3ed" stroke="#cbdbcf"/><circle cx="529" cy="131" r="23" fill="#147f80"/><text x="529" y="138" font-size="20" text-anchor="middle" fill="white">3</text><text x="512" y="210" font-size="28" font-weight="700" fill="#203035">时间</text><text x="512" y="267" font-size="17" fill="#53676d">修复旧的 OPEN</text><text x="512" y="329" font-size="21" font-weight="700" fill="#203035">ARA*</text></rect><rect x="727" y="94" width="214" height="297" rx="13" fill="#f3f0f8" stroke="#cbdbcf"/><circle cx="763" cy="131" r="23" fill="#7461ba"/><text x="763" y="138" font-size="20" text-anchor="middle" fill="white">4</text><text x="746" y="210" font-size="28" font-weight="700" fill="#203035">空间</text><text x="746" y="267" font-size="17" fill="#53676d">粗图与细图</text><text x="746" y="329" font-size="21" font-weight="700" fill="#203035">分层 A*</text></rect><text x="31" y="435" font-size="15" fill="#53676d">分别优化排序方式、搜索方向、计算过程或状态表示；需要各自证明前提。</text></g></svg>
