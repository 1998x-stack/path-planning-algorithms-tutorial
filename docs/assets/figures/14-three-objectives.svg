<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">采样规划的三个不可合并的评价目标</title><desc id="d">三块分别标示成功率与失败、路径代价与首次可行解、计算预算与碰撞调用，强调不可拿其中一项替代其余目标。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="29" y="98" width="282" height="278" rx="14" fill="#f4f8f5" stroke="#147f80" stroke-width="2"/><circle cx="68" cy="142" r="25" fill="#147f80"/><text x="68" y="149" font-size="21" fill="white" text-anchor="middle">1</text><text x="54" y="222" font-size="26" fill="#203035" font-weight="700">可行性</text><text x="54" y="283" font-size="19" fill="#147f80">成功 / 失败</text><text x="54" y="340" font-size="15" fill="#53676d">搜索是否找到合法路线</text><rect x="339" y="98" width="282" height="278" rx="14" fill="#f4f8f5" stroke="#d06d4d" stroke-width="2"/><circle cx="378" cy="142" r="25" fill="#d06d4d"/><text x="378" y="149" font-size="21" fill="white" text-anchor="middle">2</text><text x="364" y="222" font-size="26" fill="#203035" font-weight="700">解质量</text><text x="364" y="283" font-size="19" fill="#d06d4d">成本 / 路径长度</text><text x="364" y="340" font-size="15" fill="#53676d">解越短不一定越安全</text><rect x="649" y="98" width="282" height="278" rx="14" fill="#f4f8f5" stroke="#7461ba" stroke-width="2"/><circle cx="688" cy="142" r="25" fill="#7461ba"/><text x="688" y="149" font-size="21" fill="white" text-anchor="middle">3</text><text x="674" y="222" font-size="26" fill="#203035" font-weight="700">计算资源</text><text x="674" y="283" font-size="19" fill="#7461ba">预算 / 首解时间</text><text x="674" y="340" font-size="15" fill="#53676d">计入碰撞与预处理</text><text x="33" y="424" font-size="15" fill="#53676d">同一任务中，路径失败、资源开销和解质量必须联合报告。</text></g></svg>
