<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">综合项目从单测到实车逐级放行</title><desc id="svg-desc">单元测试、动态冲突、闭环仿真、基准复现、硬件在环和现场安全评审逐级建立证据。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,'PingFang SC',sans-serif"><text x="32" y="49" font-size="22" fill="#203035" font-weight="700">Release gates / evidence, not optimism</text><rect x="22" y="152" width="139" height="160" rx="12" fill="#eef6f1" stroke="#cbdacf"/><text x="40" y="190" font-size="18" fill="#147f80" font-weight="700">01</text><text x="91" y="250" text-anchor="middle" font-size="18" fill="#203035">单元测试</text><path d="M91 312 V347" stroke="#53676d" stroke-width="2"/><rect x="177" y="152" width="139" height="160" rx="12" fill="#eef6f1" stroke="#cbdacf"/><text x="195" y="190" font-size="18" fill="#147f80" font-weight="700">02</text><text x="246" y="250" text-anchor="middle" font-size="18" fill="#203035">冲突测试</text><path d="M246 312 V347" stroke="#53676d" stroke-width="2"/><rect x="332" y="152" width="139" height="160" rx="12" fill="#eef6f1" stroke="#cbdacf"/><text x="350" y="190" font-size="18" fill="#147f80" font-weight="700">03</text><text x="401" y="250" text-anchor="middle" font-size="18" fill="#203035">闭环仿真</text><path d="M401 312 V347" stroke="#53676d" stroke-width="2"/><rect x="487" y="152" width="139" height="160" rx="12" fill="#eef6f1" stroke="#cbdacf"/><text x="505" y="190" font-size="18" fill="#147f80" font-weight="700">04</text><text x="556" y="250" text-anchor="middle" font-size="18" fill="#203035">基准复现</text><path d="M556 312 V347" stroke="#53676d" stroke-width="2"/><rect x="642" y="152" width="139" height="160" rx="12" fill="#f6f2fa" stroke="#cbdacf"/><text x="660" y="190" font-size="18" fill="#147f80" font-weight="700">05</text><text x="711" y="250" text-anchor="middle" font-size="18" fill="#203035">硬件在环</text><path d="M711 312 V347" stroke="#53676d" stroke-width="2"/><rect x="797" y="152" width="139" height="160" rx="12" fill="#f8eee8" stroke="#d06d4d"/><text x="815" y="190" font-size="18" fill="#147f80" font-weight="700">06</text><text x="866" y="250" text-anchor="middle" font-size="18" fill="#203035">现场评审</text><path d="M866 312 V347" stroke="#53676d" stroke-width="2"/><text x="32" y="400" font-size="17" fill="#53676d">Failure at any gate pauses expansion and returns to diagnosis.</text><text x="32" y="433" font-size="15" fill="#53676d">Software checks do not replace a hardware safety case or a supervised field test.</text></g></svg>
