<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">D星Lite中g与rhs一致性</title><desc id="d">显示目标G初始反向传播到A和S，并在边权变化后标示A的rhs与g不再相等。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="35" y="44" font-size="18" fill="#53676d">存储的 g 是过去计算的估计；rhs 是从后继重新得到的一步前瞻</text><rect x="77" y="101" width="220" height="275" rx="15" fill="#edf5ef" stroke="#147f80" stroke-width="2"/><circle cx="117" cy="149" r="25" fill="#147f80"/><text x="117" y="157" text-anchor="middle" font-size="24" fill="white">G</text><text x="100" y="235" font-size="22" fill="#203035">g=0</text><text x="100" y="289" font-size="22" fill="#203035">rhs=0</text></rect><rect x="372" y="101" width="220" height="275" rx="15" fill="#fff0e8" stroke="#d06d4d" stroke-width="2"/><circle cx="412" cy="149" r="25" fill="#d06d4d"/><text x="412" y="157" text-anchor="middle" font-size="24" fill="white">A</text><text x="395" y="235" font-size="22" fill="#203035">g=1</text><text x="395" y="289" font-size="22" fill="#203035">rhs=3</text></rect><rect x="666" y="101" width="220" height="275" rx="15" fill="#edf5ef" stroke="#7461ba" stroke-width="2"/><circle cx="706" cy="149" r="25" fill="#7461ba"/><text x="706" y="157" text-anchor="middle" font-size="24" fill="white">S</text><text x="689" y="235" font-size="22" fill="#203035">g=2</text><text x="689" y="289" font-size="22" fill="#203035">rhs? → 4</text></rect><path d="M 301 243 H 356 m-10 -8 l10 8 -10 8 M 598 243 H 652 m-10 -8 l10 8 -10 8" stroke="#7461ba" stroke-width="4" fill="none"/><text x="30" y="432" font-size="15" fill="#53676d">标签仅演示发生变化后的传播逻辑，最终 g/rhs 数值应由算法修复循环重新计算。</text></g></svg>
