<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">曲率上限对应最小转弯半径</title><desc id="desc">大半径圆弧曲率较小，小半径圆弧曲率较大；车辆不能超过其转向机构允许的曲率。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="38" y="80" width="884" height="306" rx="14" fill="#f3f7f3" stroke="#d7e3da"/><path d="M105 350 A260 260 0 0 1 625 350" fill="none" stroke="#147f80" stroke-width="6"/><path d="M380 350 A115 115 0 0 1 610 350" fill="none" stroke="#d06d4d" stroke-width="6"/><path d="M380 350 V235 M380 350 H495" stroke="#53676d" stroke-width="2" stroke-dasharray="6 6"/><text x="160" y="150" font-size="19" fill="#147f80">R 较大，|κ| 较小</text><text x="600" y="215" font-size="19" fill="#d06d4d">R 较小</text><text x="505" y="374" font-size="18" fill="#203035">R_min</text><text x="35" y="435" font-size="15" fill="#53676d">曲率 κ=1/R；车辆最大转向角给出可达到的最小半径。</text></g></svg>
