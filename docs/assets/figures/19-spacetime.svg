<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" role="img" aria-labelledby="st-t st-d"><title id="st-t">时空图：障碍随时间移动，路径在时间轴上绕开</title><desc id="st-d">横轴是位置 x，纵轴是时间 t。一个障碍块随 t 增大而向右移动，构成一条阶梯状的阻塞带。青绿色路径在每一时刻都位于障碍左侧或已越过它，因此在时空上没有交点。</desc><rect width="620" height="520" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><path d="M100 70V454M164 70V454M228 70V454M292 70V454M356 70V454M420 70V454M484 70V454M100 70H484M100 134H484M100 198H484M100 262H484M100 326H484M100 390H484M100 454H484" fill="none" stroke="#d8e0dc" stroke-width="1"/><rect x="164" y="326" width="64" height="64" fill="#f0d3c9" stroke="#d06d4d" stroke-width="2"/><rect x="228" y="262" width="64" height="64" fill="#f0d3c9" stroke="#d06d4d" stroke-width="2"/><rect x="292" y="198" width="64" height="64" fill="#f0d3c9" stroke="#d06d4d" stroke-width="2"/><rect x="356" y="134" width="64" height="64" fill="#f0d3c9" stroke="#d06d4d" stroke-width="2"/><text x="196" y="364" font-size="18" fill="#a5482c" text-anchor="middle">×</text><text x="260" y="300" font-size="18" fill="#a5482c" text-anchor="middle">×</text><text x="324" y="236" font-size="18" fill="#a5482c" text-anchor="middle">×</text><text x="388" y="172" font-size="18" fill="#a5482c" text-anchor="middle">×</text><polyline points="132,422 196,422 260,422 260,358 324,358 324,294 388,294 388,230 452,230 452,166 452,102" fill="none" stroke="#147f80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="132" cy="422" r="7" fill="#203035"/><circle cx="452" cy="102" r="7" fill="#7461ba"/><text x="132" y="446" font-size="14" fill="#203035" text-anchor="middle">起点</text><text x="452" y="88" font-size="14" fill="#7461ba" text-anchor="middle">目标</text><text x="292" y="490" font-size="15" fill="#53676d" text-anchor="middle">位置 x →</text><text x="66" y="266" font-size="15" fill="#53676d" text-anchor="middle" transform="rotate(-90 66 266)">时间 t ↑</text><text x="360" y="360" font-size="14" fill="#a5482c">障碍随 t 右移</text><text x="110" y="54" font-size="14" fill="#53676d">每个方格 = 一个 (x, t) 状态；× 为该时刻不可通行</text></g></svg>
