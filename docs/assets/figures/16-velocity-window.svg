<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">DWA速度空间中的静态、动态和安全可行集合</title><desc id="desc">外框为硬件速度范围，内部矩形为当前速度可达窗口，曲线边界之外的高风险速度被排除。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="35" y="45" font-size="22" font-weight="700" fill="#203035">候选控制不是整个速度平面</text><rect x="126" y="83" width="690" height="310" rx="8" fill="#f3f6f2" stroke="#53676d" stroke-width="3"/><text x="145" y="112" font-size="17" fill="#53676d">静态速度限制 Vₛ</text><rect x="300" y="144" width="360" height="205" rx="5" fill="#e1e9f0" stroke="#7461ba" stroke-width="3"/><text x="317" y="174" font-size="17" fill="#7461ba">动态可达 Vd</text><path d="M302 345 Q 410 240 490 250 T 659 165 L659 349 Z" fill="#d7eee5" opacity=".95"/><path d="M302 345 Q 410 240 490 250 T 659 165" fill="none" stroke="#147f80" stroke-width="4"/><text x="385" y="304" font-size="18" fill="#147f80">可安全停止</text><text x="678" y="218" font-size="18" fill="#d06d4d">制动不足</text><path d="M480 390 V74 M116 246 H838" stroke="#203035" stroke-width="2"/><text x="842" y="251" font-size="19" fill="#203035">v</text><text x="490" y="70" font-size="19" fill="#203035">ω</text><text x="36" y="435" font-size="15" fill="#53676d">形状仅为概念示意；实际动态窗口由速度、加速度和采样周期计算。</text></g></svg>
