ht="72" rx="10" fill="#fae9df" stroke="#d06d4d" stroke-width="2"/><text x="624" y="281" text-anchor="middle" font-size="20" fill="#d06d4d">FAIL</text></rect><rect x="719" y="236" width="132" height="72" rx="10" fill="#fae9df" stroke="#d06d4d" stroke-width="2"/><text x="785" y="281" text-anchor="middle" font-size="20" fill="#d06d4d">FAIL</text></rect><text x="89" y="391" font-size="21" fill="#d06d4d">错误：6/6 = 100%</text><text x="554" y="391" font-size="21" fill="#147f80">正确：6/10 = 60%</text><text x="38" y="437" font-size="15" fill="#53676d">第24章 Python 微型对照实际产生6个成功、4个无法到达目标的实例。</text></g></svg>
