<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">相同地图种子成对输入Dijkstra和A星</title><desc id="d">同一组输入地图和起终点分别给两个算法，测量结果按seed对齐存储。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="31" y="93" width="263" height="264" rx="13" fill="#f1f7f3" stroke="#cbdacf"/><text x="49" y="131" font-size="22" font-weight="700" fill="#203035">共同测试集</text><g font-size="19" fill="#53676d"><text x="57" y="185">地图 10</text><text x="57" y="221">地图 11</text><text x="57" y="257">… 地图 19</text><text x="57" y="311">同一预算 &amp; 代价定义</text></g><path d="M294 217 H395 V154 H485 M395 217 V302 H485" stroke="#147f80" stroke-width="4" fill="none"/><rect x="486" y="116" width="200" height="79" rx="10" fill="#f1f7f3" stroke="#147f80"/><rect x="486" y="267" width="200" height="79" rx="10" fill="#f6f2fa" stroke="#7461ba"/><text x="515" y="164" font-size="22" fill="#203035">Dijkstra</text><text x="543" y="315" font-size="22" fill="#203035">A*</text><path d="M687 154 H747 V217 H787 M687 306 H747 V217" stroke="#53676d" stroke-width="3" fill="none"/><rect x="786" y="173" width="144" height="90" rx="10" fill="#f7ebe4" stroke="#d06d4d"/><text x="805" y="210" font-size="18" fill="#203035">配对记录</text><text x="805" y="241" font-size="16" fill="#53676d">成功/成本/开销</text><text x="33" y="435" font-size="15" fill="#53676d">左侧同一组实例复制给所有被比较方法；不能单独挑选各算法最容易的地图。</text></g></svg>
