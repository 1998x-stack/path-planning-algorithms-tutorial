<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">全向运动与非完整运动对照</title><desc id="d">左边允许直接侧向平移；右边独轮车模型必须先改变朝向或沿允许方向行驶。</desc><rect width="960" height="470" rx="16" fill="#fffdf9"/><g font-family="Arial, PingFang SC, sans-serif"><text x="41" y="49" font-size="22" font-weight="700" fill="#203035">全向移动</text><text x="506" y="49" font-size="22" font-weight="700" fill="#203035">非完整约束：独轮车</text><rect x="39" y="86" width="405" height="302" rx="14" fill="#eef7f2" stroke="#bfd5c8"/><rect x="505" y="86" width="405" height="302" rx="14" fill="#eef7f2" stroke="#bfd5c8"/><rect x="205" y="263" width="66" height="44" rx="5" fill="#a1d9ce" stroke="#147f80" stroke-width="3"/><rect x="661" y="263" width="66" height="44" rx="5" fill="#a1d9ce" stroke="#147f80" stroke-width="3"/><path d="M 238 267 V 207" stroke="#147f80" stroke-width="5"/><path d="M 229 219 L 238 205 L 247 219" fill="none" stroke="#147f80" stroke-width="4"/><path d="M 272 286 H 350" stroke="#147f80" stroke-width="5"/><path d="M 340 276 L 354 286 L 340 296" fill="none" stroke="#147f80" stroke-width="4"/><path d="M 693 263 V 194" stroke="#d06d4d" stroke-width="4" stroke-dasharray="7 6"/><path d="M 686 199 L 693 185 L 700 199" fill="none" stroke="#d06d4d" stroke-width="3"/><path d="M 729 280 C 769 275 795 232 796 176" fill="none" stroke="#147f80" stroke-width="5"/><path d="M 786 189 L 796 176 L 806 190" fill="none" stroke="#147f80" stroke-width="4"/><g font-size="16" fill="#203035"><text x="93" y="182">可直接侧移</text><text x="723" y="143">不可直接侧移</text><text x="730" y="337">需转向的可行轨迹</text><text x="100" y="341">朝向不变也可向上/向右</text></g><g font-size="14" fill="#53676d"><text x="41" y="433">示意全向速度空间的两个独立平移方向</text><text x="509" y="433">示意 x˙=v cosθ，y˙=v sinθ（虚线：不允许的瞬时侧移）</text></g></g></svg>
