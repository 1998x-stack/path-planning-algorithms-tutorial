<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">GPU并行优化同时评估多个候选初始轨迹</title><desc id="svg-desc">多个轨迹初始化并行经过优化方向更新和碰撞距离评估，再筛选出可行候选，强调计算并行而非算法安全保证。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,'PingFang SC',sans-serif"><text x="32" y="49" font-size="22" fill="#203035" font-weight="700">Parallel candidate optimization</text><rect x="32" y="102" width="190" height="52" rx="8" fill="#f6f2fa" stroke="#d8d1e7"/><text x="127" y="134" text-anchor="middle" font-size="17" fill="#203035">Seed 1</text><path d="M222 128 H296" stroke="#147f80" stroke-width="3"/><rect x="296" y="102" width="198" height="52" rx="8" fill="#eef6f1" stroke="#cbdacf"/><text x="395" y="134" text-anchor="middle" font-size="16" fill="#203035">Optimize + collision</text><path d="M494 128 H566" stroke="#147f80" stroke-width="3"/><rect x="32" y="178" width="190" height="52" rx="8" fill="#f6f2fa" stroke="#d8d1e7"/><text x="127" y="210" text-anchor="middle" font-size="17" fill="#203035">Seed 2</text><path d="M222 204 H296" stroke="#147f80" stroke-width="3"/><rect x="296" y="178" width="198" height="52" rx="8" fill="#eef6f1" stroke="#cbdacf"/><text x="395" y="210" text-anchor="middle" font-size="16" fill="#203035">Optimize + collision</text><path d="M494 204 H566" stroke="#147f80" stroke-width="3"/><rect x="32" y="254" width="190" height="52" rx="8" fill="#f6f2fa" stroke="#d8d1e7"/><text x="127" y="286" text-anchor="middle" font-size="17" fill="#203035">Seed 3</text><path d="M222 280 H296" stroke="#147f80" stroke-width="3"/><rect x="296" y="254" width="198" height="52" rx="8" fill="#eef6f1" stroke="#cbdacf"/><text x="395" y="286" text-anchor="middle" font-size="16" fill="#203035">Optimize + collision</text><path d="M494 280 H566" stroke="#147f80" stroke-width="3"/><rect x="32" y="330" width="190" height="52" rx="8" fill="#f6f2fa" stroke="#d8d1e7"/><text x="127" y="362" text-anchor="middle" font-size="17" fill="#203035">Seed 4</text><path d="M222 356 H296" stroke="#147f80" stroke-width="3"/><rect x="296" y="330" width="198" height="52" rx="8" fill="#eef6f1" stroke="#cbdacf"/><text x="395" y="362" text-anchor="middle" font-size="16" fill="#203035">Optimize + collision</text><path d="M494 356 H566" stroke="#147f80" stroke-width="3"/><rect x="566" y="164" width="164" height="136" rx="12" fill="#f8f1eb" stroke="#e4d2c7"/><text x="648" y="209" text-anchor="middle" font-size="19" fill="#203035">Feasibility</text><text x="648" y="242" text-anchor="middle" font-size="16" fill="#53676d">filter</text><path d="M730 232 H786" stroke="#147f80" stroke-width="4"/><rect x="786" y="164" width="145" height="136" rx="12" fill="#edf5f5" stroke="#bcd8d5"/><text x="858" y="209" text-anchor="middle" font-size="19" fill="#203035">Best valid</text><text x="858" y="242" text-anchor="middle" font-size="16" fill="#53676d">trajectory</text><text x="32" y="430" font-size="15" fill="#53676d">Parallelism can increase search throughput; correctness still depends on the model and validator.</text></g></svg>
