<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">候选路线映射为长度风险能耗成本向量</title><desc id="desc">一条路线在三个不同目标维度上有不同数值，不能在未定义单位和尺度时直接相加。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><path d="M145 355 L810 355 M145 355 L145 100 M145 355 L370 105" stroke="#203035" stroke-width="3" fill="none"/><path d="M145 355 L430 265 L610 190 L760 128" stroke="#147f80" stroke-width="5" fill="none"/><g fill="#147f80"><circle cx="430" cy="265" r="9"/><circle cx="610" cy="190" r="9"/><circle cx="760" cy="128" r="9"/></g><g font-size="19" fill="#203035"><text x="818" y="365">长度 L</text><text x="72" y="98">风险 R</text><text x="376" y="94">能耗 E</text><text x="449" y="294">路线 A</text><text x="628" y="217">路线 B</text><text x="775" y="127">路线 C</text></g><text x="35" y="435" font-size="15" fill="#53676d">三维示意不代表真实路线数据；成本定义和归一化尺度需公开。</text></g></svg>
