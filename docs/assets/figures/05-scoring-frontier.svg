<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">贪心与A星的单次优先队列选择</title><desc id="d">候选 P 和 Q 的已付成本和剩余估计分别为 6、1 与 2、3。贪心会选 P，A 星会选 Q。</desc><rect width="960" height="470" rx="16" fill="#fffdf9"/><g font-family="Arial, PingFang SC, sans-serif"><text x="42" y="49" font-size="21" fill="#203035" font-weight="700">同一轮候选队列</text><g fill="#fff" stroke-width="2"><rect x="60" y="94" width="395" height="251" rx="16" stroke="#d06d4d"/><rect x="510" y="94" width="395" height="251" rx="16" stroke="#147f80"/></g><g font-size="22" fill="#203035"><text x="94" y="139" font-weight="700">候选 P</text><text x="542" y="139" font-weight="700">候选 Q</text><text x="94" y="190">已走 g = 6</text><text x="94" y="236">剩余估计 h = 1</text><text x="542" y="190">已走 g = 2</text><text x="542" y="236">剩余估计 h = 3</text><text x="94" y="295" font-weight="700" fill="#d06d4d">f = 7</text><text x="542" y="295" font-weight="700" fill="#147f80">f = 5</text></g><rect x="72" y="366" width="388" height="52" rx="8" fill="#fff0e8"/><rect x="506" y="366" width="388" height="52" rx="8" fill="#e4f4ed"/><text x="93" y="399" font-size="18" fill="#af5b40" font-weight="700">贪心：选 P（h=1 更小）</text><text x="532" y="399" font-size="18" fill="#147f80" font-weight="700">A*：选 Q（f=5 更小）</text></g></svg>
