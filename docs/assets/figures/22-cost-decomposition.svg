<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">MPC每步累积过程代价，最后评估终端代价</title><desc id="d">一个四步控制序列分成四个运行成本和一项终端目标代价。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="42" y="49" font-size="22" font-weight="700" fill="#203035">Finite-horizon objective · N = 4</text><rect x="40" y="135" width="197" height="164" rx="12" fill="#f0f7f1" stroke="#b8d3c3" stroke-width="2"/><text x="57" y="171" font-size="20" font-weight="700" fill="#203035">k=0</text><text x="57" y="218" font-size="18" fill="#147f80">跟踪误差</text><text x="57" y="256" font-size="18" fill="#7461ba">控制代价</text></rect><rect x="259" y="135" width="197" height="164" rx="12" fill="#f0f7f1" stroke="#b8d3c3" stroke-width="2"/><text x="276" y="171" font-size="20" font-weight="700" fill="#203035">k=1</text><text x="276" y="218" font-size="18" fill="#147f80">跟踪误差</text><text x="276" y="256" font-size="18" fill="#7461ba">控制代价</text></rect><rect x="478" y="135" width="197" height="164" rx="12" fill="#f0f7f1" stroke="#b8d3c3" stroke-width="2"/><text x="495" y="171" font-size="20" font-weight="700" fill="#203035">k=2</text><text x="495" y="218" font-size="18" fill="#147f80">跟踪误差</text><text x="495" y="256" font-size="18" fill="#7461ba">控制代价</text></rect><rect x="697" y="135" width="197" height="164" rx="12" fill="#f0f7f1" stroke="#b8d3c3" stroke-width="2"/><text x="714" y="171" font-size="20" font-weight="700" fill="#203035">k=3</text><text x="714" y="218" font-size="18" fill="#147f80">跟踪误差</text><text x="714" y="256" font-size="18" fill="#7461ba">控制代价</text></rect><rect x="698" y="310" width="224" height="74" rx="10" fill="#fbeee7" stroke="#d06d4d" stroke-width="2"/><text x="721" y="353" font-size="19" fill="#d06d4d">终端代价 V(x₄)</text><path d="M148 300 H807 V310" stroke="#53676d" stroke-width="2" stroke-dasharray="8 6" fill="none"/><text x="35" y="433" font-size="15" fill="#53676d">运行代价衡量沿途行为，终端代价衡量预