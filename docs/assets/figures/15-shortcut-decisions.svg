<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">short-cut的候选边先检查再接受</title><desc id="d">第一阶段提出穿墙候选边，验证拒绝；第二阶段提出绕墙下侧候选，验证接受并减少节点。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="32" y="88" width="282" height="295" rx="13" fill="#f3f8f3" stroke="#d2ded6"/><text x="49" y="127" font-size="22" font-weight="700" fill="#203035">① 提议</text><rect x="140" y="169" width="66" height="106" rx="3" fill="#536767"/><path d="M71 213 L279 213" stroke="#d06d4d" stroke-width="4" stroke-dasharray="9 6"/><path d="M71 213 L119 333 L247 333 L279 213" stroke="#c4cfc7" fill="none" stroke-width="3"/><text x="50" y="369" font-size="15" fill="#53676d">候选可能穿墙</text><rect x="338" y="88" width="282" height="295" rx="13" fill="#f3f8f3" stroke="#d2ded6"/><text x="355" y="127" font-size="22" font-weight="700" fill="#203035">② 检查</text><rect x="446" y="169" width="66" height="106" rx="3" fill="#536767"/><path d="M377 213 L585 213" stroke="#d06d4d" stroke-width="4" stroke-dasharray="9 6"/><path d="M377 213 L425 333 L553 333 L585 213" stroke="#c4cfc7" fill="none" stroke-width="3"/><text x="356" y="369" font-size="15" fill="#53676d">墙内线段不可接纳</text><rect x="646" y="88" width="282" height="295" rx="13" fill="#f3f8f3" stroke="#d2ded6"/><text x="663" y="127" font-size="22" font-weight="700" fill="#203035">③ 接受合法短接</text><rect x="754" y="169" width="66" height="106" rx="3" fill="#536767"/><path d="M685 213 L893 213" stroke="#c6b1a7" stroke-width="4" stroke-dasharray="9 6"/><path d="M685 213 L733 333 L861 333 L893 213" stroke="#147f80" fill="none" stroke-width="6"/><text x="664" y="369" font-size="15" fill="#147f80">沿墙外的候选合法</text></g></svg>
