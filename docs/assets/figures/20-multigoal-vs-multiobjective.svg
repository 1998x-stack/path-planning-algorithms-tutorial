<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">多站点访问和多目标函数优化的区别</title><desc id="desc">左侧访问多个地点决定顺序，右侧在同一对起终点之间权衡多种路径成本。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="30" y="80" width="430" height="300" rx="14" fill="#f2f7f3" stroke="#d7e3da"/><rect x="500" y="80" width="430" height="300" rx="14" fill="#f7f4f9" stroke="#dcd6ea"/><text x="55" y="120" font-size="21" font-weight="700" fill="#203035">多目标点 / 多站点</text><text x="525" y="120" font-size="21" font-weight="700" fill="#203035">多目标函数</text><path d="M95 280 L190 180 L330 280 L395 170" stroke="#147f80" stroke-width="5" fill="none"/><g fill="#147f80"><circle cx="95" cy="280" r="11"/><circle cx="190" cy="180" r="11"/><circle cx="330" cy="280" r="11"/><circle cx="395" cy="170" r="11"/></g><path d="M555 280 Q670 160 875 190 M555 280 Q710 340 875 190 M555 280 L875 190" stroke="#7461ba" stroke-width="5" fill="none"/><g fill="#7461ba"><circle cx="555" cy="280" r="11"/><circle cx="875" cy="190" r="11"/></g><text x="72" y="330" font-size="17" fill="#147f80">决定访问顺序</text><text x="555" y="330" font-size="17" fill="#7461ba">比较长度 / 风险 / 能耗</text><text x="35" y="435" font-size="15" fill="#53676d">左侧改变目标点集合，右侧改变同一任务的评价函数。</text></g></svg>
