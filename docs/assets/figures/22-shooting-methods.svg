<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">单次打靶与多重打靶的变量区别</title><desc id="d">单次打靶仅优化控制然后积分出状态，多重打靶也把中间状态设为变量并用动力学连续性等式连接。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="26" y="80" width="438" height="316" rx="13" fill="#f1f7f2" stroke="#d4e0d6"/><rect x="496" y="80" width="438" height="316" rx="13" fill="#f6f2fa" stroke="#ddd7e8"/><text x="50" y="116" font-size="22" fill="#203035" font-weight="700">SINGLE SHOOTING</text><text x="522" y="116" font-size="22" fill="#203035" font-weight="700">MULTIPLE SHOOTING</text><g><rect x="61" y="180" width="102" height="52" rx="8" fill="#147f80"/><text x="112" y="211" text-anchor="middle" font-size="18" fill="#fff">u0</text><path d="M112 232 V292" stroke="#147f80" stroke-width="3"/><text x="89" y="321" font-size="18" fill="#53676d">x1</text><rect x="182" y="180" width="102" height="52" rx="8" fill="#147f80"/><text x="233" y="211" text-anchor="middle" font-size="18" fill="#fff">u1</text><path d="M233 232 V292" stroke="#147f80" stroke-width="3"/><text x="210" y="321" font-size="18" fill="#53676d">x2</text><rect x="303" y="180" width="102" height="52" rx="8" fill="#147f80"/><text x="354" y="211" text-anchor="middle" font-size="18" fill="#fff">u2</text><path d="M354 232 V292" stroke="#147f80" stroke-width="3"/><text x="331" y="321" font-size="18" fill="#53676d">x3</text></g><g><rect x="530" y="165" width="96" height="42" rx="7" fill="#7461ba"/><text x="578" y="192" font-size="17" text-anchor="middle" fill="#fff">x1</text><rect x="530" y="256" width="96" height="42" rx="7" fill="#147f80"/><text x="578" y="283" font-size="17" text-anchor="middle" fill="#fff">u0</text><path d="M578 207 V256" stroke="#d06d4d" stroke-width="3" stroke-dasharray="6 5"/><rect x="652" y="165" width="96" height="42" rx="7" fill="#7461ba"/><text x="700" y="192" font-size="17" text-anchor="middle" fill="#fff">x2</text><rect x="652" y="256" width="96" height="42" rx="7" fill="#147f80"/><text x="700" y="283" font-size="17" text-anchor="middle" fill="#fff">u1</text><path d="M700 207 V256" stroke="#d06d4d" stroke-width="3" stroke-dasharray="6 5"/><rect x="774" y="165" width="96" height="42" rx="7" fill="#7461ba"/><text x="822" y="192" font-size="17" text-anchor="middle" fill="#fff">x3</text><rect x="774" y="256" width="96" height="42" rx="7" fill="#147f80"/><text x="822" y="283" font-size="17" text-anchor="middle" fill="#fff">u2</text><path d="M822 207 V256" stroke="#d06d4d" stroke-width="3" stroke-dasharray="6 5"/></g><text x="67" y="365" font-size="16" fill="#53676d">状态由控制顺序积分生成</text><text x="535" y="365" font-size="16" fill="#53676d">状态同时为变量，需满足耦合等式</text><text x="34" y="437" font-size="15" fill="#53676d">示意变量关系；完整打靶需要包含初始状态、离散积分和每段的状态连接约束。</text></g></svg>
