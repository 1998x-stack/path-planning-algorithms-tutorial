<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">局部规划器决定哪些roadmap边合法</title><desc id="d">一条穿越矩形障碍的直连不能作为PRM边；绕墙经多个样本构成的折线可作为路径。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="47" y="47" font-size="20" font-weight="700" fill="#203035">几何“近”不等于运动上“能连接”</text><rect x="300" y="145" width="350" height="181" rx="5" fill="#536767"/><text x="416" y="246" font-size="22" fill="#fff">障碍禁区</text><circle cx="147" cy="234" r="16" fill="#147f80"/><circle cx="803" cy="234" r="16" fill="#7461ba"/><path d="M147 234 H803" stroke="#d06d4d" stroke-width="5" stroke-dasharray="13 8" fill="none"/><path d="M147 234 L248 104 L699 104 L803 234" stroke="#147f80" stroke-width="6" fill="none"/><circle cx="248" cy="104" r="9" fill="#147f80"/><circle cx="699" cy="104" r="9" fill="#147f80"/><g font-size="18" fill="#203035"><text x="130" y="270">S</text><text x="795" y="270">G</text><text x="337" y="90">每段均需检验</text><text x="358" y="365" fill="#d06d4d">直线穿墙，拒绝候选边</text></g><text x="35" y="432" font-size="15" fill="#53676d">图只针对点机器人和几何直线；汽车、机械臂的局部规划器可能完全不同。</text></g></svg>
