<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">Minkowski 膨胀的数值示意</title><desc id="d">左至右依次展示矩形障碍、机器人足迹和 C-space 碰撞区间。</desc><rect width="960" height="470" rx="16" fill="#fffdf9"/><g font-family="Arial, PingFang SC, sans-serif"><text x="35" y="42" font-size="18" fill="#53676d">设 O = [4,6] × [2,4]，机器人足迹 A = [−0.5,0.5]²，且朝向固定</text><rect x="35" y="90" width="278" height="266" rx="10" fill="#f0f6f2" stroke="#c9d8ce"/><rect x="340" y="90" width="278" height="266" rx="10" fill="#f0f6f2" stroke="#c9d8ce"/><rect x="645" y="90" width="278" height="266" rx="10" fill="#f0f6f2" stroke="#c9d8ce"/><text x="58" y="122" font-size="18" font-weight="700" fill="#203035">① 原始障碍 O</text><text x="361" y="122" font-size="18" font-weight="700" fill="#203035">② 机器人足迹 A</text><text x="661" y="122" font-size="18" font-weight="700" fill="#203035">③ 配置障碍 C_obs</text><rect x="119" y="177" width="100" height="96" fill="#b16e59"/><rect x="444" y="195" width="52" height="52" fill="#91cfc4" stroke="#147f80" stroke-width="3"/><circle cx="470" cy="221" r="5" fill="#fff"/><rect x="715" y="151" width="152" height="147" fill="#f3cdbd" stroke="#d06d4d" stroke-width="3" stroke-dasharray="7 4"/><rect x="741" y="177" width="100" height="95" fill="#b16e59"/><g font-size="17" fill="#53676d"><text x="61" y="399">x:[4,6]，y:[2,4]</text><text x="353" y="399">中心上下左右各 ±0.5</text><text x="650" y="399">x:[3.5,6.5]</text><text x="650" y="426">y:[1.5,4.5]</text></g><path d="M 314 227 h 23 m-7 -7 l7 7 -7 7 M 619 227 h 23 m-7 -7 l7 7 -7 7" fill="none" stroke="#7461ba" stroke-width="3"/></g></svg>
