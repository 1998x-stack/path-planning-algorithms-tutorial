<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">非目标位置可能出现吸引与斥力平衡</title><desc id="desc">机器人位于目标和障碍之间，目标吸引向右与障碍斥力向左大小相等，净力为零。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="50" y="86" width="860" height="300" rx="14" fill="#f3f7f3" stroke="#d7e3da"/><circle cx="600" cy="230" r="58" fill="#536767"/><circle cx="250" cy="230" r="13" fill="#203035"/><circle cx="840" cy="230" r="14" fill="#147f80"/><path d="M250 230 H450" stroke="#147f80" stroke-width="6"/><path d="M250 230 H450" stroke="#d06d4d" stroke-width="6" stroke-dasharray="9 7"/><text x="160" y="192" font-size="18" fill="#203035">q*</text><text x="500" y="320" font-size="18" fill="#53676d">障碍</text><text x="802" y="196" font-size="18" fill="#147f80">目标</text><text x="315" y="202" font-size="18" fill="#147f80">F_att →</text><text x="315" y="267" font-size="18" fill="#d06d4d">F_rep ←</text><text x="165" y="352" font-size="17" fill="#7461ba">F_total = 0，但 q* ≠ q_goal</text><text x="35" y="435" font-size="15" fill="#53676d">该平衡点由特定势能参数构造，说明局部停滞可能性，不代表每个场景必然发生。</text></g></svg>
