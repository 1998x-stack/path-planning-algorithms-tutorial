<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">同一图上的最少边数与最低总代价</title><desc id="d">S-A-B-G 三边路径总成本 5，S-B-G 两边路径总成本 7。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="36" y="49" font-size="19" fill="#53676d">有向边权不是距离几何，而是每次移动付出的成本</text><g fill="none" stroke-linecap="round"><path d="M 145 226 L 380 114 L 615 226 L 829 226" stroke="#147f80" stroke-width="8"/><path d="M 145 226 Q 380 330 615 226" stroke="#d06d4d" stroke-width="6" stroke-dasharray="13 9"/><path d="M 380 114 Q 635 52 829 226" stroke="#c6b2a5" stroke-width="3" stroke-dasharray="5 8"/></g><g font-size="19" fill="#147f80"><text x="249" y="135">2</text><text x="490" y="139">1</text><text x="718" y="198">2</text></g><text x="376" y="317" font-size="19" fill="#b45f44">5</text><text x="616" y="93" font-size="18" fill="#53676d">7</text><circle cx="145" cy="226" r="32" fill="#fff" stroke="#203035" stroke-width="3"/><text x="145" y="234" text-anchor="middle" font-size="25" fill="#203035" font-weight="700">S</text><circle cx="380" cy="114" r="32" fill="#fff" stroke="#203035" stroke-width="3"/><text x="380" y="122" text-anchor="middle" font-size="25" fill="#203035" font-weight="700">A</text><circle cx="615" cy="226" r="32" fill="#fff" stroke="#203035" stroke-width="3"/><text x="615" y="234" text-anchor="middle" font-size="25" fill="#203035" font-weight="700">B</text><circle cx="829" cy="226" r="32" fill="#fff" stroke="#203035" stroke-width="3"/><text x="829" y="234" text-anchor="middle" font-size="25" fill="#203035" font-weight="700">G</text><rect x="60" y="371" width="400" height="50" rx="9" fill="#e6f4ee"/><text x="75" y="403" font-size="18" fill="#147f80">最低成本：S → A → B → G = 5</text><rect x="500" y="371" width="400" height="50" rx="9" fill="#fff1e8"/><text x="515" y="403" font-size="18" fill="#b45f44">两条边：S → B → G = 7</text></g></svg>
