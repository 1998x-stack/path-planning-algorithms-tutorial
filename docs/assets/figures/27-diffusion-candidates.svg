<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">扩散策略产生多模态轨迹候选后仍需碰撞验证</title><desc id="svg-desc">从随机噪声逐步去噪生成上方和下方两种绕行轨迹，直线路径被障碍阻断，几何验证只放行无碰撞候选。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,'PingFang SC',sans-serif"><text x="34" y="49" font-size="22" font-weight="700" fill="#203035">Conditional trajectory generation</text><rect x="32" y="111" width="174" height="262" rx="12" fill="#f6f2fa" stroke="#d8d1e7"/><text x="119" y="150" text-anchor="middle" font-size="19" fill="#203035">Noisy sample</text><path d="M62 275 Q92 180 120 285 T178 246" stroke="#7461ba" stroke-width="5" stroke-dasharray="8 7" fill="none"/><path d="M206 242 H255" stroke="#147f80" stroke-width="4"/><rect x="255" y="111" width="260" height="262" rx="12" fill="#eef6f1" stroke="#cbdacf"/><text x="385" y="150" text-anchor="middle" font-size="19" fill="#203035">Denoising steps</text><path d="M285 300 Q345 170 485 260" stroke="#147f80" stroke-width="4" fill="none"/><path d="M285 300 Q345 380 485 300" stroke="#d06d4d" stroke-width="4" fill="none"/><rect x="362" y="205" width="70" height="46" rx="5" fill="#536767"/><text x="397" y="234" text-anchor="middle" font-size="13" fill="#fff">obstacle</text><path d="M515 242 H568" stroke="#147f80" stroke-width="4"/><rect x="568" y="111" width="168" height="262" rx="12" fill="#f8f1eb" stroke="#e4d2c7"/><text x="652" y="150" text-anchor="middle" font-size="19" fill="#203035">Verifier</text><text x="652" y="211" text-anchor="middle" font-size="16" fill="#53676d">collision</text><text x="652" y="242" text-anchor="middle" font-size="16" fill="#53676d">curvature</text><text x="652" y="273" text-anchor="middle" font-size="16" fill="#53676d">timing</text><path d="M736 242 H780" stroke="#147f80" stroke-width="4"/><rect x="780" y="154" width="150" height="177" rx="12" fill="#edf5f5" stroke="#bcd8d5"/><text x="855" y="206" text-anchor="middle" font-size="19" fill="#203035">Controller</text><text x="855" y="247" text-anchor="middle" font-size="15" fill="#53676d">valid first</text><text x="855" y="274" text-anchor="middle" font-size="15" fill="#53676d">action only</text><text x="32" y="430" font-size="15" fill="#53676d">The figure is conceptual: denoising does not itself enforce collision-free geometry.</text></g></svg>
