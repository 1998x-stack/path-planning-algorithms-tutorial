<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="vs-t vs-d"><title id="vs-t">候选圆弧轨迹与速度平面上的采样点一一对应</title><desc id="vs-d">左图为机器人当前位置发出的三条候选圆弧，分别用青绿、紫色、陶红标记；右图在 v-ω 速度平面上用相同颜色标出对应的三个速度点，虚线矩形是当前可行速度区域。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="34" y="48" font-size="20" fill="#203035" font-weight="700">位置空间：三条候选圆弧</text><text x="520" y="48" font-size="20" fill="#203035" font-weight="700">速度空间：三个采样点</text><rect x="34" y="66" width="440" height="356" rx="12" fill="#eef4f0"/><rect x="250" y="120" width="120" height="70" rx="6" fill="#536767"/><text x="286" y="162" font-size="15" fill="white">障碍</text><path d="M150 360 L 300 240" stroke="#147f80" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M150 360 Q 196 300 206 220" stroke="#7461ba" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M150 360 Q 250 336 340 312" stroke="#d06d4d" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="150" cy="360" r="11" fill="#203035"/><text x="86" y="396" font-size="15" fill="#203035">机器人</text><text x="302" y="234" font-size="14" fill="#147f80">ω=0</text><text x="176" y="214" font-size="14" fill="#7461ba">左转</text><text x="330" y="300" font-size="14" fill="#d06d4d">右转</text><line x1="600" y1="480" x2="600" y2="228" stroke="#53676d" stroke-width="2"/><line x1="586" y1="360" x2="900" y2="360" stroke="#53676d" stroke-width="2"/><text x="884" y="392" font-size="15" fill="#203035">v</text><text x="556" y="238" font-size="15" fill="#203035">ω</text><rect x="628" y="276" width="238" height="168" rx="6" fill="#147f80" fill-opacity="0.08" stroke="#147f80" stroke-width="2" stroke-dasharray="7 6"/><text x="640" y="300" font-size="14" fill="#147f80">当前可行速度窗口</text><circle cx="824" cy="360" r="9" fill="#147f80"/><text x="836" y="356" font-size="14" fill="#147f80">(0.8, 0)</text><circle cx="768" cy="288" r="9" fill="#7461ba"/><text x="690" y="278" font-size="14" fill="#7461ba">(0.6, 0.6)</text><circle cx="852" cy="420" r="9" fill="#d06d4d"/><text x="760" y="444" font-size="14" fill="#d06d4d">(0.9, −0.5)</text></g></svg>
