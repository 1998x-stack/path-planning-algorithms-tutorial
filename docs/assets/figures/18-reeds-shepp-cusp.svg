<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Reeds-Shepp允许在cusp处由前进切换为倒车</title><desc id="desc">轨迹分段标示前进和后退方向，cusp处速度方向切换，几何曲率仍受最小半径约束。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="36" y="80" width="888" height="310" rx="14" fill="#f3f7f3" stroke="#d7e3da"/><path d="M120 300 C210 110 350 110 440 240" fill="none" stroke="#147f80" stroke-width="7"/><path d="M440 240 C520 360 650 360 760 230" fill="none" stroke="#d06d4d" stroke-width="7" stroke-dasharray="12 7"/><circle cx="440" cy="240" r="13" fill="#7461ba"/><path d="M338 154 l-24 -4 l13 21" fill="#147f80"/><path d="M636 326 l22 9 l-19 12" fill="#d06d4d"/><text x="155" y="108" font-size="18" fill="#147f80">前进</text><text x="645" y="378" font-size="18" fill="#d06d4d">倒车</text><text x="455" y="220" font-size="18" fill="#7461ba">cusp / 换向</text><text x="35" y="435" font-size="15" fill="#53676d">几何示意未显示换挡时的减速至零和执行器响应。</text></g></svg>
