<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">MAPF顶点冲突和交换冲突的不同判据</title><desc id="d">同格占据与一条边的反向穿行分别展示，用文字与箭头区分。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="32" y="75" width="433" height="300" rx="12" fill="#f2f7f3" stroke="#d4e1d8"/><rect x="495" y="75" width="433" height="300" rx="12" fill="#f6f2fa" stroke="#ded5e9"/><text x="55" y="115" font-size="21" font-weight="700" fill="#203035">VERTEX：同点</text><text x="519" y="115" font-size="21" font-weight="700" fill="#203035">EDGE：交换</text><circle cx="250" cy="236" r="60" fill="#f4ded6"/><circle cx="232" cy="220" r="26" fill="#147f80"/><circle cx="269" cy="250" r="26" fill="#7461ba"/><text x="232" y="227" fill="white" font-size="19" text-anchor="middle">A</text><text x="269" y="257" fill="white" font-size="19" text-anchor="middle">B</text><circle cx="605" cy="235" r="31" fill="#147f80"/><circle cx="817" cy="235" r="31" fill="#7461ba"/><text x="605" y="242" fill="white" text-anchor="middle" font-size="19">A</text><text x="817" y="242" fill="white" text-anchor="middle" font-size="19">B</text><path d="M642 218 H774" stroke="#147f80" stroke-width="6"/><path d="M774 252 H642" stroke="#7461ba" stroke-width="6" stroke-dasharray="10 7"/><text x="579" y="340" font-size="16" fill="#53676d">同一时段，相向过同一条边</text><text x="57" y="342" font-size="16" fill="#53676d">同一时间，同一个顶点</text><text x="35" y="429" font-size="15" fill="#53676d">只检查时间片上的占据节点会漏掉边交换冲突。</text></g></svg>
