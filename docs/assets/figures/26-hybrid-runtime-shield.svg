<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">学习提议与经典安全验证分层</title><desc id="svg-desc">模型提出候选轨迹，验证器检查地图碰撞与动力学约束，失败时回退经典规划或安全停止。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,'PingFang SC',sans-serif"><rect x="30" y="125" width="190" height="125" rx="12" fill="#f6f2fa" stroke="#d8d1e7"/><text x="125" y="169" text-anchor="middle" font-size="20" fill="#203035" font-weight="700">Learned proposer</text><text x="125" y="207" text-anchor="middle" font-size="16" fill="#53676d">scores / candidates</text><path d="M220 188 H285" stroke="#147f80" stroke-width="4"/><rect x="285" y="125" width="202" height="125" rx="12" fill="#eef6f1" stroke="#cbdacf"/><text x="386" y="169" text-anchor="middle" font-size="20" fill="#203035" font-weight="700">Verifier</text><text x="386" y="207" text-anchor="middle" font-size="16" fill="#53676d">collision / dynamics</text><path d="M487 164 H559" stroke="#147f80" stroke-width="4"/><text x="522" y="146" font-size="14" fill="#147f80">valid</text><rect x="559" y="125" width="174" height="125" rx="12" fill="#edf5f5" stroke="#bcd8d5"/><text x="646" y="169" text-anchor="middle" font-size="20" fill="#203035">Controller</text><text x="646" y="207" text-anchor="middle" font-size="16" fill="#53676d">execute first action</text><path d="M386 250 V323 H646 V250" stroke="#d06d4d" stroke-width="4" fill="none"/><text x="510" y="348" text-anchor="middle" font-size="15" fill="#d06d4d">no valid candidate</text><rect x="748" y="284" width="180" height="84" rx="12" fill="#f8eee8" stroke="#e2cfc3"/><text x="838" y="319" text-anchor="middle" font-size="18" fill="#203035">A* fallback</text><text x="838" y="347" text-anchor="middle" font-size="15" fill="#53676d">or stop</text><path d="M733 323 H748" stroke="#d06d4d" stroke-width="4"/><text x="34" y="415" font-size="15" fill="#53676d">The verifier only covers its explicit model and trusted inputs.</text></g></svg>
