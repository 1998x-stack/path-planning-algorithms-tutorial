<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">ROS2导航诊断管线从TF和地图到规划和控制</title><desc id="d">地图与定位变换、costmap、规划器、控制器和里程计回馈按时间轴串联，需保存可复查日志。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><g font-size="19" fill="#203035"><rect x="28" y="111" width="186" height="112" rx="12" fill="#f0f7f1" stroke="#cbdacf"/><text x="49" y="157" font-weight="700">TF / Odometry</text><text x="49" y="191" font-size="16">frame / stamp</text><rect x="271" y="111" width="186" height="112" rx="12" fill="#f0f7f1" stroke="#cbdacf"/><text x="293" y="157" font-weight="700">Costmap</text><text x="293" y="191" font-size="16">footprint / cells</text><rect x="514" y="111" width="186" height="112" rx="12" fill="#f6f2fa" stroke="#d9cfe6"/><text x="538" y="157" font-weight="700">Planner</text><text x="538" y="191" font-size="16">OPEN / path</text><rect x="755" y="111" width="186" height="112" rx="12" fill="#f6f2fa" stroke="#d9cfe6"/><text x="780" y="157" font-weight="700">Controller</text><text x="780" y="191" font-size="16">cmd / error</text></g><g stroke="#147f80" stroke-width="4"><path d="M214 168 H270 M457 168 H513 M700 168 H755"/></g><path d="M845 224 V309 H124 V224" stroke="#d06d4d" stroke-width="4" fill="none"/><text x="334" y="338" font-size="18" fill="#d06d4d">反馈：实测速度 / 姿态 / 时间戳</text><text x="35" y="430" font-size="15" fill="#53676d">可观察性不是仅打开RViz；还要保存可重放消息、参数、版本和同步关系。</text></g></svg>
