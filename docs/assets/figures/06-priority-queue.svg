<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Dijkstra 最小堆队列的变化</title><desc id="d">把 S、A、B、G 的暂定优先级与旧条目区分，显示从初始到目标被确认的四轮。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="34" y="54" width="894" height="82" rx="11" fill="#f6f8f4" stroke="#d5e0d7"/><rect x="51" y="68" width="60" height="54" rx="9" fill="#203035"/><text x="81" y="102" fill="#fff" text-anchor="middle" font-size="22">0</text><text x="132" y="84" font-size="14" fill="#53676d">有效队列项和过期候选（示意）</text><text x="132" y="112" font-size="19" fill="#203035">(0,S)</text><text x="754" y="106" font-size="19" fill="#147f80">S=0</text><rect x="34" y="149" width="894" height="82" rx="11" fill="#f6f8f4" stroke="#d5e0d7"/><rect x="51" y="163" width="60" height="54" rx="9" fill="#203035"/><text x="81" y="197" fill="#fff" text-anchor="middle" font-size="22">1</text><text x="132" y="179" font-size="14" fill="#53676d">有效队列项和过期候选（示意）</text><text x="132" y="207" font-size="19" fill="#203035">(2,A) (5,B)</text><text x="754" y="201" font-size="19" fill="#147f80">A=2</text><rect x="34" y="244" width="894" height="82" rx="11" fill="#f6f8f4" stroke="#d5e0d7"/><rect x="51" y="258" width="60" height="54" rx="9" fill="#203035"/><text x="81" y="292" fill="#fff" text-anchor="middle" font-size="22">2</text><text x="132" y="274" font-size="14" fill="#53676d">有效队列项和过期候选（示意）</text><text x="132" y="302" font-size="19" fill="#203035">(3,B) (5,B) (9,G)</text><text x="754" y="296" font-size="19" fill="#147f80">B=3</text><rect x="34" y="339" width="894" height="82" rx="11" fill="#e6f4ee" stroke="#d5e0d7"/><rect x="51" y="353" width="60" height="54" rx="9" fill="#203035"/><text x="81" y="387" fill="#fff" text-anchor="middle" font-size="22">3</text><text x="132" y="369" font-size="14" fill="#53676d">有效队列项和过期候选（示意）</text><text x="132" y="397" font-size="19" fill="#203035">(5,G) (9,G)</text><text x="754" y="391" font-size=