<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">足迹膨胀和安全距离区分机器人尺寸与规划可通行空间</title><desc id="d">机器人外形围绕中心点，左侧点模型低估宽度，右侧足迹膨胀后保留障碍安全距离。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><rect x="37" y="83" width="887" height="301" rx="14" fill="#f3f7f3" stroke="#d5e2d8"/><rect x="226" y="140" width="130" height="180" rx="4" fill="#536767"/><rect x="598" y="140" width="130" height="180" rx="4" fill="#536767"/><circle cx="160" cy="230" r="11" fill="#147f80"/><path d="M160 230 H226" stroke="#d06d4d" stroke-dasharray="9 6" stroke-width="4"/><rect x="473" y="192" width="85" height="80" rx="9" fill="#d8eecf" stroke="#147f80" stroke-width="3"/><rect x="572" y="114" width="183" height="233" rx="17" fill="none" stroke="#d06d4d" stroke-dasharray="12 7" stroke-width="4"/><text x="64" y="121" font-size="20" fill="#203035">点模型：低估车宽</text><text x="482" y="121" font-size="20" fill="#203035">足迹 + 膨胀裕量</text><text x="33" y="437" font-size="15" fill="#53676d">膨胀半径不是自动安全认证；真实车体扫掠和制动距离仍需单独评估。</text></g></svg>
