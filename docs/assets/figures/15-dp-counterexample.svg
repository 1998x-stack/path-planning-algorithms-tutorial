<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Douglas–Peucker可将有效绕行折线简化成穿墙直线</title><desc id="d">左图原路径绕开墙，右图高容差只保留起点和目标，生成一条穿越障碍的直线。</desc><rect width="960" height="460" rx="18" fill="#fffdf9"/><g font-family="Arial,PingFang SC,sans-serif"><text x="41" y="46" font-size="21" font-weight="700" fill="#203035">小容差：仍跟随原路径</text><text x="513" y="46" font-size="21" font-weight="700" fill="#203035">大容差：可能只剩 S 与 G</text><rect x="181" y="188.5" width="153" height="125.10000000000001" fill="#536767" rx="4"/><text x="235.9" y="255.1" font-size="18" fill="white">障碍</text><rect x="661" y="188.5" width="153" height="125.10000000000001" fill="#536767" rx="4"/><text x="715.9" y="255.1" font-size="18" fill="white">障碍</text><polyline points="72,288 72,370 179,393 389,393 441,370 441,288" stroke="#147f80" stroke-width="6" fill="none"/><path d="M549 288 H915" stroke="#d06d4d" stroke-dasharray="14 9" stroke-width="6"/><circle cx="549" cy="288" r="11" fill="#147f80"/><circle cx="915" cy="288" r="11" fill="#7461ba"/><text x="30" y="438" font-size="15" fill="#53676d">几何偏差控制不是无碰撞证明；简化后必须检查所有新增线段。</text></g></svg>
