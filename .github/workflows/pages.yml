name: Validate and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate site
        run: python tools/validate_site.py
      - name: Run chapter code examples
        run: python tools/validate_examples.py
      - name: Build static output
        run: python tools/build_site.py
      - name: Install Chromium browser QA tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run browser QA against the built Pages artifact
        run: python tools/browser_check.py
      - name: Upload browser QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-pages
          path: reports/browser/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
